    (function () {
      const cv = document.getElementById("s5-cv"), ctx = cv.getContext("2d");
      const D = 13.0;
      // GSAP drives a getter/setter, so every seek redraws the canvas at exactly that time

      window.__timelines["s5"] = tl;
