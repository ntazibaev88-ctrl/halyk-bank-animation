      $("s6-pic0").innerHTML = pic("linear-gradient(180deg,#2F7FD1,#BFE3FA)", A.place(A.cloud("#fff", 0.9), { x: 520, base: 130, s: 0.6 }) + A.place(A.museum(d), { x: 330, base: 446, s: 1.0, cls: "s6-art" }));

      $("s6-pic2").innerHTML = pic("linear-gradient(180deg,#12305C,#3E7CC0 70%,#F2B84B)", A.stars(26, 660, 240, rnd) + A.place(A.opera(A.theme.dusk), { x: 330, base: 446, s: 1.08, cls: "s6-art" }));
      h = "";
      for (let i = 0; i < 30; i++) h += '<div class="s6-fl" style="left:' + (rnd() * 1060).toFixed(0) + 'px"></div>';
      $("s6-fall").innerHTML = h;

      const tl = gsap.timeline({ paused: true });
      const w = function (p, n, f) { return A.word("s6", p, n, f); };
      const tMun = w("Мұнда", 0, 4.6), tMuz = w("мұражай", 0, 5.3), tSau = w("сәулет", 0, 7.3), tMad = w("мәдени", 0, 8.9), tQala = w("Қала", 1, 12.2), tJyl = w("жылдың", 0, 13.1);

      tl.fromTo("#s6-far", { x: 40 }, { x: -40, duration: D, ease: "none" }, 0);

      tl.fromTo("#s6-boat", { y: 0 }, { y: 7, duration: 1.1, ease: "sine.inOut", repeat: 15, yoyo: true }, 0);

      tl.set({}, {}, D);
