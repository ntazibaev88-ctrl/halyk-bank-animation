 </g>

<div class="kick" id="s4-k" style="opacity:0">Турбина и генератор</div>

<div class="lbl blue" id="s4-l2" style="left:60px;top:960px;opacity:0">ТУРБИНА</div>
<div class="lbl" id="s4-l3" style="left:600px;top:930px;opacity:0">ГЕНЕРАТОР</div>
<div class="lbl blue" id="s4-l4" style="left:620px;top:1020px;opacity:0;display:none">ВАЛ</div>
<div class="lbl blue" id="s4-l5" style="left:760px;top:1000px;opacity:0;display:none">ЭЛЕКТРОЭНЕРГИЯ</div>
<div class="lbl" id="s4-l6" style="left:690px;top:520px;opacity:0">РОТОР</div>

<div class="mon" id="s4-m3" style="left:490px;opacity:0">ЧАСТОТА ВРАЩЕНИЯ</div>
</div>
<script>
const NS="http://www.w3.org/2000/svg";
const G=(id)=>document.getElementById(id);
const SEL=(s)=>Array.from(document.querySelectorAll(s));
/* animated flow: dashed overlay path whose dash offset travels along the pipe (direction = path direction) */
function flow(tl,sel,t0,dur,speed){SEL(sel).forEach(p=>{p.setAttribute("pathLength","100");tl.fromTo(p,{strokeDashoffset:0},{strokeDashoffset:-(speed||120),duration:dur,ease:"none"},t0)})}
function spin(tl,sel,cx,cy,t0,dur,turns){SEL(sel).forEach(e=>tl.fromTo(e,{rotation:0,svgOrigin:cx+" "+cy},{rotation:360*turns,svgOrigin:cx+" "+cy,duration:dur,ease:"none"},t0))}
function pulse(tl,sel,t0,dur,lo,hi,per){const n=Math.floor(dur/per);SEL(sel).forEach(e=>tl.fromTo(e,{opacity:lo},{opacity:hi,duration:per/2,ease:"sine.inOut",yoyo:true,repeat:n*2-1,immediateRender:false},t0))}
function popIn(tl,sel,t0,o){o=o||{};SEL(sel).forEach((e,i)=>tl.fromTo(e,{opacity:0,y:o.y===undefined?24:o.y,scale:o.s||1},{opacity:1,y:0,scale:1,duration:o.d||.5,ease:o.e||"back.out(1.6)"},t0+i*(o.stag||0)))}
function draw(tl,sel,t0,dur,stag){SEL(sel).forEach((e,i)=>{e.setAttribute("pathLength","1");tl.fromTo(e,{strokeDasharray:"1 1",strokeDashoffset:1},{strokeDashoffset:0,duration:dur,ease:"power2.inOut"},t0+i*(stag||0))})}
/* gauge needle sweep */
function needle(tl,sel,cx,cy,t0,keys){SEL(sel).forEach(e=>{keys.forEach((k,i)=>tl.to(e,{rotation:k[1],svgOrigin:cx+" "+cy,duration:k[2],ease:k[3]||"sine.inOut"},k[0]))})}
function steamPuffs(tl,sel,t0,dur,per,rise,drift){SEL(sel).forEach((e,i)=>{const n=Math.max(1,Math.floor(dur/per));tl.fromTo(e,{opacity:0,y:0,x:0,scale:.4},{keyframes:[{opacity:.7,duration:per*.2},{opacity:0,duration:per*.8}],y:-rise,x:drift||0,scale:1.6,duration:per,ease:"none",repeat:n-1,repeatDelay:0},t0+i*per/(SEL(sel).length))})}
function mk(parent,html){const g=document.createElementNS(NS,"g");g.innerHTML=html;(typeof parent==="string"?G(parent):parent).appendChild(g);return g}
function shade(hex,k){const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;const f=k<0?0:255,t=Math.abs(k);r=Math.round((f-r)*t+r);g=Math.round((f-g)*t+g);b=Math.round((f-b)*t+b);return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}
/* pseudo-3D box: front face + top + side */
function box(parent,x,y,w,h,d,fill,stroke){const t=shade(fill,.22),s=shade(fill,-.3),st=stroke||"#4a6794";
 return mk(parent,`<polygon points="${x},${y} ${x+d},${y-d*.55} ${x+w+d},${y-d*.55} ${x+w},${y}" fill="${t}" stroke="${st}" stroke-width="2"/><polygon points="${x+w},${y} ${x+w+d},${y-d*.55} ${x+w+d},${y+h-d*.55} ${x+w},${y+h}" fill="${s}" stroke="${st}" stroke-width="2"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" stroke="${st}" stroke-width="2.5"/>`)}
/* round gauge with needle (needle element id = id+"-n"); returns group */
function gauge(parent,id,cx,cy,r,col){col=col||"#35c4ff";let tk="";for(let i=0;i<=10;i++){const a=(-120+i*24)*Math.PI/180;const x1=cx+Math.sin(a)*r*.78,y1=cy-Math.cos(a)*r*.78,x2=cx+Math.sin(a)*r*.92,y2=cy-Math.cos(a)*r*.92;tk+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${i>8?"#ff3b3b":"#9fb4d6"}" stroke-width="${i%5?3:5}"/>`}
 return mk(parent,`<circle cx="${cx}" cy="${cy}" r="${r+10}" fill="#27354f" stroke="#6c7f9c" stroke-width="5"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="#07101f" stroke="${col}" stroke-width="2" opacity="1"/>${tk}<path d="M${cx+Math.sin(96*Math.PI/180)*r*.62} ${cy-Math.cos(96*Math.PI/180)*r*.62} A${r*.62} ${r*.62} 0 0 1 ${cx+Math.sin(120*Math.PI/180)*r*.62} ${cy-Math.cos(120*Math.PI/180)*r*.62}" stroke="#ff3b3b" stroke-width="6" fill="none"/><g id="${id}-n"><line x1="${cx}" y1="${cy+r*.18}" x2="${cx}" y2="${cy-r*.74}" stroke="#ff8a1f" stroke-width="5" stroke-linecap="round"/></g><circle cx="${cx}" cy="${cy}" r="9" fill="#cfd8ea"/>`)}

(function(){
const tl=gsap.timeline({paused:true});
/* turbine discs (blade rows) */
const D=G("s4-discs");
for(let i=0;i<7;i++){const x=130+i*62,h=18+i*7,cy=820-(i*-1)*0;mk(D,`<line class="bl" x1="${x}" y1="${820-h-14}" x2="${x}" y2="${820+h+14}" stroke="#35c4ff" stroke-width="9" stroke-dasharray="7 6" opacity=".95"/><rect x="${x-3}" y="${820-h-14}" width="6" height="${2*h+28}" fill="none"/>`)}
/* condenser tubes */
const CT=G("s4-ctubes");for(let i=0;i<8;i++){const l=document.createElementNS(NS,"line");l.setAttribute("x1",400);l.setAttribute("x2",620);l.setAttribute("y1",1018+i*8);l.setAttribute("y2",1018+i*8);CT.appendChild(l)}
/* generator coils */
const CO=G("s4-coils");for(let i=0;i<9;i++){const r=document.createElementNS(NS,"rect");r.setAttribute("x",625+i*24);r.setAttribute("y",772);r.setAttribute("width",14);r.setAttribute("height",96);r.setAttribute("rx",7);r.setAttribute("fill","url(#s4-cop)");r.setAttribute("class","coil");CO.appendChild(r)}
/* rotor blades end-view */
const rb=G("s4-rbl");let sp="";for(let i=0;i<12;i++){sp+=`<rect x="-4" y="-86" width="8" height="38" fill="#35c4ff" transform="rotate(${i*30})"/>`}
mk(rb,`<g id="s4-rotv" transform="translate(880 600)">${sp}<circle r="28" fill="#cfd8ea"/><circle r="46" fill="none" stroke="#6c7f9c" stroke-width="4"/></g>`);
/* city */
const C=G("s4-city");const wins=[];
for(let i=0;i<7;i++){const x=720+i*48,h=70+((i*37)%5)*22;mk(C,`<rect x="${x}" y="${1290-h}" width="42" height="${h}" fill="#14233f" stroke="#2f4a7a" stroke-width="2"/>`);for(let r=0;r<Math.floor(h/24);r++)for(let c=0;c<2;c++){const e=document.createElementNS(NS,"rect");e.setAttribute("x",x+8+c*18);e.setAttribute("y",1290-h+8+r*22);e.setAttribute("width",10);e.setAttribute("height",12);e.setAttribute("fill","#ffcf7a");e.setAttribute("opacity",0);C.appendChild(e);wins.push(e)}}
/* monitors */
const M=G("s4-mons");
for(let i=0;i<3;i++){const x=50+i*220;mk(M,`<rect x="${x}" y="1190" width="200" height="90" rx="10" fill="#07101f" stroke="#35c4ff" stroke-width="2" class="mp" opacity="0"/><polyline class="ln" points="${x+10},1250 ${x+40},1230 ${x+70},1245 ${x+100},1215 ${x+130},1240 ${x+160},1225 ${x+190},1238" fill="none" stroke="${i==1?"#ff8a1f":"#35c4ff"}" stroke-width="4" opacity="0"/>`)}
/* ---- timeline ---- */
tl.fromTo("#s4-k",{opacity:0,x:-30},{opacity:1,x:0,duration:.4},.3);
tl.fromTo("#s4-t",{opacity:0,y:30},{opacity:1,y:0,duration:.6,ease:"power3.out"},.45);
tl.fromTo("#s4-cam",{opacity:0,y:60},{opacity:1,y:0,duration:.9,ease:"power3.out"},.5);
tl.fromTo("#s4-cam",{scale:1.0,svgOrigin:"540 880"},{scale:1.07,svgOrigin:"540 880",duration:14.5,ease:"sine.inOut",immediateRender:false},.5);
const word=(id,t)=>{tl.to(id,{opacity:1,color:"#ff8a1f",duration:.3},t);tl.to(id,{color:"#ffffff",duration:.4},t+1.6)};
word("#s4-w1",.8);word("#s4-w2",2.2);word("#s4-w3",5.0);word("#s4-w4",7.3);
/* motion */
flow(tl,"#s4-inF",.8,14,260);flow(tl,"#s4-inF2",.8,14,340);flow(tl,"#s4-exF",1.5,13,260);
SEL("#s4-discs .bl").forEach((e,i)=>{e.setAttribute("pathLength","100");tl.fromTo(e,{strokeDashoffset:0},{strokeDashoffset:-400,duration:14,ease:"none"},1.0)});
tl.fromTo("#s4-rotv",{rotation:0,svgOrigin:"880 600"},{rotation:360*9,svgOrigin:"880 600",duration:14,ease:"power1.in"},1.0);
SEL("#s4-coils .coil").forEach((e,i)=>tl.fromTo(e,{opacity:.55},{opacity:1,duration:.12,yoyo:true,repeat:100,ease:"sine.inOut"},.9+i*.04));
flow(tl,"#s4-eF",5.2,9.4,-300);flow(tl,"#s4-e2F",5.4,9.2,-300);
SEL("#s4-ctubes line").forEach((e,i)=>tl.fromTo(e,{opacity:.4},{opacity:1,duration:.5,yoyo:true,repeat:25,ease:"sine.inOut"},1+i*.1));
/* labels */
tl.fromTo("#s4-l1",{opacity:0,x:-20},{opacity:1,x:0,duration:.4},.9);
tl.fromTo("#s4-l2",{opacity:0,x:-20},{opacity:1,x:0,duration:.4},2.3);
tl.fromTo("#s4-l6",{opacity:0,x:20},{opacity:1,x:0,duration:.4},3.0);
tl.to("#s4-l1",{opacity:0,duration:.3},3.6);
tl.fromTo("#s4-l3",{opacity:0,x:-20},{opacity:1,x:0,duration:.4},5.0);
tl.fromTo("#s4-gglow",{opacity:0},{opacity:1,duration:.6},5.0);pulse(tl,"#s4-gglow",5.6,9,.6,1,.6);
/* city lights up when electricity arrives */
wins.forEach((e,i)=>tl.fromTo(e,{opacity:0},{opacity:.4+((i*3)%4)*.18,duration:.15},7.4+i*.05));
tl.to("#s4-l2",{opacity:0,duration:.3},7.6);tl.to("#s4-l6",{opacity:0,duration:.3},7.6);tl.to("#s4-l3",{opacity:0,duration:.3},8.6);
/* monitors during control sentence */
SEL("#s4-mons .mp").forEach((e,i)=>tl.fromTo(e,{opacity:0},{opacity:1,duration:.4},9.3+i*.5));
SEL("#s4-mons .ln").forEach((e,i)=>{tl.fromTo(e,{opacity:0},{opacity:1,duration:.3},9.6+i*.5);tl.fromTo(e,{x:0},{x:-24,duration:.5,yoyo:true,repeat:14,ease:"sine.inOut",immediateRender:false},9.9+i*.5)});
["#s4-m1","#s4-m2","#s4-m3"].forEach((m,i)=>tl.fromTo(m,{opacity:0,y:10},{opacity:1,y:0,duration:.4},9.5+i*.5));
window.__timelines["s4"]=tl;
})();
</script>
