<template id="sc-almaty-template">
<div data-composition-id="sc-almaty" data-width="1080" data-height="1920" class="alm">
  <canvas class="plate" id="alm-cv" width="1080" height="1920"></canvas>
  <div class="abs" id="alm-shade" style="inset:0;background:linear-gradient(180deg,rgba(3,8,18,.62) 0%,rgba(3,8,18,0) 32%,rgba(3,8,18,0) 62%,rgba(3,8,18,.78) 100%)"></div>

  <div class="hud" id="alm-h1" style="left:72px;top:96px">02 &nbsp;/&nbsp; <b>Алматы</b></div>
  <div class="hud" id="alm-h2" style="left:72px;top:134px;font-size:20px;color:#9fb8d6">43°14′ с. ш. &nbsp; 76°57′ в. д.</div>
  <div class="abs glass" id="alm-map" style="right:60px;top:84px;width:238px;height:300px;padding:18px 24px;opacity:0"></div>

  <div class="lbl" id="alm-l1" style="top:260px"><div class="lbl-k">01 · Горы</div><div class="lbl-t">Заилийский<br>Алатау</div><div class="lbl-s">северный Тянь-Шань у порога города</div><i class="lbl-line"></i></div>
  <div class="lbl" id="alm-l2" style="top:260px"><div class="lbl-k">02 · Панорама</div><div class="lbl-t">Кок-Тобе</div><div class="lbl-s">смотровая гора и канатная дорога</div><i class="lbl-line"></i></div>
  <div class="lbl" id="alm-l3" style="top:260px"><div class="lbl-k">03 · Улицы</div><div class="lbl-t">Ритм<br>мегаполиса</div><div class="lbl-s">проспекты, огни и вечерний трафик</div><i class="lbl-line"></i></div>
  <div class="lbl" id="alm-l4" style="top:260px"><div class="lbl-k">04 · Природа</div><div class="lbl-t">Зелёные<br>парки</div><div class="lbl-s">сады, аллеи и тень деревьев</div><i class="lbl-line"></i></div>
  <div class="lbl" id="alm-l5" style="top:260px"><div class="lbl-k">05 · Силуэт</div><div class="lbl-t">Южная<br>столица</div><div class="lbl-s">город у подножия гор</div><i class="lbl-line"></i></div>

  <!-- elevation profile (geographic element) -->
  <div class="abs" id="alm-elev" style="left:72px;top:1180px;width:936px;height:230px;opacity:0">
    <svg viewBox="0 0 936 230" width="936" height="230" style="overflow:visible">
      <line x1="0" y1="200" x2="936" y2="200" stroke="rgba(255,255,255,.35)" stroke-width="2"/>
      <path id="alm-prof-fill" d="M0 200 L0 176 C120 170 220 150 320 120 C430 84 520 70 610 44 C690 20 760 12 936 8 L936 200Z" fill="rgba(55,224,176,.14)"/>
      <path id="alm-prof" d="M0 176 C120 170 220 150 320 120 C430 84 520 70 610 44 C690 20 760 12 936 8" fill="none" stroke="#37e0b0" stroke-width="5" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1.2" stroke-dashoffset="1.1"/>
      <circle id="alm-prof-dot" r="9" fill="#fff" cx="0" cy="176"/>
      <text x="0" y="226" fill="#cfe0f5" font-size="24" font-weight="700" letter-spacing="2">ГОРОД · ≈ 800 м</text>
      <text x="936" y="226" fill="#cfe0f5" font-size="24" font-weight="700" letter-spacing="2" text-anchor="end">ПИК ТАЛГАР · 4 979 м</text>
    </svg>
  </div>
  <script>
  (function(){
    const { W,H,ease,prog,shotMix,bind,grade,clamp } = KIT;
    ShotsAlmaty.init();
    const shots=[{a:0,b:2},{a:2,b:4},{a:4,b:6},{a:6,b:8},{a:8,b:10.2}];
    const tl=gsap.timeline({paused:true}), cv=document.getElementById('alm-cv');
    const $=id=>document.getElementById(id);
    bind(tl,cv,10.2,(ctx,t)=>{ ctx.clearRect(0,0,W,H); shotMix(ctx,t,shots,(i,c,lt,d)=>ShotsAlmaty.draw(i,c,lt,d),.34); grade(ctx,t,{vignette:.6,tint:'rgba(255,170,90,.18)'}); });
    // entry: scene "lands" with a slow scale settle
    tl.fromTo(cv,{scale:1.08,transformOrigin:'50% 50%'},{scale:1,duration:2.2,ease:'power2.out'},0);
    UI.fade(tl,$('alm-h1'),.2); UI.fade(tl,$('alm-h2'),.35);
    const pulse=HUD.miniMap($('alm-map'),'almaty');
    tl.fromTo($('alm-map'),{opacity:0,scale:.85},{opacity:1,scale:1,duration:.6,ease:'back.out(1.6)'},.5);
    tl.fromTo(pulse,{attr:{r:26},opacity:1},{attr:{r:90},opacity:0,duration:1.1,repeat:8,ease:'power1.out'},.6);
    ['alm-l1','alm-l2','alm-l3','alm-l4','alm-l5'].forEach((id,i)=>UI.label(tl,$(id),shots[i].a+.35, i<4?shots[i].b-.1:undefined));
    // elevation profile with the mountains shot
    tl.set($('alm-elev'),{opacity:1},.9);
    tl.fromTo($('alm-elev'),{y:40,opacity:0},{y:0,opacity:1,duration:.5,ease:'power3.out'},.9);
    tl.to($('alm-prof'),{strokeDashoffset:0,duration:1.0,ease:'power2.inOut'},1.0);
    const path=$('alm-prof'),L=path.getTotalLength?path.getTotalLength():900,o={u:0};
    tl.to(o,{u:1,duration:1.0,ease:'power2.inOut',onUpdate(){const p=path.getPointAtLength(o.u*L);$('alm-prof-dot').setAttribute('cx',p.x);$('alm-prof-dot').setAttribute('cy',p.y);}},1.0);
    tl.fromTo($('alm-prof-fill'),{opacity:0},{opacity:1,duration:.6},1.6);
    tl.to($('alm-elev'),{opacity:0,y:-20,duration:.3,ease:'power2.in'},1.85);
    window.__timelines['sc-almaty']=tl;
  })();
  </script>
</div></template>
