<template id="sc-opening-template">
<div data-composition-id="sc-opening" data-width="1080" data-height="1920">
  <canvas class="plate" id="op-cv" width="1080" height="1920"></canvas>
  <div class="abs" style="inset:0;background:linear-gradient(180deg,rgba(3,8,18,.5),rgba(3,8,18,0) 30%,rgba(3,8,18,0) 70%,rgba(3,8,18,.75))"></div>
  <div class="hud" id="op-k" style="left:0;width:1080px;text-align:center;top:118px;font-size:26px;letter-spacing:.42em;color:#dfeaf8">Два города · два мира</div>
  <div class="abs" id="op-a" style="left:64px;top:250px;font-size:176px;font-weight:900;letter-spacing:-.035em;line-height:1;color:#fff;text-shadow:0 10px 60px rgba(0,0,0,.5);opacity:0;white-space:nowrap">АЛМАТЫ</div>
  <div class="abs" id="op-a2" style="left:70px;top:446px;font-size:30px;font-weight:700;letter-spacing:.3em;color:var(--alm);opacity:0">ГОРЫ · САДЫ · ЮГ</div>
  <div class="abs" id="op-b" style="right:64px;top:1160px;font-size:176px;font-weight:900;letter-spacing:-.035em;line-height:1;color:#fff;text-shadow:0 10px 60px rgba(0,0,0,.5);opacity:0;white-space:nowrap;text-align:right">АСТАНА</div>
  <div class="abs" id="op-b2" style="right:70px;top:1356px;font-size:30px;font-weight:700;letter-spacing:.3em;color:var(--ast);opacity:0;text-align:right">СТЕПЬ · СТЕКЛО · БУДУЩЕЕ</div>
  <div class="abs" id="op-vs" style="left:410px;top:861px;width:260px;height:260px;opacity:0">
    <svg viewBox="0 0 260 260" width="260" height="260"><defs><linearGradient id="vsg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#37e0b0"/><stop offset="1" stop-color="#ffb43c"/></linearGradient></defs>
      <circle cx="130" cy="130" r="118" fill="rgba(5,11,22,.88)" stroke="url(#vsg)" stroke-width="5"/>
      <circle id="op-ring" cx="130" cy="130" r="104" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2" stroke-dasharray="4 14" stroke-linecap="round"/>
      <text x="130" y="158" text-anchor="middle" font-family="Inter" font-weight="900" font-size="92" fill="#fff" letter-spacing="-2">VS</text></svg>
  </div>
  <script>
  (function(){
    const { W,H,ease,prog,lerp,bind,grade,glow } = KIT; ShotsAlmaty.init(); ShotsAstana.init();
    const tl=gsap.timeline({paused:true}), $=id=>document.getElementById(id), D=5.2;
    const seam=(x,t)=>1010-(x-540)*.19;
    bind(tl,$('op-cv'),D,(ctx,t)=>{ ctx.clearRect(0,0,W,H);
      const p=ease.outq(prog(t,0,1.3)), push=ease.io(t/D);
      ctx.save(); ctx.beginPath(); const up=(1-p)*0; ctx.moveTo(0,seam(0)*p*0+ (seam(0)-seam(0)*p)); ctx.lineTo(W,seam(W)-seam(W)*p); ctx.lineTo(W,seam(W)-3); ctx.lineTo(0,seam(0)-3); ctx.closePath(); ctx.clip();
      ctx.translate(0,-330+(1-p)*-120); ctx.translate(540,960); ctx.scale(1+push*.12,1+push*.12); ctx.translate(-540,-960); ShotsAlmaty.draw(0,ctx,t+1,6); ctx.restore();
      ctx.save(); ctx.beginPath(); ctx.moveTo(0,seam(0)+3); ctx.lineTo(W,seam(W)+3); ctx.lineTo(W,seam(W)+(H-seam(W))*p); ctx.lineTo(0,seam(0)+(H-seam(0))*p); ctx.closePath(); ctx.clip();
      ctx.translate(0,(1-p)*140); ctx.translate(540,1100); ctx.scale(1+push*.14,1+push*.14); ctx.translate(-540,-1100); ShotsAstana.draw(4,ctx,t+1,6); ctx.restore();
      // seam glow
      const sg=ctx.createLinearGradient(0,0,W,0); sg.addColorStop(0,'#37e0b0'); sg.addColorStop(1,'#ffb43c'); ctx.save(); ctx.strokeStyle=sg; ctx.lineWidth=6; ctx.shadowColor='#fff'; ctx.shadowBlur=26; ctx.globalAlpha=Math.min(1,p*2); ctx.beginPath(); ctx.moveTo(0,seam(0)); ctx.lineTo(W,seam(W)); ctx.stroke(); ctx.restore();
      grade(ctx,t,{vignette:.6});
    });
    tl.fromTo($('op-k'),{opacity:0,y:-20},{opacity:1,y:0,duration:.8,ease:'power3.out'},.4);
    tl.fromTo($('op-a'),{x:-700,opacity:0},{x:0,opacity:1,duration:1,ease:'power4.out'},.5);
    tl.fromTo($('op-b'),{x:700,opacity:0},{x:0,opacity:1,duration:1,ease:'power4.out'},.7);
    tl.fromTo($('op-a2'),{opacity:0,x:-30},{opacity:1,x:0,duration:.6},1.3); tl.fromTo($('op-b2'),{opacity:0,x:30},{opacity:1,x:0,duration:.6},1.5);
    tl.fromTo($('op-vs'),{scale:0,rotation:-120,opacity:0},{scale:1,rotation:0,opacity:1,duration:.9,ease:'back.out(1.8)'},1.0);
    tl.to($('op-ring'),{rotation:360,svgOrigin:'130 130',duration:5,ease:'none'},1.0);
    tl.to($('op-vs'),{scale:1.08,duration:.5,yoyo:true,repeat:5,ease:'sine.inOut'},2.0);
    window.__timelines['sc-opening']=tl;
  })();
  </script>
</div></template>
