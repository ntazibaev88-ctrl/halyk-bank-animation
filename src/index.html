<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Halyk Bank — 60s animation (engine)</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:1080px;height:1920px}</style></head>
<body><canvas id="cv" width="1080" height="1920"></canvas>
<script src="lib.js"></script><script src="scenes_a.js"></script><script src="scenes_b.js"></script><script src="scenes_c.js"></script>
<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
window.TOTAL = 60 * FPS;
window.renderFrame = i => { ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.clearRect(0,0,W,H); drawFrame(ctx, i / FPS); return true; };
const q = new URLSearchParams(location.search);
if (q.has('t')) window.renderFrame(Math.round(parseFloat(q.get('t')) * FPS));
else { // live preview
  const t0 = performance.now(); (function loop(){ window.renderFrame(Math.floor(((performance.now()-t0)/1000 % 60) * FPS)); requestAnimationFrame(loop); })();
}
</script></body></html>
