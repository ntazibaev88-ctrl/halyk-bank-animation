<style>
.s7tag{position:absolute;padding:9px 16px;border:2px solid #22e4ff;border-radius:30px;font:600 24px/1 "F45 Mono",monospace;letter-spacing:.08em;color:#bff6ff;background:rgba(3,22,44,.82);box-shadow:0 0 22px rgba(34,228,255,.45);white-space:nowrap;opacity:0}
.s7tag b{color:#fff;font-weight:600}
</style>
<div id="root" data-composition-id="scene7" data-width="1080" data-height="1920">
  <div id="s7-world" class="world">
    <svg id="s7-svg" class="fill" viewBox="0 0 1080 1920"></svg>
    <div id="s7-ui" class="fill"></div>
  </div>
  <div id="s7-dust" class="fill"></div>
  <div class="vig"></div><div class="grain"></div>
  <div id="s7-kicker" class="kicker"><i></i>07 · ЭНЕРГИЯ</div>
  <div id="s7-title" class="title">ЭНЕРГИЯ <b>БУДУЩЕГО.</b></div>
  <div id="s7-rule" class="tline" style="top:440px"></div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
const svg = document.getElementById("s7-svg"), defs = el("defs", {}, svg), UI = document.getElementById("s7-ui");
function lgrad(id, x2, y2, stops) { const g = el("linearGradient", { id, x1: 0, y1: 0, x2, y2 }, defs); stops.forEach(s => el("stop", { offset: s[0], "stop-color": s[1], "stop-opacity": s[2] == null ? 1 : s[2] }, g)); }
lgrad("s7-sky", 0, 1, [[0, "#04122a"], [.6, "#0b3a6e"], [1, "#2a6ea8"]]); lgrad("s7-hill", 0, 1, [[0, "#0a2a4a"], [1, "#04101f"]]);
lgrad("s7-panel", 1, 1, [[0, "#2a7bd4"], [.5, "#0e3a78"], [1, "#0a2a5c"]]); lgrad("s7-shine", 1, 0, [[0, "#fff", 0], [.5, "#fff", .55], [1, "#fff", 0]]);
const rg = el("radialGradient", { id: "s7-sun" }, defs); [[0, "#fff6d6", 1], [.4, "#ffd9a0", .6], [1, "#ffb347", 0]].forEach(s => el("stop", { offset: s[0], "stop-color": s[1], "stop-opacity": s[2] }, rg));

/* ---- sky / hills ---- */
el("rect", { x: 0, y: 470, width: 1080, height: 780, fill: "url(#s7-sky)" }, svg);
const R = rng(707); for (let i = 0; i < 50; i++) el("circle", { cx: R() * 1080, cy: 480 + R() * 260, r: .8 + R() * 1.4, fill: "#e8f7ff", opacity: .3 + R() * .5 }, svg);
const sun = el("circle", { cx: 140, cy: 900, r: 120, fill: "url(#s7-sun)" }, svg);
el("path", { d: "M-40,1120 C120,1040 260,1090 420,1070 C600,1050 760,1000 900,1040 C1000,1060 1100,1040 1140,1030 L1140,1260 L-40,1260 Z", fill: "#0a2a4a" }, svg);
el("path", { d: "M-40,1190 C200,1130 400,1170 640,1150 C860,1130 1000,1160 1140,1140 L1140,1260 L-40,1260 Z", fill: "url(#s7-hill)" }, svg);
el("rect", { x: 0, y: 1240, width: 1080, height: 680, fill: "#020a15" }, svg); el("rect", { x: 0, y: 1240, width: 1080, height: 4, fill: "#22e4ff", opacity: .8 }, svg);

/* ---- city (centre) + control-centre hub ---- */
const cg = el("g", {}, svg);
const ct = city(cg, { x0: 400, x1: 700, base: 1240, minH: 90, maxH: 230, minW: 36, maxW: 60, gap: 3, fill: "#06223f", edge: "rgba(143,246,255,.6)", seed: 77, winProb: .5, wstep: 13, spire: 0 });
const hub = el("g", {}, svg);
el("path", { d: "M510,1240 L524,860 L556,860 L570,1240 Z", fill: "#0b3a6a", stroke: "#22e4ff", "stroke-width": 2 }, hub);
el("ellipse", { cx: 540, cy: 860, rx: 40, ry: 12, fill: "#0e4a84", stroke: "#22e4ff", "stroke-width": 2 }, hub);
for (let i = 0; i < 7; i++) el("rect", { x: 528, y: 900 + i * 44, width: 24, height: 6, fill: "#bff6ff", opacity: .8 }, hub);
const hr = [0, 1, 2].map(i => el("ellipse", { cx: 540, cy: 820 - i * 8, rx: 70 + i * 24, ry: 16 + i * 5, fill: "none", stroke: "#22e4ff", "stroke-width": 2, opacity: .85 - i * .22 }, hub));
el("circle", { cx: 540, cy: 836, r: 12, fill: "#fff" }, hub);

el('rect', { x: 0, y: 1241, width: 1080, height: 680, fill: '#020a15' }, svg); el('rect', { x: 0, y: 1240, width: 1080, height: 4, fill: '#22e4ff', opacity: .8 }, svg);
/* ---- solar array (left foreground) ---- */
const sol = el("g", {}, svg), cells = [];
for (let r = 0; r < 2; r++) for (let c = 0; c < 6; c++) {
  const x = 40 + c * 78 + r * 22, y = 1110 + r * 78, g = el("g", {}, sol);
  el("polygon", { points: `${x},${y + 52} ${x + 62},${y + 52} ${x + 86},${y} ${x + 24},${y}`, fill: "url(#s7-panel)", stroke: "#8ff6ff", "stroke-width": 1.5 }, g);
  for (let k = 1; k < 3; k++) el("line", { x1: x + 24 - 0 + k * 21 - 24 * 0, y1: y, x2: x + k * 21, y2: y + 52, stroke: "#8ff6ff", "stroke-opacity": .35 }, g);
  el("line", { x1: x + 12, y1: y + 26, x2: x + 74, y2: y + 26, stroke: "#8ff6ff", "stroke-opacity": .35 }, g);
  el("rect", { x: x + 28, y: y + 52, width: 6, height: 26, fill: "#12335a" }, g);
  cells.push(g);
}
const shineClip = el("clipPath", { id: "s7-sc" }, defs);
for (let r = 0; r < 2; r++) for (let c = 0; c < 6; c++) { const x = 40 + c * 78 + r * 22, y = 1110 + r * 78; el("polygon", { points: `${x},${y + 52} ${x + 62},${y + 52} ${x + 86},${y} ${x + 24},${y}` }, shineClip); }
const shine = el("rect", { x: -200, y: 1100, width: 120, height: 160, fill: "url(#s7-shine)", transform: "skewX(-20)" }, el("g", { "clip-path": "url(#s7-sc)" }, svg));

/* ---- wind turbines (right) ---- */
function turbine(x, base, h, rr) {
  const g = el("g", {}, svg);
  el("path", { d: `M${x - 7},${base} L${x - 3},${base - h} L${x + 3},${base - h} L${x + 7},${base} Z`, fill: "#cfe6f8" }, g);
  const rot = el("g", {}, g);
  el("circle", { cx: x, cy: base - h, r: rr, fill: "none", stroke: "none" }, rot);
  [0, 120, 240].forEach(a => el("path", { d: `M${x},${base - h} L${x - 6},${base - h - rr * .2} Q${x - 3},${base - h - rr} ${x},${base - h - rr} Q${x + 3},${base - h - rr * .5} ${x + 6},${base - h - rr * .2} Z`, fill: "#e8f7ff", transform: `rotate(${a} ${x} ${base - h})` }, rot));
  el("circle", { cx: x, cy: base - h, r: 9, fill: "#22e4ff" }, g);
  return { g, rot };
}
const wt = [turbine(760, 1130, 300, 100), turbine(880, 1150, 360, 120), turbine(1000, 1130, 270, 90), turbine(980, 1240, 190, 64)];
const turb = wt.map((t, i) => tl.to(t.rot, { rotation: 360 * (4 + i), duration: D, ease: "none", transformOrigin: "50% 50%" }, 0));
wt.forEach((t, i) => tl.fromTo(t.g, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: .8, ease: "power3.out" }, .2 + i * .1));

/* ---- battery storage ---- */
const bat = el("g", {}, svg), fills = [];
[0, 1, 2].forEach(i => { const x = 440 + i * 0, bx = 590 + i * 0; });
[0, 1, 2].forEach(i => { const x = 650 + i * 0; });
const bxs = [[330, 1170], [412, 1170], [494, 1170]];
bxs.forEach((b, i) => { const g = el("g", {}, bat); el("rect", { x: b[0], y: b[1], width: 70, height: 70, rx: 6, fill: "#0c2e56", stroke: "#22e4ff", "stroke-width": 2 }, g); el("rect", { x: b[0] + 8, y: b[1] + 8, width: 54, height: 54, rx: 4, fill: "#041526" }, g);
  const f = el("rect", { x: b[0] + 10, y: b[1] + 60, width: 50, height: 0, rx: 3, fill: "#3dffa0" }, g); fills.push(f); el("rect", { x: b[0] + 26, y: b[1] - 8, width: 18, height: 8, fill: "#22e4ff" }, g); });

/* ---- energy lines (draw, then flow) ---- */
const lines = [
  { d: "M170,1120 C260,960 420,860 540,850", c: "#ffd96a", t: 0 },
  { d: "M760,830 C700,800 620,820 546,850", c: "#22e4ff", t: .2 },
  { d: "M880,790 C760,740 640,760 548,848", c: "#22e4ff", t: .4 },
  { d: "M1000,860 C860,800 700,810 550,852", c: "#22e4ff", t: .6 },
  { d: "M365,1170 C400,1050 470,920 534,860", c: "#3dffa0", t: .8 },
  { d: "M540,860 C520,980 470,1060 430,1120", c: "#8ff6ff", t: 1.0 },
  { d: "M540,860 C560,980 620,1080 660,1130", c: "#8ff6ff", t: 1.1 },
];
const L = lines.map(l => { const g = el("g", {}, svg); const base = el("path", { d: l.d, fill: "none", stroke: l.c, "stroke-width": 3, opacity: .25 }, g);
  const flow = el("path", { d: l.d, fill: "none", stroke: l.c, "stroke-width": 5, "stroke-linecap": "round", "stroke-dasharray": "14 26", opacity: 0 }, g);
  const len = base.getTotalLength(); const pk = el("circle", { r: 7, fill: "#fff", opacity: 0 }, g);
  return { l, base, flow, len, pk, g }; });
const fl = { p: 0 };
tl.to(fl, { p: 1, duration: D, ease: "none", onUpdate: () => L.forEach((e, i) => { e.flow.setAttribute("stroke-dashoffset", -fl.p * D * 60); const u = (fl.p * D * .45 + i * .21) % 1, pt = e.base.getPointAtLength(e.len * (i > 4 ? u : 1 - u)); e.pk.setAttribute("cx", pt.x); e.pk.setAttribute("cy", pt.y); }) }, 0);

/* ---- tags & control panel ---- */
const tag = (id, css, html) => { const d = div("s7tag", css, UI, html); d.id = id; return d; };
tag("s7-t1", "left:60px;top:1050px", "☀ СОЛНЦЕ <b>+420 МВт</b>");
tag("s7-t2", "left:760px;top:690px", "≋ ВЕТЕР <b>+310 МВт</b>");
tag("s7-t3", "left:300px;top:1128px", "▮ НАКОПИТЕЛИ <b>86%</b>");
const cp = panel("s7-cp", "left:40px;top:520px;width:520px;height:290px;opacity:0", "ИИ-СЕТЬ", "", "", UI);
cp.insertAdjacentHTML("beforeend", `<svg id="s7-chart" width="480" height="170" viewBox="0 0 480 170" style="position:absolute;left:20px;top:46px"></svg><div class="mono" style="position:absolute;left:22px;bottom:14px;font:600 18px 'F45 Mono';color:#22e4ff">▬ ГЕНЕРАЦИЯ</div><div class="mono" style="position:absolute;left:190px;bottom:14px;font:600 18px 'F45 Mono';color:#ffb347">▬ ПОТРЕБЛЕНИЕ</div><div class="mono" id="s7-bal" style="position:absolute;right:20px;top:12px;font:800 26px 'F45 Display';color:#3dffa0">БАЛАНС 100%</div>`);
const ch = document.getElementById("s7-chart");
for (let i = 0; i < 5; i++) el("line", { x1: 0, y1: 20 + i * 32, x2: 480, y2: 20 + i * 32, stroke: "#22e4ff", "stroke-opacity": .14 }, ch);
const gen = el("path", { d: "", fill: "none", stroke: "#22e4ff", "stroke-width": 4, "stroke-linejoin": "round" }, ch);
const con = el("path", { d: "", fill: "none", stroke: "#ffb347", "stroke-width": 4, "stroke-linejoin": "round" }, ch);
const cur = el("line", { x1: 0, y1: 0, x2: 0, y2: 170, stroke: "#fff", "stroke-opacity": .5 }, ch);
const bal = document.getElementById("s7-bal");
const cs = { p: 0 };
const T0 = CH[3] - .3;
function curve(tm, k, bl) { let d = ""; for (let x = 0; x <= 480; x += 8) { const u = x / 480; const g = 85 - 38 * Math.sin(u * 6.2 + tm * .9) - 14 * Math.sin(u * 13 + tm * 1.7);
    let c = 85 - 42 * Math.sin(u * 5.1 + 1.1 + tm * .7) - 18 * Math.cos(u * 11 + tm * 1.3);
    const v = k === 0 ? g : lerp(c, g + 2, bl); d += (x ? "L" : "M") + x + "," + v.toFixed(1); } return d; }
tl.to(cs, { p: 1, duration: D, ease: "none", onUpdate: () => { const bl = clamp01((cs.p * D - T0) / 2.2); gen.setAttribute("d", curve(cs.p * D, 0, bl)); con.setAttribute("d", curve(cs.p * D, 1, bl)); cur.setAttribute("x1", (cs.p * D * 40) % 480); cur.setAttribute("x2", (cs.p * D * 40) % 480);
  bal.textContent = "БАЛАНС " + Math.round(lerp(71, 100, bl)) + "%"; bal.style.color = bl > .98 ? "#3dffa0" : "#ffb347"; } }, 0);

/* ================= animation ================= */
tl.fromTo(sun, { cy: 1000, opacity: .5 }, { cy: 880, opacity: 1, duration: D, ease: "sine.out" }, 0);
tl.fromTo(shine, { x: 0 }, { x: 760, duration: 2.6, ease: "power1.inOut", repeat: RP(D / 2.6 - 1) }, .6);
tl.fromTo(cells, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: .5, stagger: .06, ease: "power2.out" }, .3);
tl.fromTo(ct.wins, { opacity: 0 }, { opacity: .85, duration: .3, stagger: { each: .01, from: "random" } }, CH[1]);
tl.to(hr, { scaleX: 1.1, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: RP(D / 1.2), transformOrigin: "540px 820px" }, 0);
// sources light up with the narration
[["#s7-t1", CH[1] + .1], ["#s7-t2", CH[1] + 1.1], ["#s7-t3", CH[1] + 2.0]].forEach(t => { tl.fromTo(t[0], { opacity: 0, y: 12, scale: .8 }, { opacity: 1, y: 0, scale: 1, duration: .5, ease: "back.out(2)" }, t[1]); });
fills.forEach((f, i) => tl.to(f, { attr: { height: 44 + i * 4, y: 1230 - 44 - i * 4 }, duration: 2.4, ease: "power2.out" }, CH[1] + 1.8 + i * .2));
L.forEach((e, i) => { const t = CH[2] - .1 + e.l.t; tl.fromTo(e.base, { opacity: 0 }, { opacity: .35, duration: .4 }, t); tl.fromTo(e.flow, { opacity: 0 }, { opacity: 1, duration: .4 }, t); tl.fromTo(e.pk, { opacity: 0 }, { opacity: 1, duration: .3 }, t); });
tl.to(["#s7-t1", "#s7-t2", "#s7-t3"], { opacity: 0, duration: .4 }, CH[3] - .4);
tl.fromTo("#s7-cp", { opacity: 0, x: -70, rotationY: 40, transformPerspective: 800 }, { opacity: 1, x: 0, rotationY: 0, duration: .8, ease: "power3.out" }, CH[2] + .4);
camera(tl, "#s7-world", D, { s0: 1.0, s1: 1.1, y1: -30, origin: "540px 1000px", ease: "sine.inOut" });
tl.add(particles(document.getElementById("s7-dust"), 34, 71, D, { rmax: 3, dy: -220, color: "#ffd96a" }), 0);
headline(tl, "s7", .5, 3.6);
sceneInOut(tl, "#s7-world, #s7-dust", D);
window.__timelines["scene7"] = tl;
</script>
