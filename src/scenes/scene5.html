<style>
.s5lab{position:absolute;font:600 24px/1.25 "F45 Mono",monospace;letter-spacing:.12em;color:#8ff6ff;white-space:nowrap;opacity:0}
.s5lab b{color:#fff;font-weight:600}
.s5row{display:flex;justify-content:space-between;align-items:center;padding:8px 22px 0;font:500 26px/1 "F45 Text";color:#bfeaff}
.s5row i{display:block;height:10px;border-radius:5px;background:linear-gradient(90deg,#2f7bff,#22e4ff);box-shadow:0 0 10px #22e4ff;margin-left:14px}
.s5bar{width:130px;background:rgba(34,228,255,.18);border-radius:5px;height:10px}
</style>
<div id="root" data-composition-id="scene5" data-width="1080" data-height="1920">
  <div id="s5-world" class="world">
    <svg id="s5-svg" class="fill" viewBox="0 0 1080 1920"></svg>
    <div id="s5-ui" class="fill"></div>
  </div>
  <div id="s5-dust" class="fill"></div>
  <div class="vig"></div><div class="grain"></div>
  <div id="s5-kicker" class="kicker"><i></i>05 · МЕДИЦИНА</div>
  <div id="s5-title" class="title" style="font-size:72px"><b>МЕДИЦИНА</b> НОВОГО ПОКОЛЕНИЯ.</div>
  <div id="s5-rule" class="tline" style="top:440px"></div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
const svg = document.getElementById("s5-svg"), defs = el("defs", {}, svg), UI = document.getElementById("s5-ui");
function lgrad(id, x2, y2, stops) { const g = el("linearGradient", { id, x1: 0, y1: 0, x2, y2 }, defs); stops.forEach(s => el("stop", { offset: s[0], "stop-color": s[1], "stop-opacity": s[2] == null ? 1 : s[2] }, g)); }
lgrad("s5-wall", 0, 1, [[0, "#0a2c50"], [1, "#05182d"]]); lgrad("s5-floor", 0, 1, [[0, "#0b2745"], [1, "#020a15"]]);
lgrad("s5-scan", 0, 1, [[0, "#22e4ff", 0], [1, "#22e4ff", .5]]);
lgrad("s5-holo", 0, 1, [[0, "#22e4ff", .5], [1, "#22e4ff", .06]]);

/* ---- lab ---- */
const lab = el("g", {}, svg);
el("rect", { x: 0, y: 470, width: 1080, height: 770, fill: "url(#s5-wall)" }, lab);
for (let i = 0; i < 6; i++) { el("rect", { x: 30 + i * 175, y: 540, width: 150, height: 520, rx: 8, fill: "none", stroke: "#22e4ff", "stroke-opacity": .16 }, lab); }
el("rect", { x: 0, y: 1240, width: 1080, height: 680, fill: "url(#s5-floor)" }, lab); el("rect", { x: 0, y: 1240, width: 1080, height: 4, fill: "#22e4ff", opacity: .8 }, lab);
el("rect", { x: 0, y: 470, width: 1080, height: 28, fill: "#03101f" }, lab);
for (let i = 0; i < 5; i++) el("rect", { x: 80 + i * 220, y: 498, width: 120, height: 8, rx: 4, fill: "#bff6ff", opacity: .9 }, lab);

/* ---- projector pad + body hologram ---- */
const pad = el("g", {}, svg);
[150, 110, 70].forEach((r, i) => el("ellipse", { cx: 540, cy: 1230, rx: r, ry: r * .16, fill: i === 2 ? "#22e4ff" : "none", "fill-opacity": .22, stroke: "#22e4ff", "stroke-width": 3, opacity: 1 - i * .2 }, pad));
const beam = el("polygon", { points: "470,1230 610,1230 640,640 440,640", fill: "url(#s5-holo)", opacity: .18 }, svg);
const body = el("g", {}, svg);
const bodyD = "M500,742 Q540,726 580,742 L630,762 L652,902 L628,912 L608,802 L598,1000 L590,1212 L556,1212 L540,1010 L524,1212 L490,1212 L482,1000 L472,802 L452,912 L428,902 L450,762 Z";
const clipB = el("clipPath", { id: "s5-bclip" }, defs); el("path", { d: bodyD }, clipB); el("ellipse", { cx: 540, cy: 694, rx: 33, ry: 38 }, clipB);
el("path", { d: bodyD, fill: "rgba(34,228,255,.10)", stroke: "#22e4ff", "stroke-width": 3 }, body);
el("ellipse", { cx: 540, cy: 694, rx: 33, ry: 38, fill: "rgba(34,228,255,.10)", stroke: "#22e4ff", "stroke-width": 3 }, body);
const mesh = el("g", { "clip-path": "url(#s5-bclip)" }, body);
for (let i = 0; i < 26; i++) el("line", { x1: 420, y1: 660 + i * 22, x2: 660, y2: 660 + i * 22, stroke: "#22e4ff", "stroke-opacity": .2 }, mesh);
for (let i = 0; i < 10; i++) el("line", { x1: 440 + i * 24, y1: 650, x2: 440 + i * 24, y2: 1230, stroke: "#22e4ff", "stroke-opacity": .12 }, mesh);
/* organs */
const lungL = el("path", { d: "M512,770 Q488,790 494,846 Q512,858 528,840 L530,780 Z", fill: "rgba(143,246,255,.2)", stroke: "#8ff6ff", "stroke-width": 2 }, body);
const lungR = el("path", { d: "M568,770 Q592,790 586,846 Q568,858 552,840 L550,780 Z", fill: "rgba(143,246,255,.2)", stroke: "#8ff6ff", "stroke-width": 2 }, body);
const heart = el("path", { d: "M548,810 q-12,-14 -22,0 q-8,14 22,30 q30,-16 22,-30 q-10,-14 -22,0 z", fill: "#ff5b6e", opacity: .9, transform: "translate(0 -4)" }, body);
const liver = el("ellipse", { cx: 512, cy: 900, rx: 30, ry: 16, fill: "rgba(255,179,71,.25)", stroke: "#ffb347", "stroke-width": 2 }, body);
const ano = el("g", { transform: "translate(512 900)" }, svg);
const ring1 = el("circle", { r: 26, fill: "none", stroke: "#ffb347", "stroke-width": 3 }, ano);
el("path", { d: "M-40,-40 h14 M-40,-40 v14 M40,-40 h-14 M40,-40 v14 M-40,40 h14 M-40,40 v-14 M40,40 h-14 M40,40 v-14", stroke: "#ffb347", "stroke-width": 3, fill: "none" }, ano);
const scanner = el("g", {}, svg);
el("ellipse", { cx: 540, cy: 0, rx: 150, ry: 26, fill: "none", stroke: "#bff6ff", "stroke-width": 4 }, scanner);
el("ellipse", { cx: 540, cy: 0, rx: 150, ry: 26, fill: "rgba(34,228,255,.18)" }, scanner);
el("rect", { x: 390, y: -180, width: 300, height: 180, fill: "url(#s5-scan)", opacity: .35 }, scanner);

/* ---- doctor (right) studies the hologram ---- */
const dg = el("g", { transform: "translate(930 1240) scale(-1 1)" }, svg);
const doc = human(dg, { fill: "#071a30", rim: "#e8f7ff", rimOp: .75 });
const dArm = el("g", {}, doc.g);
el("line", { x1: 0, y1: 0, x2: -120, y2: -40, stroke: "#071a30", "stroke-width": 22, "stroke-linecap": "round" }, dArm);
el("line", { x1: 0, y1: 0, x2: -120, y2: -40, stroke: "#e8f7ff", "stroke-opacity": .55, "stroke-width": 2, "stroke-linecap": "round" }, dArm);
el("circle", { cx: -120, cy: -40, r: 10, fill: "#22e4ff" }, dArm);
gsap.set(dArm, { x: 44, y: -248 });
/* ---- ECG + panels ---- */
const ecg = panel("s5-ecg", "left:700px;top:520px;width:340px;height:170px;opacity:0", "ПУЛЬС · ЭКГ", "", "", UI);
ecg.insertAdjacentHTML("beforeend", `<svg width="340" height="120" viewBox="0 0 340 120" style="position:absolute;left:0;top:44px"><path id="s5-ecgp" d="" fill="none" stroke="#3dffa0" stroke-width="3" stroke-linejoin="round"/></svg><div class="mono" id="s5-bpm" style="position:absolute;right:20px;top:14px;font:600 34px/1 'F45 Mono';color:#3dffa0">72</div>`);
let ed = "M0,70"; for (let i = 0; i < 4; i++) { const x = i * 85; ed += ` L${x + 10},70 L${x + 18},62 L${x + 26},70 L${x + 34},70 L${x + 38},84 L${x + 44},14 L${x + 50},96 L${x + 54},70 L${x + 66},70 L${x + 74},58 L${x + 82},70 L${x + 85},70`; }
document.getElementById("s5-ecgp").setAttribute("d", ed);
const ecgPath = document.getElementById("s5-ecgp"), eL = ecgPath.getTotalLength(); ecgPath.setAttribute("stroke-dasharray", eL); ecgPath.setAttribute("stroke-dashoffset", eL);
const xr = panel("s5-xr", "left:40px;top:520px;width:340px;height:350px;opacity:0", "ИИ-АНАЛИЗ · СНИМОК", "", "", UI);
xr.insertAdjacentHTML("beforeend", `<svg id="s5-xsvg" width="296" height="250" viewBox="0 0 296 250" style="position:absolute;left:22px;top:52px"></svg><div class="mono" id="s5-xpct" style="position:absolute;left:22px;top:310px;font:600 22px 'F45 Mono';color:#bfeaff">СКАНИРОВАНИЕ… <b style="color:#fff">0%</b></div>`);
const xs = document.getElementById("s5-xsvg");
el("rect", { width: 296, height: 250, rx: 10, fill: "#0a1e36" }, xs);
el("path", { d: "M148,10 V240", stroke: "#8fb4d8", "stroke-width": 8, opacity: .5 }, xs);
for (let i = 0; i < 7; i++) { el("path", { d: `M148,${30 + i * 28} Q80,${20 + i * 28} 40,${54 + i * 28}`, fill: "none", stroke: "#cfeaff", "stroke-width": 4, opacity: .55 }, xs); el("path", { d: `M148,${30 + i * 28} Q216,${20 + i * 28} 256,${54 + i * 28}`, fill: "none", stroke: "#cfeaff", "stroke-width": 4, opacity: .55 }, xs); }
el("path", { d: "M130,40 Q70,50 64,130 Q74,200 130,206 Z", fill: "#1a3c63", opacity: .75 }, xs); el("path", { d: "M166,40 Q226,50 232,130 Q222,200 166,206 Z", fill: "#1a3c63", opacity: .75 }, xs);
const xline = el("rect", { x: 0, y: 0, width: 296, height: 4, fill: "#22e4ff" }, xs);
const xbox = el("g", { opacity: 0 }, xs); el("rect", { x: 188, y: 88, width: 56, height: 52, fill: "none", stroke: "#ffb347", "stroke-width": 3 }, xbox); el("circle", { cx: 214, cy: 112, r: 9, fill: "#ffb347", opacity: .7 }, xbox);
const tp = panel("s5-tp", "left:40px;top:900px;width:340px;height:200px;opacity:0", "ИИ · ПЛАН ЛЕЧЕНИЯ", "", "", UI);
tp.insertAdjacentHTML("beforeend", `<div class="s5row"><span>Вариант A</span><div class="s5bar"><i id="s5-ba" style="width:10%"></i></div><b class="mono" style="color:#fff">92%</b></div><div class="s5row"><span>Вариант B</span><div class="s5bar"><i id="s5-bb" style="width:10%"></i></div><b class="mono" style="color:#fff">71%</b></div><div class="s5row"><span>Вариант C</span><div class="s5bar"><i id="s5-bc" style="width:10%"></i></div><b class="mono" style="color:#fff">48%</b></div>`);
const dec = panel("s5-dec", "left:690px;top:720px;width:350px;height:150px;opacity:0;border-color:#3dffa0;box-shadow:0 0 36px rgba(61,255,160,.35)", "РЕШЕНИЕ", "", "", UI);
dec.insertAdjacentHTML("beforeend", `<div style="display:flex;align-items:center;gap:18px;padding:16px 22px 0"><div style="width:64px;height:64px;border-radius:50%;border:4px solid #3dffa0;color:#3dffa0;font:800 40px/56px 'F45 Display';text-align:center;box-shadow:0 0 22px rgba(61,255,160,.7)">✓</div><div style="font:800 30px/1.05 'F45 Display';color:#fff">ЗА ВРАЧОМ</div></div>`);
dec.querySelector(".h").style.color = "#3dffa0";
const l1 = div("s5lab", "left:640px;top:1010px", UI, "ЧЕЛОВЕЧЕСКИЙ <b>КОНТРОЛЬ</b>");
const l2 = div("s5lab", "left:360px;top:1262px", UI, "РОБОТ-ХИРУРГ · ТОЧНОСТЬ <b>0,1 ММ</b>");
const l3 = div("s5lab", "left:450px;top:560px;color:#ffb347", UI, "ОТКЛОНЕНИЕ · <b>97,4%</b>");

/* ---- robotic surgical system ---- */
const sa = arm2(svg, { x: 330, y: 506, L1: 270, L2: 250, sign: 1, w1: 22, w2: 18, c1: "#e8f7ff", c2: "#bcd6ee", joint: "#ff5b6e" });
const sb = arm2(svg, { x: 750, y: 506, L1: 270, L2: 250, sign: -1, w1: 22, w2: 18, c1: "#e8f7ff", c2: "#bcd6ee", joint: "#ff5b6e" });
sa.set(300, 560); sb.set(780, 560);
tl.set([sa.g, sb.g], { opacity: 0 }, 0);
const laser = el("line", { x1: 540, y1: 600, x2: 512, y2: 900, stroke: "#ff5b6e", "stroke-width": 3, opacity: 0 }, svg);

/* ================= animation ================= */
tl.fromTo(body, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 1.2, ease: "power3.out" }, .2);
tl.fromTo(beam, { opacity: 0 }, { opacity: .18, duration: 1.2 }, .2);
tl.fromTo(pad, { opacity: 0, scale: .6, transformOrigin: "540px 1230px" }, { opacity: 1, scale: 1, duration: 1, ease: "power3.out" }, .1);
const sc = { y: 0 };
tl.fromTo(scanner, { y: 680 }, { y: 1220, duration: 3.2, ease: "sine.inOut", yoyo: true, repeat: RP(D / 3.2 - 1) }, .6);
tl.to(heart, { scale: 1.12, duration: .3, transformOrigin: "548px 820px", yoyo: true, repeat: RP(D / .6 - 1), ease: "sine.inOut" }, 0);
tl.to([lungL, lungR], { attr: { "fill-opacity": .6 }, duration: 1.4, yoyo: true, repeat: RP(D / 1.4 - 1), ease: "sine.inOut" }, 0);
// X-ray analysis
tl.fromTo("#s5-xr", { opacity: 0, x: -70, rotationY: 40, transformPerspective: 800 }, { opacity: 1, x: 0, rotationY: 0, duration: .8, ease: "power3.out" }, CH[1] - .3);
tl.fromTo(xline, { y: 0 }, { y: 246, duration: 1.8, ease: "sine.inOut", yoyo: true, repeat: 1 }, CH[1] + .3);
tl.fromTo(xbox, { opacity: 0 }, { opacity: 1, duration: .15, yoyo: true, repeat: 5 }, CH[1] + 2.0); tl.set(xbox, { opacity: 1 }, CH[1] + 2.9);
const xp = { n: 0 }, xpt = document.getElementById("s5-xpct");
tl.to(xp, { n: 97.4, duration: 2.6, ease: "power2.out", onUpdate: () => { xpt.innerHTML = (xp.n > 96 ? "ПРИЗНАК НАЙДЕН " : "СКАНИРОВАНИЕ… ") + "<b style='color:#fff'>" + xp.n.toFixed(1) + "%</b>"; } }, CH[1] + .3);
tl.fromTo(ecg, { opacity: 0, x: 70, rotationY: -40, transformPerspective: 800 }, { opacity: 1, x: 0, rotationY: 0, duration: .8, ease: "power3.out" }, .9);
tl.to(ecgPath, { attr: { "stroke-dashoffset": 0 }, duration: 3, ease: "none" }, 1.0);
tl.fromTo(ecgPath, { attr: { "stroke-dashoffset": 0 } }, { attr: { "stroke-dashoffset": -eL }, duration: 3, ease: "none", immediateRender: false }, 4.2);
// anomaly on the body + treatment plan
tl.fromTo(ano, { opacity: 0, scale: 2.2, transformOrigin: "0 0" }, { opacity: 1, scale: 1, duration: .6, ease: "back.out(2)" }, CH[2] - .2);
tl.to(ring1, { attr: { r: 36 }, opacity: .2, duration: .7, yoyo: true, repeat: RP((D - CH[2]) / .7 - 1), ease: "sine.inOut" }, CH[2]);
tl.fromTo(l3, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: .4 }, CH[2] + .1);
tl.fromTo("#s5-tp", { opacity: 0, x: -70, rotationY: 40, transformPerspective: 800 }, { opacity: 1, x: 0, rotationY: 0, duration: .8, ease: "power3.out" }, CH[2] + .5);
[["#s5-ba", "92%"], ["#s5-bb", "71%"], ["#s5-bc", "48%"]].forEach((b, i) => tl.to(b[0], { width: b[1], duration: 1.1, ease: "power3.out" }, CH[2] + 1.0 + i * .2));
// surgery + the human makes the final call
tl.to(l3, { opacity: 0, duration: .3 }, CH[3] - .2);
tl.to([sa.g, sb.g], { opacity: 1, duration: .5 }, CH[3] - .9);
sa.reach(tl, CH[3] - .6, 1.2, 506, 880); sb.reach(tl, CH[3] - .4, 1.2, 556, 920);
tl.fromTo(laser, { opacity: 0 }, { opacity: .9, duration: .3 }, CH[3] + .8);
tl.to(laser, { opacity: .3, duration: .2, yoyo: true, repeat: 7 }, CH[3] + 1.1);
tl.fromTo(l2, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: .4 }, CH[3] + .4);
tl.to(dArm, { rotation: -12, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 3, transformOrigin: "0 0" }, CH[2]);
tl.fromTo("#s5-dec", { opacity: 0, scale: .8, y: 30, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, y: 0, duration: .6, ease: "back.out(1.8)" }, CH[3] + 1.4);
tl.fromTo(l1, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: .4 }, CH[3] + 1.9);
camera(tl, "#s5-world", D, { s0: 1.0, s1: 1.1, y1: -30, origin: "540px 900px", ease: "sine.inOut" });
tl.add(particles(document.getElementById("s5-dust"), 30, 51, D, { rmax: 3, dy: -180 }), 0);
headline(tl, "s5", .5, 3.8);
sceneInOut(tl, "#s5-world, #s5-dust", D);
window.__timelines["scene5"] = tl;
</script>
