<style>
.s4lab{position:absolute;font:600 24px/1 "F45 Mono",monospace;letter-spacing:.14em;color:#8ff6ff;white-space:nowrap;opacity:0}
.s4lab b{color:#fff;font-weight:600}
.s4warn{color:#ffb347;border:2px solid #ffb347;padding:8px 14px;border-radius:8px;background:rgba(40,22,2,.7)}

.s4bar i{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,#2f7bff,#22e4ff);box-shadow:0 0 12px #22e4ff;width:20%}

<div id="root" data-composition-id="scene4" data-width="1080" data-height="1920">
  <div id="s4-world" class="world">
    <svg id="s4-svg" class="fill" viewBox="0 0 1080 1920"></svg>
    <div id="s4-ui" class="fill"></div>
  </div>
  <div id="s4-dust" class="fill"></div>
  <div class="vig"></div><div class="grain"></div>
  <div id="s4-kicker" class="kicker"><i></i>04 · РОБОТЫ</div>
  <div id="s4-title" class="title">РОБОТЫ <b>МЕНЯЮТ РАБОТУ.</b></div>
  <div id="s4-rule" class="tline" style="top:440px"></div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
const svg = document.getElementById("s4-svg"), defs = el("defs", {}, svg), UI = document.getElementById("s4-ui");
const lg = el("linearGradient", { id: "s4-fl", x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
[[0, "#0b2a4d"], [1, "#020a15"]].forEach(s => el("stop", { offset: s[0], "stop-color": s[1] }, lg));
const hz = el("pattern", { id: "s4-haz", width: 40, height: 40, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)" }, defs);
el("rect", { width: 40, height: 40, fill: "#1a1203" }, hz); el("rect", { width: 20, height: 40, fill: "#ffb347" }, hz);
const fur = el("radialGradient", { id: "s4-fur" }, defs);
[[0, "#ffb347", .9], [1, "#ff5b3e", 0]].forEach(s => el("stop", { offset: s[0], "stop-color": s[1], "stop-opacity": s[2] }, fur));

/* ---- hall ---- */
const bg = el("g", {}, svg);
el("rect", { x: 0, y: 470, width: 1080, height: 790, fill: "#071d38" }, bg);
for (let i = 0; i < 7; i++) { el("rect", { x: 20 + i * 160, y: 520, width: 110, height: 380, fill: "#0a2c52", stroke: "#22e4ff", "stroke-opacity": .25 }, bg); el("line", { x1: 75 + i * 160, y1: 520, x2: 75 + i * 160, y2: 900, stroke: "#22e4ff", "stroke-opacity": .18 }, bg); }
for (let i = 0; i < 9; i++) el("line", { x1: 0, y1: 470 + i * 6, x2: 1080, y2: 470 + i * 6, stroke: "#22e4ff", "stroke-opacity": .05 }, bg);
el("rect", { x: 0, y: 1240, width: 1080, height: 680, fill: "url(#s4-fl)" }, bg);
el("rect", { x: 0, y: 1240, width: 1080, height: 4, fill: "#22e4ff", opacity: .8 }, bg);
for (let i = 0; i < 9; i++) el("line", { x1: 540 + (i - 4) * 40, y1: 1244, x2: 540 + (i - 4) * 200, y2: 1920, stroke: "#22e4ff", "stroke-opacity": .1 }, bg);
/* ceiling lamps */
[110, 330, 550, 770, 970].forEach((x, i) => { el("rect", { x: x - 50, y: 508, width: 100, height: 8, rx: 4, fill: "#bff6ff" }, bg); el("polygon", { points: `${x - 46},516 ${x + 46},516 ${x + 120},900 ${x - 120},900`, fill: "#22e4ff", opacity: .06 }, bg); });
/* gantry rail */
el("rect", { x: 0, y: 520, width: 1080, height: 22, fill: "#0e2f55", stroke: "#22e4ff", "stroke-opacity": .6 }, bg);

/* ---- warehouse shelves with boxes (back right) ---- */
const sh = el("g", {}, svg);
for (let r = 0; r < 3; r++) { el("rect", { x: 560, y: 690 + r * 120, width: 480, height: 8, fill: "#2a5a8c" }, sh);
  for (let c = 0; c < 7; c++) { const w = 46 + ((c * 13 + r * 7) % 18); el("rect", { x: 570 + c * 66, y: 690 + r * 120 - 62 + (c % 2) * 8, width: w, height: 62 - (c % 2) * 8, fill: ["#1c5a96", "#2a7bd4", "#1a4a80"][(c + r) % 3], stroke: "#22e4ff", "stroke-opacity": .5 }, sh); } }
el("rect", { x: 556, y: 628, width: 8, height: 342, fill: "#2a5a8c" }, sh); el("rect", { x: 1036, y: 628, width: 8, height: 342, fill: "#2a5a8c" }, sh);

/* ---- furnace / hazard zone ---- */
el("ellipse", { cx: 800, cy: 1170, rx: 220, ry: 60, fill: "url(#s4-fur)" }, svg);
const hazard = el("g", {}, svg);
el("polygon", { points: "600,1262 1000,1262 1040,1296 560,1296", fill: "url(#s4-haz)", opacity: .9 }, hazard);

/* ---- conveyor ---- */
const cv = el("g", {}, svg);
el("rect", { x: -10, y: 1090, width: 1100, height: 56, fill: "#0b2a4d", stroke: "#22e4ff", "stroke-width": 2 }, cv);
const belt = el("g", {}, cv);
for (let i = 0; i < 40; i++) el("rect", { x: i * 40, y: 1098, width: 22, height: 6, fill: "#22e4ff", opacity: .55 }, belt);
for (let i = 0; i < 9; i++) el("rect", { x: 40 + i * 130, y: 1146, width: 14, height: 94, fill: "#12335a" }, cv);
/* products */
const prods = el("g", {}, svg);
function carBody(parent) { const g = el("g", {}, parent);
  el("path", { d: "M-84,0 C-84,-18 -66,-24 -46,-26 L-24,-44 C-10,-54 20,-54 36,-44 L62,-28 C80,-24 90,-14 90,0 Z", fill: "#a9d6ff", stroke: "#e8f7ff", "stroke-width": 2 }, g);
  el("path", { d: "M-24,-40 C-8,-48 18,-48 32,-40 L50,-28 L-40,-28 Z", fill: "#06203c" }, g);
  el("circle", { cx: -48, cy: 2, r: 15, fill: "#030a14", stroke: "#22e4ff", "stroke-width": 2 }, g); el("circle", { cx: 54, cy: 2, r: 15, fill: "#030a14", stroke: "#22e4ff", "stroke-width": 2 }, g);
  return g; }
const product = [];
[0, 1, 2].forEach(i => { const g = el("g", {}, prods); carBody(g); product.push(g); });
const SPAN = 1500;
product.forEach((g, i) => tl.fromTo(g, { x: -140 + i * 500 - 300, y: 1088 }, { x: -140 + i * 500 - 300 + SPAN * (D / 10), y: 1088, duration: D, ease: "none" }, 0));
tl.fromTo(belt, { x: 0 }, { x: -240, duration: D, ease: "none" }, 0);

/* ---- two assembly arms on the gantry ---- */
const armA = arm2(svg, { x: 330, y: 532, L1: 270, L2: 270, sign: 1, w1: 26, w2: 20, c1: "#e8f7ff", c2: "#bcd6ee" });
const armB = arm2(svg, { x: 580, y: 532, L1: 270, L2: 270, sign: -1, w1: 26, w2: 20, c1: "#e8f7ff", c2: "#bcd6ee" });
armA.set(330, 1000); armB.set(580, 1000);
const carX = (i, t) => -140 + i * 500 - 300 + SPAN * (D / 10) * (t / D);
// station points (arm tips follow the moving car)
const t0 = CH[1] - .3;
const wA = [[t0, 1.0, 300, 1020], [t0 + 1.6, .8, 340, 1005], [t0 + 3.1, .8, 300, 1010]];
wA.forEach(w => armA.reach(tl, w[0], w[1], w[2], w[3]));
armA.reach(tl, t0 + 4.3, 1.0, 330, 1000);
const wB = [[t0 + .8, 1.0, 650, 1000], [t0 + 2.4, .9, 610, 1030], [t0 + 3.8, .9, 650, 1000]];
wB.forEach(w => armB.reach(tl, w[0], w[1], w[2], w[3]));
armB.reach(tl, t0 + 5.0, 1.0, 580, 1000);
/* welding sparks */
const sparks = div("", "", UI); sparks.className = "fill";
const R = rng(404);
[[t0 + 1.0, 300, 1020], [t0 + 1.8, 340, 1010], [t0 + 2.5, 320, 1015], [t0 + 3.4, 650, 1008], [t0 + 4.2, 640, 1010]].forEach((s, k) => {
  for (let i = 0; i < 12; i++) { const d = div("dot", `left:${s[1]}px;top:${s[2]}px;width:5px;height:5px;background:#fff3c4;box-shadow:0 0 12px #ffb347;opacity:0`, sparks);
    const a = -Math.PI / 2 + (R() - .5) * 2.4, v = 60 + R() * 120;
    tl.fromTo(d, { x: 0, y: 0, opacity: 1 }, { x: Math.cos(a) * v, y: Math.sin(a) * v + 60 * R(), opacity: 0, duration: .5 + R() * .3, ease: "power2.out" }, s[0] + R() * .05); }
});

/* ---- humanoid robots ---- */
function robot(parent, s, col) {
  const g = el("g", {}, parent), b = el("g", { transform: `scale(${s})` }, g);
  const legs = [0, 1].map(i => { const hip = el("g", {}, b); el("rect", { x: -9, y: 0, width: 18, height: 58, rx: 9, fill: i ? "#8fb4d8" : "#bcd6ee" }, hip);
    const sh = el("g", {}, hip); el("rect", { x: -8, y: 0, width: 16, height: 56, rx: 8, fill: i ? "#6f95bb" : "#9fc1e2" }, sh); el("rect", { x: -8, y: 50, width: 30, height: 12, rx: 6, fill: "#22e4ff" }, sh);
    return { hip, sh }; });
  el("rect", { x: -30, y: -112, width: 60, height: 116, rx: 16, fill: "#e8f7ff", stroke: "#8fb4d8", "stroke-width": 2 }, b);
  el("rect", { x: -16, y: -88, width: 32, height: 22, rx: 6, fill: "#06203c" }, b); const core = el("circle", { cx: 0, cy: -77, r: 6, fill: "#22e4ff" }, b);
  el("rect", { x: -18, y: -154, width: 36, height: 36, rx: 12, fill: "#e8f7ff", stroke: "#8fb4d8", "stroke-width": 2 }, b);
  el("rect", { x: -10, y: -142, width: 28, height: 10, rx: 5, fill: "#22e4ff" }, b);
  const arm = el("g", {}, b); el("rect", { x: -8, y: 0, width: 16, height: 54, rx: 8, fill: "#bcd6ee" }, arm);
  const fa = el("g", { transform: "translate(0 52)" }, arm); el("rect", { x: -7, y: 0, width: 14, height: 48, rx: 7, fill: "#9fc1e2" }, fa);
  const box = el("g", { opacity: 0 }, b); el("rect", { x: 8, y: -32, width: 54, height: 44, fill: "#d9a35e", stroke: "#8a5a3c", "stroke-width": 2 }, box); el("rect", { x: 8, y: -16, width: 54, height: 5, fill: "#8a5a3c" }, box);
  const o = { g, core, box };
  o.pose = (ph, carry) => { const a = Math.sin(ph) * 28, c = Math.sin(ph + Math.PI) * 28;
    legs[0].hip.setAttribute("transform", `translate(-10 4) rotate(${a})`); legs[1].hip.setAttribute("transform", `translate(10 4) rotate(${c})`);
    legs[0].sh.setAttribute("transform", `translate(0 56) rotate(${Math.max(0, -Math.sin(ph + 1.2)) * 30})`); legs[1].sh.setAttribute("transform", `translate(0 56) rotate(${Math.max(0, Math.sin(ph + 1.2)) * 30})`);
    arm.setAttribute("transform", `translate(18 -98) rotate(${carry ? -78 : Math.sin(ph) * 22})`); fa.setAttribute("transform", `translate(0 52) rotate(${carry ? -50 : 8})`);
    box.setAttribute("opacity", carry ? 1 : 0); };
  o.pose(0, 0); return o;
}
const r1 = robot(svg, 1.15), r2 = robot(svg, 1.0), r3 = robot(svg, 1.28);
const walk = { p: 0 };
tl.to(walk, { p: 1, duration: D, ease: "none", onUpdate: () => { const ph = walk.p * D * 7.2; r1.pose(ph, 1); r2.pose(ph * .9 + 1, walk.p * D > CH[2] ? 1 : 0); r3.pose(0, 0); } }, 0);
gsap.set(r1.g, { y: 1068 }); gsap.set(r2.g, { y: 1234 });
tl.fromTo(r1.g, { x: -120 }, { x: 540, duration: CH[1] + 1.2, ease: "none" }, 0);
tl.to(r1.g, { x: 540, duration: .001 }, CH[1] + 1.2);
tl.fromTo(r1.g, { x: 540 }, { x: 540 + 320, duration: D - (CH[1] + 1.2), ease: "none" }, CH[1] + 1.2);
tl.fromTo(r2.g, { x: 1240 }, { x: 700, duration: CH[2] + .5, ease: "none" }, 0);
tl.fromTo(r2.g, { x: 700 }, { x: 640, duration: D - CH[2] - .5, ease: "none" }, CH[2] + .5);
/* big supervising robot near the shelves picks boxes (idle sway) */
gsap.set(r3.g, { x: 450, y: 1000 });
tl.to(r3.g, { y: 996, duration: .8, ease: "sine.inOut", yoyo: true, repeat: RP(D / .8) }, 0);
tl.to(r3.core, { attr: { r: 9 }, duration: .45, yoyo: true, repeat: RP(D / .45 - 1), ease: "sine.inOut" }, 0);

/* ---- engineer + dashboard ---- */
const eg = el("g", { transform: "translate(930 1262)" }, svg);
const eng = human(el("g", {}, eg), { s: 1, fill: "#020b16", rimOp: .75 });
el("rect", { x: -26, y: -326, width: 52, height: 14, rx: 6, fill: "#ffb347" }, eng.g); // hard hat
const wrist = el("rect", { x: 46, y: -176, width: 14, height: 8, rx: 3, fill: "#22e4ff" }, eng.g);
const dash = panel("s4-dash", "left:690px;top:560px;width:350px;height:260px;opacity:0", "ЛИНИЯ №3 · ОПЕРАТОР", "98.4%", "эффективность · 0 простоев", UI);
dash.insertAdjacentHTML("beforeend", `<div class="s4bar" style="top:196px;width:306px"><i id="s4-b1" style="width:30%"></i></div><div class="s4bar" style="top:222px;width:306px"><i id="s4-b2" style="width:20%"></i></div>`);
const stat = div("s4lab", "left:90px;top:1040px", UI, "СОБРАНО СЕГОДНЯ: <b id='s4-cnt'>1 204</b>");
const warn = div("s4lab s4warn", "left:640px;top:1190px", UI, "⚠ ОПАСНАЯ ЗОНА · РАБОТАЕТ РОБОТ");
const cnt = document.getElementById("s4-cnt"), cp = { n: 1204 };
tl.fromTo(stat, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: .5 }, CH[1]);
tl.to(cp, { n: 1252, duration: D - CH[1], ease: "none", onUpdate: () => { cnt.textContent = Math.round(cp.n).toString().replace(/(\d)(\d{3})$/, "$1 $2"); } }, CH[1]);
tl.fromTo(warn, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: .45 }, CH[2] + .1);
tl.to(warn, { opacity: 0, duration: .35 }, CH[3] - .2);
tl.fromTo("#s4-dash", { opacity: 0, x: -60, rotationY: 40, transformPerspective: 800 }, { opacity: 1, x: 0, rotationY: 0, duration: .8, ease: "power3.out" }, CH[3] - .1);
tl.to("#s4-b1", { width: "86%", duration: 2, ease: "power2.inOut" }, CH[3] + .4);
tl.to("#s4-b2", { width: "64%", duration: 2.2, ease: "power2.inOut" }, CH[3] + .6);
tl.to(wrist, { opacity: .2, duration: .3, yoyo: true, repeat: 7 }, CH[3]);
tl.fromTo(eg, { y: 1270 }, { y: 1262, duration: 1.4, ease: "sine.out" }, 0);
eg.setAttribute('data-x','930');

camera(tl, "#s4-world", D, { s0: 1.0, s1: 1.1, x0: 0, x1: 0, y0: 0, y1: -24, origin: "540px 900px", ease: "sine.inOut" });
tl.add(particles(document.getElementById("s4-dust"), 28, 41, D, { rmax: 3, dy: -140 }), 0);
headline(tl, "s4", .5, 3.6);
sceneInOut(tl, "#s4-world, #s4-dust", D);
window.__timelines["scene4"] = tl;
</script>
