<template>
<style>
{{CSS}}
#root .ttl{font-size:70px}
#root .ttl b{color:#ff8a1f}
#root .card{position:absolute;left:70px;width:940px;height:150px;display:flex;align-items:center;gap:26px;padding:0 30px;border-radius:18px;
 background:linear-gradient(90deg,rgba(60,8,16,.96),rgba(34,8,18,.92));border:4px solid #ff3b3b;font-size:40px;font-weight:900;line-height:1.1;box-shadow:0 0 40px rgba(255,59,59,.35)}
#root .card .x{flex:none;width:80px;height:80px;border-radius:50%;background:#ff3b3b;display:flex;align-items:center;justify-content:center;font-size:56px;color:#fff;font-weight:900}
#root .disc{position:absolute;left:70px;width:940px;top:1318px;font-size:26px;font-weight:700;color:#8fa3c4;line-height:1.25}
#root .callout{position:absolute;left:640px;font-size:34px;font-weight:900;padding:10px 22px;border-left:6px solid #ff8a1f;background:rgba(8,18,38,.9);border-radius:6px;white-space:nowrap}
</style>
<div id="root" data-composition-id="s6" data-width="1080" data-height="1920">
<svg class="full" viewBox="0 0 1080 1920">
 <defs>
  <pattern id="@@grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#1d3a6b" stroke-width="1.5"/></pattern>
  <linearGradient id="@@body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a7fa6"/><stop offset=".5" stop-color="#37486e"/><stop offset="1" stop-color="#1e2b47"/></linearGradient>
  <radialGradient id="@@rg"><stop offset="0" stop-color="#ff3b3b" stop-opacity=".55"/><stop offset="1" stop-color="#ff3b3b" stop-opacity="0"/></radialGradient>
 </defs>
 <rect x="0" y="470" width="1080" height="860" fill="url(#@@grid)" opacity=".5"/>
 <!-- control-room backdrop -->
 <g id="@@bg">
  <rect x="70" y="520" width="940" height="360" rx="14" fill="#0b162b" stroke="#2f4a7a" stroke-width="3"/>
  <g id="@@scr"></g>
  <rect x="70" y="900" width="940" height="46" fill="#1b2840"/>
 </g>
 <!-- operator -->
 <g transform="translate(330 1240) scale(1.22)"><g id="@@opw">{{include:operator:a}}</g></g>
 <!-- inspection / LOTO equipment (right side) -->
 <g id="@@eq" opacity="0">
  <rect x="520" y="1060" width="520" height="40" fill="#4b5d80" stroke="#6c7f9c" stroke-width="2"/>
  <path d="M520 1080 L1040 1080" stroke="#35c4ff" stroke-width="8" stroke-dasharray="1.4 3" stroke-linecap="round" fill="none" id="@@eqf"/>
  <rect x="750" y="1000" width="40" height="60" fill="#6c7f9c"/>
  <g id="@@vwheel"><ellipse cx="770" cy="990" rx="80" ry="16" fill="none" stroke="#ff8a1f" stroke-width="10"/><line x1="690" y1="990" x2="850" y2="990" stroke="#ff8a1f" stroke-width="8"/></g>
  <g id="@@gaugeG"></g>
  <g transform="translate(940 800)"><path d="M0 -70 L66 44 L-66 44 Z" fill="#ffd21f" stroke="#1b1b1b" stroke-width="6" stroke-linejoin="round"/><rect x="-6" y="-30" width="12" height="44" fill="#1b1b1b"/><circle cx="0" cy="28" r="6" fill="#1b1b1b"/></g>
 </g>
 <!-- lock + tag -->
 <g id="@@lock" opacity="0">
  <g id="@@shackle"><path d="M744 1000 L744 960 C744 925 796 925 796 960 L796 1000" fill="none" stroke="#cfd8ea" stroke-width="12" stroke-linecap="round"/></g>
  <rect x="726" y="1000" width="88" height="70" rx="12" fill="#ff3b3b" stroke="#fff" stroke-width="4"/>
  <circle cx="770" cy="1030" r="9" fill="#2a0a0a"/>
  <g id="@@tag"><line x1="770" y1="1070" x2="770" y2="1110" stroke="#cfd8ea" stroke-width="4"/><rect x="690" y="1110" width="160" height="110" rx="10" fill="#ff3b3b" stroke="#fff" stroke-width="4"/><rect x="705" y="1126" width="130" height="14" fill="#fff"/><rect x="705" y="1152" width="130" height="10" fill="#ffd0d0"/><rect x="705" y="1172" width="100" height="10" fill="#ffd0d0"/></g>
 </g>
 <rect id="@@dim" x="0" y="440" width="1080" height="900" fill="#12040a" opacity="0"/>
 <rect id="@@redg" x="0" y="440" width="1080" height="900" fill="url(#@@rg)" opacity="0"/>
</svg>
<div class="kick" id="@@k" style="opacity:0;color:#ff8a1f">Техника безопасности</div>
<div class="ttl" id="@@t" style="opacity:0">БЕЗОПАСНОСТЬ — <b>ПРИОРИТЕТ №1</b></div>
<div class="callout" id="@@c1" style="top:520px;opacity:0">КАСКА</div>
<div class="callout" id="@@c2" style="top:600px;opacity:0">ЗАЩИТНЫЕ ОЧКИ</div>
<div class="callout" id="@@c3" style="top:680px;opacity:0">СПЕЦОДЕЖДА И ЖИЛЕТ</div>
<div class="callout" id="@@c4" style="top:760px;opacity:0">ПЕРЧАТКИ</div>
<div class="lbl" id="@@l1" style="left:560px;top:520px;opacity:0">ОСМОТР ОБОРУДОВАНИЯ</div>
<div class="lbl red" id="@@l2" style="left:560px;top:900px;opacity:0;font-size:30px">ОПАСНО: ДАВЛЕНИЕ</div>
<div class="lbl red" id="@@l3" style="left:70px;top:520px;opacity:0">БЛОКИРОВКА И БИРКА — LOTO</div>
<div class="card" id="@@x1" style="top:520px;opacity:0"><div class="x">✕</div><div>САМОВОЛЬНОЕ ОТКЛЮЧЕНИЕ ЗАЩИТ</div></div>
<div class="card" id="@@x2" style="top:700px;opacity:0"><div class="x">✕</div><div>НАРУШЕНИЕ ПОРЯДКА ПЕРЕКЛЮЧЕНИЙ</div></div>
<div class="card" id="@@x3" style="top:880px;opacity:0"><div class="x">✕</div><div>ДОПУСК НЕПОДГОТОВЛЕННОГО ПЕРСОНАЛА</div></div>
<div class="disc" id="@@d" style="opacity:0">Иллюстрация общего характера. Порядок работ и переключений — только по утверждённым инструкциям станции.</div>
</div>
<script>
{{JS}}
(function(){
const tl=gsap.timeline({paused:true});
/* backdrop screens with trend lines */
const SC=G("@@scr");for(let i=0;i<3;i++){const x=100+i*300;mk(SC,`<rect x="${x}" y="545" width="270" height="310" rx="8" fill="#050b18" stroke="#35c4ff" stroke-width="2"/><polyline class="tr" points="${x+14},800 ${x+60},760 ${x+100},785 ${x+150},710 ${x+190},750 ${x+230},690 ${x+256},715" fill="none" stroke="${i==1?"#ff8a1f":"#35c4ff"}" stroke-width="5"/><rect x="${x+14}" y="570" width="${100+i*40}" height="14" fill="#1d3a6b"/><circle cx="${x+240}" cy="578" r="9" fill="${i==1?"#ff8a1f":"#2fd16b"}" class="ld"/>`)}
gauge("@@gaugeG","@@pg",650,820,70,"#ff3b3b");
/* intro */
tl.fromTo("#@@k",{opacity:0,x:-30},{opacity:1,x:0,duration:.4},.3);
tl.fromTo("#@@t",{opacity:0,y:30},{opacity:1,y:0,duration:.6,ease:"power3.out"},.45);
tl.fromTo("#@@bg",{opacity:0,y:40},{opacity:1,y:0,duration:.8,ease:"power3.out"},.4);
SEL("#@@scr .tr").forEach((e,i)=>tl.fromTo(e,{x:0},{x:-20,duration:.5,yoyo:true,repeat:30,ease:"sine.inOut"},.6+i*.15));
pulse(tl,"#@@scr .ld",.6,13,.3,1,.6);
tl.fromTo("#@@opw",{opacity:0,y:60},{opacity:1,y:0,duration:.7,ease:"power3.out"},.5);
tl.fromTo("#@@opw",{y:0},{y:-8,duration:1.1,yoyo:true,repeat:9,ease:"sine.inOut",immediateRender:false},1.2);
/* PPE callouts */
["#@@c1","#@@c2","#@@c3","#@@c4"].forEach((c,i)=>tl.fromTo(c,{opacity:0,x:40},{opacity:1,x:0,duration:.4,ease:"power3.out"},1.0+i*.45));
tl.fromTo("#@@armR-a",{rotation:0,svgOrigin:"78 -405"},{rotation:-155,svgOrigin:"78 -405",duration:.5,ease:"power2.out"},1.0);
tl.to("#@@armR-a",{rotation:0,svgOrigin:"78 -405",duration:.5,ease:"power2.inOut"},2.9);
/* switch to inspection + LOTO */
["#@@c1","#@@c2","#@@c3","#@@c4"].forEach((c,i)=>tl.to(c,{opacity:0,x:30,duration:.25},3.0+i*.04));
tl.to("#@@bg",{opacity:.25,duration:.5},3.0);
tl.fromTo("#@@eq",{opacity:0,x:60},{opacity:1,x:0,duration:.6,ease:"power3.out"},3.0);
tl.fromTo("#@@l1",{opacity:0,x:20},{opacity:1,x:0,duration:.4},3.2);
tl.fromTo("#@@l2",{opacity:0,x:20},{opacity:1,x:0,duration:.4},3.7);
flow(tl,"#@@eqf",3,10,250);
tl.fromTo("#@@pg-n",{rotation:-100,svgOrigin:"650 820"},{rotation:70,svgOrigin:"650 820",duration:1.4,ease:"power2.out"},3.3);
tl.to("#@@opw",{x:-60,duration:.5,ease:"power2.inOut"},3.1);
tl.fromTo("#@@armR-a",{rotation:0,svgOrigin:"78 -405"},{rotation:-95,svgOrigin:"78 -405",duration:.5},3.3);
tl.fromTo("#@@lock",{opacity:0,y:-60},{opacity:1,y:0,duration:.5,ease:"bounce.out"},4.4);
tl.fromTo("#@@shackle",{y:-16},{y:0,duration:.25,ease:"power4.in"},4.9);
tl.fromTo("#@@tag",{rotation:-25,svgOrigin:"770 1070"},{rotation:0,svgOrigin:"770 1070",duration:1,ease:"elastic.out(1,.4)"},5.0);
tl.fromTo("#@@l3",{opacity:0,x:-20},{opacity:1,x:0,duration:.4},4.4);
tl.to("#@@l1",{opacity:0,duration:.3},4.4);
tl.to("#@@eqf",{opacity:.1,duration:.4},5.0);
tl.fromTo("#@@vwheel",{rotation:0,svgOrigin:"770 990"},{rotation:0},3);
/* forbidden actions */
tl.to("#@@dim",{opacity:.78,duration:.4},5.7);
tl.to("#@@eq",{opacity:.0,duration:.3},5.7);tl.to("#@@lock",{opacity:0,duration:.3},5.7);tl.to("#@@l2",{opacity:0,duration:.3},5.7);tl.to("#@@l3",{opacity:0,duration:.3},5.7);
tl.to("#@@opw",{opacity:.0,duration:.3},5.7);
[["#@@x1",6.5],["#@@x2",8.9],["#@@x3",10.9]].forEach(([c,t])=>{
 tl.fromTo(c,{opacity:0,x:-120,scale:.92},{opacity:1,x:0,scale:1,duration:.45,ease:"back.out(1.6)"},t);
 tl.fromTo("#@@redg",{opacity:0},{opacity:1,duration:.12,yoyo:true,repeat:3,immediateRender:false},t);
 tl.fromTo(c,{x:0},{keyframes:[{x:-10},{x:10},{x:-6},{x:0}],duration:.4,ease:"none",immediateRender:false},t+.45)});
tl.fromTo("#@@d",{opacity:0},{opacity:1,duration:.5},11.8);
window.__timelines["s6"]=tl;
})();
</script>
</template>
