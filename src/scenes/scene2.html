<script>

const lights = [180, 320, 460, 760, 900].map((x, i) => {

el("circle", { r: 140, fill: "url(#s2-orb)", opacity: .35 }, orbs);

[60, 92, 122].forEach((r, i) => el("circle", { r, fill: "none", stroke: "#22e4ff", "stroke-width": 2, "stroke-dasharray": i === 0 ? "none" : (i === 1 ? "30 14" : "6 10"), opacity: .9 - i * .2 }, og));

  tl.to(l.cone, { opacity: .55, duration: .5, ease: "power2.out" }, CH[1] + .15 + i * .32);

});

["#s2-r1", "#s2-r2", "#s2-r3", "#s2-r4"].forEach((r, i) => tl.fromTo(r, { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: .3, ease: "power2.out" }, CH[2] + 1.0 + i * .3));

arm.reach(tl, CH[2] - .8, 1.0, 612, 1066);
arm.reach(tl, CH[2] + 1.9, 1.0, 806, 1090);
arm.reach(tl, CH[2] + 3.6, 1.1, 900, 760);

camera(tl, "#s2-world", D, { s0: 1.0, s1: 1.1, x0: 0, x1: -30, y0: 0, y1: -20, origin: "540px 900px", ease: "sine.inOut" });
tl.add(particles(document.getElementById("s2-dust"), 34, 22, D, { rmax: 3, dy: -200 }), 0);
headline(tl, "s2", .9, 3.6);
sceneInOut(tl, "#s2-world, #s2-dust, #s2-touch", D);
window.__timelines["scene2"] = tl;
</script>
