<template>
<style>
{{CSS}}
#root .ttl{font-size:54px;top:232px}
#root .ttl span{opacity:.35}
#root .mon{position:absolute;top:1135px;width:200px;text-align:center;font-size:22px;font-weight:800;color:#9fb4d6;letter-spacing:.04em;line-height:1.15}
</style>
<div id="root" data-composition-id="s4" data-width="1080" data-height="1920">
<svg class="full" viewBox="0 0 1080 1920">
 <defs>
  <pattern id="@@grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#1d3a6b" stroke-width="1.5"/></pattern>
  <linearGradient id="@@body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5d7299"/><stop offset=".5" stop-color="#34456a"/><stop offset="1" stop-color="#1e2b47"/></linearGradient>
  <linearGradient id="@@cop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb35c"/><stop offset="1" stop-color="#b3541a"/></linearGradient>
  <radialGradient id="@@gb"><stop offset="0" stop-color="#35c4ff" stop-opacity=".7"/><stop offset="1" stop-color="#35c4ff" stop-opacity="0"/></radialGradient>
  <clipPath id="@@gclip"><rect x="600" y="750" width="240" height="140" rx="12"/></clipPath>
 </defs>
 <rect x="0" y="470" width="1080" height="860" fill="url(#@@grid)" opacity=".5"/>
 <g id="@@cam">
  <!-- steam inlet -->
  <path id="@@inP" d="M250 520 L250 760" stroke="#6c7f9c" stroke-width="40" fill="none"/>
  <rect x="226" y="610" width="48" height="16" fill="#8fa3c4"/>
  <!-- turbine casing -->
  <polygon points="80,775 570,715 570,925 80,865" fill="url(#@@body)" stroke="#9fb4d6" stroke-width="3"/>
  <polygon points="100,788 556,735 556,905 100,852" fill="#07101f" opacity=".9"/>
  <g id="@@discs"></g>
  <rect x="40" y="810" width="800" height="20" rx="8" fill="#cfd8ea" stroke="#6c7f9c" stroke-width="2"/>
  <path id="@@inF" d="M250 520 L250 790 L300 820 L550 820" stroke="#ff8a1f" stroke-width="9" stroke-dasharray="1.2 3.0" stroke-linecap="round" fill="none"/>
  <path id="@@inF2" d="M250 520 L250 790 L300 790 L550 770" stroke="#ffd2a0" stroke-width="5" stroke-dasharray="1 3.4" stroke-linecap="round" fill="none"/>
  <!-- exhaust + condenser -->
  <path id="@@exP" d="M520 925 L520 1000" stroke="#6c7f9c" stroke-width="30" fill="none"/>
  <path id="@@exF" d="M520 925 L520 1010" stroke="#35c4ff" stroke-width="8" stroke-dasharray="1.2 3.2" stroke-linecap="round" fill="none"/>
  <rect x="380" y="1000" width="260" height="80" rx="14" fill="url(#@@body)" stroke="#9fb4d6" stroke-width="3"/>
  <g id="@@ctubes" stroke="#35c4ff" stroke-width="4" opacity=".8"></g>
  <!-- bearing -->
  <rect x="600" y="800" width="26" height="40" fill="#6c7f9c"/>
  <!-- generator -->
  <rect x="600" y="745" width="250" height="150" rx="16" fill="url(#@@body)" stroke="#9fb4d6" stroke-width="3"/>
  <g clip-path="url(#@@gclip)"><rect x="610" y="760" width="230" height="120" fill="#07101f"/>
   <g id="@@coils"></g></g>
  <ellipse id="@@gglow" cx="725" cy="820" rx="190" ry="130" fill="url(#@@gb)" opacity="0"/>
  <g id="@@rotor"></g>
  <!-- rotor inset -->
  <g transform="translate(880 600)"><circle r="96" fill="#07101f" stroke="#35c4ff" stroke-width="3"/></g>
  <g id="@@rbl"></g>
  <!-- electrical -->
  <path id="@@eP" d="M850 820 L940 820 L940 900" stroke="#4b5d80" stroke-width="14" fill="none"/>
  <path id="@@eF" d="M850 820 L940 820 L940 900" stroke="#35c4ff" stroke-width="6" stroke-dasharray="1 2.6" stroke-linecap="round" fill="none"/>
  <rect x="890" y="900" width="100" height="110" rx="10" fill="url(#@@body)" stroke="#9fb4d6" stroke-width="3"/>
  <g stroke="#9fb4d6" stroke-width="3"><line x1="905" y1="915" x2="905" y2="1000"/><line x1="925" y1="915" x2="925" y2="1000"/><line x1="945" y1="915" x2="945" y2="1000"/><line x1="965" y1="915" x2="965" y2="1000"/></g>
  <path id="@@e2P" d="M940 1010 L940 1180" stroke="#4b5d80" stroke-width="14" fill="none"/>
  <path id="@@e2F" d="M940 1010 L940 1180" stroke="#35c4ff" stroke-width="6" stroke-dasharray="1 2.6" stroke-linecap="round" fill="none"/>
  <g id="@@city"></g>
  <g id="@@mons"></g>
 </g>
</svg>
<div class="kick" id="@@k" style="opacity:0">Турбина и генератор</div>
<div class="ttl" id="@@t"><span id="@@w1">ПАР</span> → <span id="@@w2">ТУРБИНА</span> → <span id="@@w3">ГЕНЕРАТОР</span> → <span id="@@w4">ЭЛЕКТРОЭНЕРГИЯ</span></div>
<div class="lbl" id="@@l1" style="left:60px;top:600px;opacity:0">ПАР ВЫСОКОГО ДАВЛЕНИЯ</div>
<div class="lbl blue" id="@@l2" style="left:60px;top:960px;opacity:0">ТУРБИНА</div>
<div class="lbl" id="@@l3" style="left:600px;top:930px;opacity:0">ГЕНЕРАТОР</div>
<div class="lbl blue" id="@@l4" style="left:620px;top:1020px;opacity:0;display:none">ВАЛ</div>
<div class="lbl blue" id="@@l5" style="left:760px;top:1000px;opacity:0;display:none">ЭЛЕКТРОЭНЕРГИЯ</div>
<div class="lbl" id="@@l6" style="left:690px;top:520px;opacity:0">РОТОР</div>
<div class="mon" id="@@m1" style="left:50px;opacity:0">ВИБРАЦИЯ</div>
<div class="mon" id="@@m2" style="left:270px;opacity:0">ТЕМПЕРАТУРА ПОДШИПНИКОВ</div>
<div class="mon" id="@@m3" style="left:490px;opacity:0">ЧАСТОТА ВРАЩЕНИЯ</div>
</div>
<script>
{{JS}}
(function(){
const tl=gsap.timeline({paused:true});
/* turbine discs (blade rows) */
const D=G("@@discs");
for(let i=0;i<7;i++){const x=130+i*62,h=18+i*7,cy=820-(i*-1)*0;mk(D,`<line class="bl" x1="${x}" y1="${820-h-14}" x2="${x}" y2="${820+h+14}" stroke="#35c4ff" stroke-width="9" stroke-dasharray="7 6" opacity=".95"/><rect x="${x-3}" y="${820-h-14}" width="6" height="${2*h+28}" fill="none"/>`)}
/* condenser tubes */
const CT=G("@@ctubes");for(let i=0;i<8;i++){const l=document.createElementNS(NS,"line");l.setAttribute("x1",400);l.setAttribute("x2",620);l.setAttribute("y1",1018+i*8);l.setAttribute("y2",1018+i*8);CT.appendChild(l)}
/* generator coils */
const CO=G("@@coils");for(let i=0;i<9;i++){const r=document.createElementNS(NS,"rect");r.setAttribute("x",625+i*24);r.setAttribute("y",772);r.setAttribute("width",14);r.setAttribute("height",96);r.setAttribute("rx",7);r.setAttribute("fill","url(#@@cop)");r.setAttribute("class","coil");CO.appendChild(r)}
/* rotor blades end-view */
const rb=G("@@rbl");let sp="";for(let i=0;i<12;i++){sp+=`<rect x="-4" y="-86" width="8" height="38" fill="#35c4ff" transform="rotate(${i*30})"/>`}
mk(rb,`<g id="@@rotv" transform="translate(880 600)">${sp}<circle r="28" fill="#cfd8ea"/><circle r="46" fill="none" stroke="#6c7f9c" stroke-width="4"/></g>`);
/* city */
const C=G("@@city");const wins=[];
for(let i=0;i<7;i++){const x=720+i*48,h=70+((i*37)%5)*22;mk(C,`<rect x="${x}" y="${1290-h}" width="42" height="${h}" fill="#14233f" stroke="#2f4a7a" stroke-width="2"/>`);for(let r=0;r<Math.floor(h/24);r++)for(let c=0;c<2;c++){const e=document.createElementNS(NS,"rect");e.setAttribute("x",x+8+c*18);e.setAttribute("y",1290-h+8+r*22);e.setAttribute("width",10);e.setAttribute("height",12);e.setAttribute("fill","#ffcf7a");e.setAttribute("opacity",0);C.appendChild(e);wins.push(e)}}
/* monitors */
const M=G("@@mons");
for(let i=0;i<3;i++){const x=50+i*220;mk(M,`<rect x="${x}" y="1190" width="200" height="90" rx="10" fill="#07101f" stroke="#35c4ff" stroke-width="2" class="mp" opacity="0"/><polyline class="ln" points="${x+10},1250 ${x+40},1230 ${x+70},1245 ${x+100},1215 ${x+130},1240 ${x+160},1225 ${x+190},1238" fill="none" stroke="${i==1?"#ff8a1f":"#35c4ff"}" stroke-width="4" opacity="0"/>`)}
/* ---- timeline ---- */
tl.fromTo("#@@k",{opacity:0,x:-30},{opacity:1,x:0,duration:.4},.3);
tl.fromTo("#@@t",{opacity:0,y:30},{opacity:1,y:0,duration:.6,ease:"power3.out"},.45);
tl.fromTo("#@@cam",{opacity:0,y:60},{opacity:1,y:0,duration:.9,ease:"power3.out"},.5);
tl.fromTo("#@@cam",{scale:1.0,svgOrigin:"540 880"},{scale:1.07,svgOrigin:"540 880",duration:14.5,ease:"sine.inOut",immediateRender:false},.5);
const word=(id,t)=>{tl.to(id,{opacity:1,color:"#ff8a1f",duration:.3},t);tl.to(id,{color:"#ffffff",duration:.4},t+1.6)};
word("#@@w1",.8);word("#@@w2",2.2);word("#@@w3",5.0);word("#@@w4",7.3);
/* motion */
flow(tl,"#@@inF",.8,14,260);flow(tl,"#@@inF2",.8,14,340);flow(tl,"#@@exF",1.5,13,260);
SEL("#@@discs .bl").forEach((e,i)=>{e.setAttribute("pathLength","100");tl.fromTo(e,{strokeDashoffset:0},{strokeDashoffset:-400,duration:14,ease:"none"},1.0)});
tl.fromTo("#@@rotv",{rotation:0,svgOrigin:"880 600"},{rotation:360*9,svgOrigin:"880 600",duration:14,ease:"power1.in"},1.0);
SEL("#@@coils .coil").forEach((e,i)=>tl.fromTo(e,{opacity:.55},{opacity:1,duration:.12,yoyo:true,repeat:100,ease:"sine.inOut"},.9+i*.04));
flow(tl,"#@@eF",5.2,9.4,-300);flow(tl,"#@@e2F",5.4,9.2,-300);
SEL("#@@ctubes line").forEach((e,i)=>tl.fromTo(e,{opacity:.4},{opacity:1,duration:.5,yoyo:true,repeat:25,ease:"sine.inOut"},1+i*.1));
/* labels */
tl.fromTo("#@@l1",{opacity:0,x:-20},{opacity:1,x:0,duration:.4},.9);
tl.fromTo("#@@l2",{opacity:0,x:-20},{opacity:1,x:0,duration:.4},2.3);
tl.fromTo("#@@l6",{opacity:0,x:20},{opacity:1,x:0,duration:.4},3.0);
tl.to("#@@l1",{opacity:0,duration:.3},3.6);
tl.fromTo("#@@l3",{opacity:0,x:-20},{opacity:1,x:0,duration:.4},5.0);
tl.fromTo("#@@gglow",{opacity:0},{opacity:1,duration:.6},5.0);pulse(tl,"#@@gglow",5.6,9,.6,1,.6);
/* city lights up when electricity arrives */
wins.forEach((e,i)=>tl.fromTo(e,{opacity:0},{opacity:.4+((i*3)%4)*.18,duration:.15},7.4+i*.05));
tl.to("#@@l2",{opacity:0,duration:.3},7.6);tl.to("#@@l6",{opacity:0,duration:.3},7.6);tl.to("#@@l3",{opacity:0,duration:.3},8.6);
/* monitors during control sentence */
SEL("#@@mons .mp").forEach((e,i)=>tl.fromTo(e,{opacity:0},{opacity:1,duration:.4},9.3+i*.5));
SEL("#@@mons .ln").forEach((e,i)=>{tl.fromTo(e,{opacity:0},{opacity:1,duration:.3},9.6+i*.5);tl.fromTo(e,{x:0},{x:-24,duration:.5,yoyo:true,repeat:14,ease:"sine.inOut",immediateRender:false},9.9+i*.5)});
["#@@m1","#@@m2","#@@m3"].forEach((m,i)=>tl.fromTo(m,{opacity:0,y:10},{opacity:1,y:0,duration:.4},9.5+i*.5));
window.__timelines["s4"]=tl;
})();
</script>
</template>
