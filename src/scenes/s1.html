(function(){

const D=12.9;

const stars=G("@@stars");for(let i=0;i<46;i++){const c=document.createElementNS(NS,"circle");c.setAttribute("cx",(i*173+40)%1080);c.setAttribute("cy",(i*97+30)%760);c.setAttribute("r",1+(i%3)*.7);c.setAttribute("fill","#cfe4ff");c.setAttribute("opacity",.3+(i%5)*.12);stars.appendChild(c)}
