<template>
<style>
{{CSS}}
#root .ttl{font-size:62px;line-height:1.02}
#root .ttl span{display:block;color:#fff;opacity:.4}
#root .tag{position:absolute;font-size:30px;font-weight:900;padding:10px 20px;border-radius:8px;white-space:nowrap}
#root .badge{position:absolute;left:690px;top:462px;width:320px;text-align:center;font-size:32px;font-weight:900;padding:14px 10px;border-radius:12px;background:#ff8a1f;color:#1a0d00}
</style>
<div id="root" data-composition-id="s7" data-width="1080" data-height="1920">
<svg class="full" viewBox="0 0 1080 1920">
 <defs>
  <pattern id="@@grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#1d3a6b" stroke-width="1.5"/></pattern>
  <linearGradient id="@@body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a7fa6"/><stop offset=".5" stop-color="#37486e"/><stop offset="1" stop-color="#1e2b47"/></linearGradient>
  <linearGradient id="@@beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff6c8" stop-opacity=".8"/><stop offset="1" stop-color="#fff6c8" stop-opacity="0"/></linearGradient>
 </defs>
 <rect x="0" y="470" width="1080" height="860" fill="url(#@@grid)" opacity=".5"/>
 <!-- STAGE 1: control room -->
 <g id="@@st1" opacity="0">
  <rect x="50" y="500" width="980" height="470" rx="16" fill="#0a1325" stroke="#2f4a7a" stroke-width="3"/>
  <g id="@@mw"></g>
  <rect x="50" y="990" width="980" height="64" rx="10" fill="url(#@@body)"/>
  <g id="@@btns"></g>
 </g>
 <!-- STAGE 2: pipes inspection -->
 <g id="@@st2" opacity="0">
  <rect x="0" y="560" width="1080" height="44" fill="#4b5d80"/><rect x="0" y="650" width="1080" height="30" fill="#4b5d80"/>
  <rect x="0" y="1020" width="1080" height="50" fill="#4b5d80"/>
  <g fill="#6c7f9c"><rect x="150" y="548" width="16" height="68"/><rect x="480" y="548" width="16" height="68"/><rect x="810" y="548" width="16" height="68"/><rect x="300" y="1008" width="16" height="74"/><rect x="700" y="1008" width="16" height="74"/></g>
  <path d="M0 582 L1080 582" stroke="#ff8a1f" stroke-width="7" stroke-dasharray="1.4 3" stroke-linecap="round" fill="none" id="@@p2a"/>
  <path d="M0 1045 L1080 1045" stroke="#35c4ff" stroke-width="8" stroke-dasharray="1.4 3" stroke-linecap="round" fill="none" id="@@p2b"/>
  <g id="@@g2"></g>
  <g id="@@chk2"></g>
  <path id="@@fl" d="M0 0 L520 -150 L520 150 Z" fill="url(#@@beam)" opacity="0"/>
 </g>
 <!-- STAGE 3: log + deviation -->
 <g id="@@st3" opacity="0">
  <rect x="60" y="520" width="590" height="700" rx="16" fill="#e8eefb" stroke="#fff" stroke-width="3"/>
  <rect x="60" y="520" width="590" height="80" rx="16" fill="#27406e"/>
  <g id="@@rows"></g>
  <rect id="@@pen" x="0" y="0" width="14" height="86" rx="6" fill="#ff8a1f" transform="translate(560 560) rotate(30)" opacity="0"/>
  <rect x="690" y="520" width="330" height="230" rx="14" fill="#050b18" stroke="#35c4ff" stroke-width="3"/>
  <rect x="705" y="600" width="300" height="90" fill="#ff8a1f" opacity=".14"/>
  <line x1="705" y1="600" x2="1005" y2="600" stroke="#ff8a1f" stroke-width="3" stroke-dasharray="10 8"/>
  <line x1="705" y1="690" x2="1005" y2="690" stroke="#ff8a1f" stroke-width="3" stroke-dasharray="10 8"/>
  <polyline id="@@dev" points="710,650 760,645 810,652 860,625 910,580 960,555 1000,690" fill="none" stroke="#35c4ff" stroke-width="6" stroke-linejoin="round"/>
  <circle id="@@devdot" cx="710" cy="650" r="10" fill="#fff"/>
 </g>
 <g transform="translate(0 0)"><g id="@@opw">
  <g transform="translate(860 1290) scale(1.0)" id="@@opp">{{include:operator:b}}</g></g></g>
</svg>
<div class="kick" id="@@k" style="opacity:0">Роль оператора</div>
<div class="ttl" id="@@t" style="opacity:0"><span id="@@w1">КОНТРОЛЬ.</span><span id="@@w2">ОТВЕТСТВЕННОСТЬ.</span><span id="@@w3">ДИСЦИПЛИНА.</span></div>
<div class="tag" id="@@a1" style="left:70px;top:1090px;background:#1b3a6e;opacity:0">НАБЛЮДЕНИЕ ЗА ОБОРУДОВАНИЕМ</div>
<div class="tag" id="@@a2" style="left:70px;top:1130px;background:#1b3a6e;opacity:0">ОСМОТР ТРУБОПРОВОДОВ И АРМАТУРЫ</div>
<div class="tag" id="@@a3" style="left:70px;top:1260px;background:#27406e;opacity:0">ЖУРНАЛ ПАРАМЕТРОВ</div>
<div class="badge" id="@@bd" style="opacity:0">ОТКЛОНЕНИЕ!</div>
</div>
<script>
{{JS}}
(function(){
const tl=gsap.timeline({paused:true});
/* monitor wall */
const MW=G("@@mw");for(let i=0;i<3;i++){const x=75+i*315;mk(MW,`<rect x="${x}" y="525" width="290" height="420" rx="10" fill="#050b18" stroke="#35c4ff" stroke-width="2"/><polyline class="tr" points="${x+14},880 ${x+50},850 ${x+90},870 ${x+130},800 ${x+170},840 ${x+210},780 ${x+250},810 ${x+276},790" fill="none" stroke="${i==1?"#ff8a1f":"#35c4ff"}" stroke-width="5"/><g class="bars">${[0,1,2,3,4].map(k=>`<rect class="bar" x="${x+20+k*52}" y="560" width="30" height="${70+((k*37+i*21)%50)}" fill="#1d4f8a"/>`).join("")}</g><circle cx="${x+260}" cy="552" r="9" fill="${i==1?"#ff8a1f":"#2fd16b"}" class="ld"/>`)}
const BT=G("@@btns");for(let i=0;i<10;i++)mk(BT,`<circle cx="${110+i*88}" cy="1022" r="14" fill="${i%3==0?"#ff8a1f":"#35c4ff"}" class="bt" opacity=".35"/>`);
/* inspection gauges */
const G2=G("@@g2");gauge(G2,"@@ga",260,800,80,"#35c4ff");gauge(G2,"@@gb",620,800,80,"#ff8a1f");gauge(G2,"@@gc",960,800,80,"#35c4ff");
const CK=G("@@chk2");[[260,720],[620,720],[960,720]].forEach(([x,y],i)=>mk(CK,`<path d="M${x-26} ${y} L${x-6} ${y+22} L${x+30} ${y-24}" stroke="#2fd16b" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round" class="ck"/>`));
mk(CK,`<path d="M470 1000 L490 1022 L526 976" stroke="#2fd16b" stroke-width="12" fill="none" stroke-linecap="round" class="ck"/>`);
/* log rows */
const RW=G("@@rows");for(let i=0;i<9;i++){mk(RW,`<rect x="90" y="${630+i*64}" width="530" height="3" fill="#9fb0d0"/><rect x="100" y="${645+i*64}" width="30" height="30" rx="5" fill="none" stroke="#27406e" stroke-width="3"/><path class="tk" d="M105 ${660+i*64} L115 ${672+i*64} L134 ${644+i*64}" stroke="#2fd16b" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><line class="wr" x1="150" y1="${660+i*64}" x2="${380+((i*53)%200)}" y2="${660+i*64}" stroke="#27406e" stroke-width="8" stroke-linecap="round"/>`)}
mk(RW,`<text x="90" y="575" fill="#fff" font-size="40" font-weight="900" font-family="InterRU">ЖУРНАЛ ПАРАМЕТРОВ</text>`);
/* intro */
tl.fromTo("#@@k",{opacity:0,x:-30},{opacity:1,x:0,duration:.4},.3);
tl.fromTo("#@@t",{opacity:0,y:30},{opacity:1,y:0,duration:.6,ease:"power3.out"},.45);
const word=(id,t)=>tl.to(id,{opacity:1,color:"#ff8a1f",duration:.35},t);
word("#@@w1",1.0);word("#@@w2",5.0);word("#@@w3",10.2);
/* operator */
tl.fromTo("#@@opw",{opacity:0,y:60},{opacity:1,y:0,duration:.7,ease:"power3.out"},.5);
tl.fromTo("#@@opw",{y:0},{y:-6,duration:1.2,yoyo:true,repeat:4,ease:"sine.inOut",immediateRender:false},1.3);
/* stage 1 */
tl.fromTo("#@@st1",{opacity:0,y:30},{opacity:1,y:0,duration:.7,ease:"power3.out"},.5);
SEL("#@@mw .tr").forEach((e,i)=>tl.fromTo(e,{x:0},{x:-22,duration:.45,yoyo:true,repeat:14,ease:"sine.inOut"},.7+i*.12));
SEL("#@@mw .bar").forEach((e,i)=>tl.fromTo(e,{scaleY:.6,svgOrigin:"0 560"},{scaleY:1.15,svgOrigin:"0 560",duration:.5+((i*7)%5)*.07,yoyo:true,repeat:8,ease:"sine.inOut"},.7));
pulse(tl,"#@@mw .ld",.6,6,.3,1,.5);
SEL("#@@btns .bt").forEach((e,i)=>tl.fromTo(e,{opacity:.35},{opacity:1,duration:.2,yoyo:true,repeat:9,repeatDelay:.5+i*.07},1+i*.15));
tl.fromTo("#@@a1",{opacity:0,x:-20},{opacity:1,x:0,duration:.4},1.2);
tl.fromTo("#@@opp",{rotation:0},{rotation:0},0);
tl.fromTo("#@@armR-b",{rotation:0,svgOrigin:"78 -405"},{rotation:-120,svgOrigin:"78 -405",duration:.6,ease:"power2.out"},1.8);
tl.to("#@@armR-b",{rotation:0,svgOrigin:"78 -405",duration:.5},3.7);
/* stage 2 */
tl.to("#@@st1",{opacity:0,y:-20,duration:.4},4.0);tl.to("#@@a1",{opacity:0,duration:.3},4.0);
tl.fromTo("#@@st2",{opacity:0,x:60},{opacity:1,x:0,duration:.5,ease:"power3.out"},4.0);
tl.fromTo("#@@a2",{opacity:0,x:-20},{opacity:1,x:0,duration:.4},4.3);
flow(tl,"#@@p2a",4,10,300);flow(tl,"#@@p2b",4,10,-300);
tl.to("#@@opw",{x:-640,duration:2.6,ease:"power1.inOut"},4.1);
tl.fromTo("#@@gc-n",{rotation:-100,svgOrigin:"960 800"},{rotation:30,svgOrigin:"960 800",duration:1,ease:"power2.out"},4.4);
tl.fromTo("#@@ga-n",{rotation:-100,svgOrigin:"260 800"},{rotation:20,svgOrigin:"260 800",duration:1,ease:"power2.out"},4.4);
tl.fromTo("#@@gb-n",{rotation:-100,svgOrigin:"620 800"},{rotation:35,svgOrigin:"620 800",duration:1,ease:"power2.out"},4.4);
SEL("#@@chk2 .ck").forEach((e,i)=>{e.setAttribute("pathLength","1");tl.fromTo(e,{strokeDasharray:"1 1",strokeDashoffset:1,opacity:1},{strokeDashoffset:0,duration:.35},5.0+i*.6)});
tl.fromTo("#@@fl",{opacity:0,x:760,y:1000},{opacity:.9,x:760,y:1000,duration:.3},4.6);
tl.to("#@@fl",{x:400,y:980,duration:2.4,ease:"sine.inOut"},4.9);
/* stage 3 */
tl.to("#@@st2",{opacity:0,duration:.4},7.3);tl.to("#@@a2",{opacity:0,duration:.3},7.3);tl.to("#@@fl",{opacity:0,duration:.2},7.2);
tl.fromTo("#@@st3",{opacity:0,y:40},{opacity:1,y:0,duration:.6,ease:"power3.out"},7.4);
tl.fromTo("#@@opw",{x:-640,y:0},{x:0,y:60,duration:.01,immediateRender:false},7.3);
tl.fromTo("#@@a3",{opacity:0,x:-20},{opacity:1,x:0,duration:.4},7.8);
SEL("#@@rows .wr").forEach((e,i)=>{e.setAttribute("pathLength","1");tl.fromTo(e,{strokeDasharray:"1 1",strokeDashoffset:1},{strokeDashoffset:0,duration:.5,ease:"none"},7.8+i*.55)});
SEL("#@@rows .tk").forEach((e,i)=>{e.setAttribute("pathLength","1");tl.fromTo(e,{strokeDasharray:"1 1",strokeDashoffset:1},{strokeDashoffset:0,duration:.25},8.05+i*.55)});
tl.fromTo("#@@pen",{opacity:0},{opacity:1,duration:.2},7.9);
tl.fromTo("#@@pen",{x:0,y:0},{x:-200,y:0,duration:.5,yoyo:true,repeat:8,ease:"sine.inOut",immediateRender:false},8);
tl.to("#@@pen",{opacity:0,duration:.3},13.0);
/* deviation + reaction (8.6 - 12) */
tl.fromTo("#@@dev",{strokeDasharray:"1 1",strokeDashoffset:1},{strokeDashoffset:0,duration:2,ease:"none"},8.4);
tl.fromTo("#@@dev",{stroke:"#35c4ff"},{stroke:"#ff3b3b",duration:.4,immediateRender:false},10.2);
tl.fromTo("#@@bd",{opacity:0,scale:.7},{opacity:1,scale:1,duration:.35,ease:"back.out(2)"},10.4);
pulse(tl,"#@@bd",10.8,1.4,.4,1,.35);
tl.fromTo("#@@armR-b",{rotation:0,svgOrigin:"78 -405"},{rotation:-140,svgOrigin:"78 -405",duration:.5,ease:"power2.out",immediateRender:false},11.4);
tl.to("#@@bd",{backgroundColor:"#35c4ff",color:"#04101f",duration:.3},12.4);
tl.to("#@@dev",{stroke:"#35c4ff",duration:.3},12.4);
window.__timelines["s7"]=tl;
})();
</script>
</template>
