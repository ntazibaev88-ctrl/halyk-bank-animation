<template>

  <script>
    /* SCENE 4 — THE HIDDEN MECHANISM (33.90–51.34 s, 17.44 s)

       B 5.2–7.2  «Он отбирает информацию,»                               street in the dark, the brain's flashlight picks two things

       E 11.4–17.4 «Поэтому твоя память — не идеальная видеозапись прошлого.»  the memory plays on a CRT and glitches */
    (function () {
      const DUR = 17.44;

      const { TIM, ANYA, drawHuman, drawBrain, drawFace } = CHAR;

      /* the memory picture: a sunny day, Tim and Anya, a yellow balloon */
      function memoryPic(t) {

        mx.fillStyle = g; mx.fillRect(0, 0, MW, MH);

        mx.fillStyle = "#6B4BC8"; mx.beginPath(); mx.moveTo(0, 380); mx.quadraticCurveTo(200, 280, 420, 360); mx.quadraticCurveTo(560, 320, 640, 350); mx.lineTo(640, 480); mx.lineTo(0, 480); mx.fill();
        mx.fillStyle = "#4E2A8E"; mx.fillRect(0, 410, MW, 70);

        line(mx, [[268, 250], [290, 160], [300, 90]], 3, PAL.ink, { seed: 5 });
        shape(mx, ellipsePts(302, 60, 34, 42, 14), { fill: PAL.yellow, lw: 5, seed: 6 });
      }

      function camcorder(t, recX) {
        // body
        shape(ctx, [[-260, -150], [200, -150], [230, -120], [230, 140], [-260, 140], [-280, 110], [-280, -120]], { fill: "#2B2F6E", shade: ["#20245A", 20, 16], seed: 41, tension: 0.4, lw: 9 });
        // lens barrel toward the viewer
        circle(ctx, 0, -5, 150, "#151845", 9); circle(ctx, 0, -5, 112, "#0B0C26", 7);
        const lg = ctx.createRadialGradient(-30, -40, 10, 0, -5, 110); lg.addColorStop(0, "#9B7BFF"); lg.addColorStop(0.5, "#3A1E86"); lg.addColorStop(1, "#0B0C26");
        ctx.beginPath(); ctx.arc(0, -5, 96, 0, Math.PI * 2); ctx.fillStyle = lg; ctx.fill();
        circle(ctx, -36, -46, 18, rgba(PAL.white, 0.8)); circle(ctx, 30, 30, 8, rgba(PAL.white, 0.5));
        // viewfinder + REC

        const blink = Math.floor(t * 2.5) % 2 === 0;

        if (recX > 0) {

      function street(t, ctx2) {
        HF.vgrad(ctx2, [[0, "#232A78"], [1, "#2F2A8E"]], 0, 300, 1080, 900);
        const R = rng(3);
        for (let i = 0; i < 7; i++) { const w = 120 + R() * 90, h = 260 + R() * 280, x = i * 160 - 20; ctx2.fillStyle = i % 2 ? "#1B1F5E" : "#20266C"; ctx2.fillRect(x, 1080 - h, w, h);

        ctx2.fillStyle = "#14174A"; ctx2.fillRect(0, 1080, 1080, 200);
        ctx2.fillStyle = rgba(PAL.lav, 0.4); for (let i = 0; i < 6; i++) ctx2.fillRect(i * 200 + ((t * 80) % 200) - 100, 1170, 110, 12);
        // passers-by (generic silhouettes), a bike, a sign

        });
        // the dog
        ctx2.save(); ctx2.translate(640, 1120);
        shape(ctx2, ellipsePts(0, 0, 70, 38, 14), { fill: "#C98A4B", lw: 6, seed: 71 });
        shape(ctx2, ellipsePts(70, -36, 34, 30, 12), { fill: "#C98A4B", lw: 6, seed: 72 });
        shape(ctx2, ellipsePts(84, -62, 12, 22, 8), { fill: "#8A5528", lw: 5, seed: 73 });
        circle(ctx2, 82, -40, 5, PAL.ink); circle(ctx2, 102, -30, 7, PAL.ink);

        [-40, -10, 20, 46].forEach((x) => line(ctx2, [[x, 24], [x, 52]], 10, "#8A5528", { seed: 75 + x }));
        ctx2.restore();
        // the balloon
        line(ctx2, [[300, 1060], [306, 900], [300, 830]], 3, PAL.cream, { seed: 76 });
        shape(ctx2, ellipsePts(300 + Math.sin(t * 2) * 6, 790, 50, 62, 14), { fill: PAL.yellow, lw: 6, seed: 77 });
        // bus stop sign
        line(ctx2, [[820, 1100], [820, 860]], 10, "#8C87C8", { seed: 78 }); circle(ctx2, 820, 840, 40, "#4FB0FF", 6);
      }

      function draw(t) {
        HF.setBoil(t);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = "#070A1F"; ctx.fillRect(0, 0, 1080, 1920);
        const [shx, shy] = shake(t, 16 * win(t, 4.16, 4.5, 0.02, 0.3) + 12 * win(t, 8.5, 8.8, 0.02, 0.25) + 22 * win(t, 13.66, 14.2, 0.02, 0.4), 30, 11);

        /* ===== A: camcorder (0–5.3) ===== */
        if (t < 5.4) {
          const cam = { x: 0, y: 0, z: K(t, [[0, 1.25], [1.7, 1.05, "out3"], [4.1, 1.1], [4.25, 1.2, "out3"], [5.2, 1.25]]), r: K(t, [[0, 0.04], [5.2, -0.02]]), sx: shx, sy: shy };
          HF.vgrad(ctx, [[0, "#1E1660"], [1, "#0A0C2E"]]);
          HF.withCam(ctx, cam, 0.4, () => HF.neurons(ctx, t, 401, [-100, 100, 1280, 1600], 0.6));
          HF.withCam(ctx, cam, 1, () => {
            const recX = E.back(inv(2.24, 2.5, t));
            ctx.save(); ctx.translate(540, 820); ctx.rotate(Math.sin(t * 1.2) * 0.03); camcorder(t, recX); ctx.restore();
            // tape pulled out and unspooling (3.16+)
            const tp = E.out3(inv(3.1, 3.9, t));
            if (tp > 0) {
              ctx.save(); ctx.translate(380, 980);
              rrect(ctx, -110, -40 + tp * 160, 220, 120, 14); ctx.fillStyle = "#1A1A2E"; ctx.fill(); ctx.lineWidth = 7; ctx.strokeStyle = PAL.ink; ctx.stroke();
              circle(ctx, -50, 20 + tp * 160, 26, PAL.lav, 5); circle(ctx, 50, 20 + tp * 160, 26, PAL.lav, 5);
              ctx.restore();
              // film ribbon snaking
              const cut = t > 4.16;
              const pts = []; for (let i = 0; i <= 30 * tp; i++) { const k = i / 30; pts.push([380 + Math.sin(k * 9 + t * 2) * 140 * k + k * 300, 1180 + k * 160 + Math.cos(k * 7) * 30]); }
              const half = cut ? Math.floor(pts.length * 0.55) : pts.length;
              ctx.lineWidth = 34; ctx.lineCap = "round"; ctx.strokeStyle = "#6A55C8";
              ctx.beginPath(); pts.slice(0, half).forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.stroke();
              if (cut) { const dy = E.in(inv(4.16, 5.2, t)) * 300; ctx.beginPath(); pts.slice(half + 1).forEach(([x, y], i) => (i ? ctx.lineTo(x + 30, y + dy) : ctx.moveTo(x + 30, y + dy))); ctx.stroke(); }
            }
            // brain lands on top with scissors
            const bl = E.back(inv(1.7, 2.1, t));
            if (bl > 0) {
              drawBrain(ctx, { x: 560, y: lerp(-200, 540, bl), s: 0.75, mood: 0.1, open: 1, look: [0.3, 1], mouth: S(t, [[0, "smirk"], [4.1, "grin"]]), mouthOpen: 0.7, armL: [0.6, 0.4], armR: [K(t, [[3.6, 0.8], [4.1, 1.6], [4.3, 1.2]]), 0.6], armLen: 90, glow: 0.6 }, t);
              // scissors
              const snip = Math.abs(Math.sin(Math.max(0, t - 3.9) * 18)) * (t > 3.9 && t < 4.5 ? 1 : 0.2);
              ctx.save(); ctx.translate(710, 590 + (1 - bl) * -600); ctx.rotate(0.6);
              [-1, 1].forEach((s2) => { ctx.save(); ctx.rotate(s2 * (0.15 + snip * 0.35)); rrect(ctx, -8, -110, 16, 110, 8); ctx.fillStyle = "#D7DCF5"; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = PAL.ink; ctx.stroke(); circle(ctx, s2 * 18, 26, 22, "#FF4F7B", 6); ctx.restore(); });
              circle(ctx, 0, 0, 7, PAL.ink); ctx.restore();
            }
            // label swap: ЗАПИСЬ → МОНТАЖ
            const l1 = win(t, 0.3, 2.3, 0.2, 0.15), l2 = pop(t, 4.2, 0.35, "back2");
            const ly = 960 - 610 / cam.z;
            if (l1 > 0) text(ctx, "ЗАПИСЬ?", 540, ly, { size: 70, color: PAL.cream, stroke: PAL.ink, sw: 14, alpha: l1 });
            if (l2 > 0) { ctx.save(); ctx.translate(540, ly); ctx.rotate(-0.05); ctx.scale(l2, l2); text(ctx, "МОНТАЖ!", 0, 0, { size: 92, color: PAL.yellow, stroke: PAL.ink, sw: 16, shadow: "rgba(255,201,60,0.8)", blur: 30 }); ctx.restore(); }
          });
        }

        /* ===== B: spotlight street (5.2–7.3) ===== */
        if (t >= 5.2 && t < 7.4) {
          const k = E.out3(inv(5.2, 5.5, t));
          ctx.save(); ctx.globalAlpha = k;
          const cam = { x: K(t, [[5.2, -40], [7.3, 40]]), y: 60, z: K(t, [[5.2, 1.18], [7.3, 1.08]]), r: 0, sx: shx, sy: shy };
          HF.withCam(ctx, cam, 1, () => street(t, ctx));
          // darkness with spotlight holes
          const spots = [];
          const s1x = K(t, [[5.35, 200], [5.65, 690, "io3"], [6.3, 690], [6.55, 300, "io3"], [7.3, 300]]), s1y = K(t, [[5.35, 700], [5.65, 1090, "io3"], [6.3, 1090], [6.55, 800, "io3"]]);
          spots.push([s1x, s1y, 170]);
          ctx.save(); ctx.beginPath(); ctx.rect(0, 0, 1080, 1920); spots.forEach(([x, y, r]) => { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, Math.PI * 2, true); });
          ctx.fillStyle = rgba("#03040F", 0.86); ctx.fill("evenodd"); ctx.restore();
          spots.forEach(([x, y, r]) => { ctx.save(); ctx.globalCompositeOperation = "lighter"; glow(ctx, x, y, r * 1.3, PAL.yellow, 0.25); ctx.restore(); ctx.lineWidth = 6; ctx.strokeStyle = rgba(PAL.yellow, 0.7); ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke(); });
          // beam from the brain's flashlight
          const bx = 860, by = 360;
          ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = 0.18 * k;
          ctx.beginPath(); ctx.moveTo(bx - 20, by); ctx.lineTo(s1x - 160, s1y); ctx.lineTo(s1x + 160, s1y); ctx.lineTo(bx + 20, by); ctx.closePath(); ctx.fillStyle = PAL.yellow; ctx.fill(); ctx.restore();
          drawBrain(ctx, { x: bx + 40, y: by - 90, s: 0.62, mood: 0.1, open: 1, look: [clamp((s1x - bx) / 400, -1, 1), 1], mouth: "smirk", armL: [1.0, 0.5], armLen: 80, glow: 0.4 }, t);
          rrect(ctx, bx - 40, by - 30, 80, 40, 12); ctx.fillStyle = "#3A3F8A"; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = PAL.ink; ctx.stroke();
          // tags on what got picked
          [[5.75, 690, 900, "ВАЖНО!"], [6.6, 300, 590, "ВАЖНО!"]].forEach(([t0, x, y, s2]) => {
            const p2 = pop(t, t0, 0.3, "back2"); if (p2 <= 0) return;
            ctx.save(); ctx.translate(x, y); ctx.scale(p2, p2); ctx.rotate(-0.06);
            rrect(ctx, -120, -38, 240, 76, 22); ctx.fillStyle = PAL.yellow; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = PAL.ink; ctx.stroke();
            text(ctx, s2, 0, 3, { size: 34, color: PAL.ink }); ctx.restore();
          });
          text(ctx, "ОТБОР", 540, 250, { size: 54, color: PAL.cream, stroke: PAL.ink, sw: 12, track: 6, alpha: win(t, 5.4, 7.2, 0.2, 0.2) });
          ctx.restore();
        }

        /* ===== C: the monster in the corner (7.2–9.1) ===== */
        if (t >= 7.2 && t < 9.2) {
          const k = E.out3(inv(7.2, 7.4, t));
          const lit = E.out3(inv(8.5, 8.62, t));
          ctx.save(); ctx.translate((1 - k) * -1080, 0);
          const cam = { x: 0, y: 0, z: K(t, [[7.2, 1.0], [8.45, 1.12], [8.6, 1.0, "out3"]]), r: 0, sx: shx, sy: shy };
          ctx.fillStyle = HF.mix("#07081E", "#3B2F86", lit); ctx.fillRect(0, 0, 1080, 1920);
          HF.withCam(ctx, cam, 1, () => {
            // floor / wall
            ctx.fillStyle = HF.mix("#0B0C26", "#4C3A9E", lit); ctx.fillRect(-200, 1100, 1480, 900);
            // the shadow-monster on the wall
            ctx.save(); ctx.globalAlpha = 1 - lit * 0.85;
            const wob = Math.sin(t * 5) * 6;
            ctx.fillStyle = "#020210";
            ctx.beginPath(); ctx.moveTo(300, 1100); ctx.lineTo(300 + wob, 640); ctx.quadraticCurveTo(360, 420, 540, 400); ctx.quadraticCurveTo(720, 420, 780 - wob, 640); ctx.lineTo(780, 1100); ctx.closePath(); ctx.fill();
            [[300, 700, -1], [780, 700, 1]].forEach(([x, y, s2]) => { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + s2 * 160, y + 120 + wob); ctx.lineTo(x + s2 * 120, y + 150); ctx.lineTo(x + s2 * 170, y + 200); ctx.lineTo(x, y + 220); ctx.fill(); });
            // horns
            ctx.beginPath(); ctx.moveTo(430, 440); ctx.lineTo(380, 330); ctx.lineTo(480, 420); ctx.moveTo(650, 440); ctx.lineTo(700, 330); ctx.lineTo(600, 420); ctx.fill();
            ctx.shadowColor = "#FF3B5C"; ctx.shadowBlur = 30;
            [[470, 560], [610, 560]].forEach(([x, y]) => { ctx.beginPath(); ctx.ellipse(x, y, 30, 14, 0, 0, Math.PI * 2); ctx.fillStyle = "#FF3B5C"; ctx.fill(); });
            ctx.restore();
            // the truth: a chair with a coat and a hat
            ctx.save(); ctx.globalAlpha = lit;
            rrect(ctx, 390, 880, 300, 40, 12); ctx.fillStyle = "#8A5A3B"; ctx.fill(); ctx.lineWidth = 7; ctx.strokeStyle = PAL.ink; ctx.stroke();
            [[400, 920], [670, 920]].forEach(([x, y]) => { ctx.fillStyle = "#8A5A3B"; ctx.fillRect(x, y, 22, 200); ctx.strokeRect(x, y, 22, 200); });
            rrect(ctx, 420, 600, 240, 30, 10); ctx.fillStyle = "#8A5A3B"; ctx.fill(); ctx.stroke();
            shape(ctx, [[440, 610], [640, 610], [700, 760], [660, 980], [420, 980], [380, 760]], { fill: "#3E4FA8", shade: ["#2E3B86", 16, 0], seed: 81, tension: 0.5 });
            shape(ctx, [[460, 560], [620, 560], [600, 500], [480, 500]], { fill: "#2A2266", seed: 82, tension: 0.4 });
            shape(ctx, [[420, 570], [660, 570], [660, 590], [420, 590]], { fill: "#2A2266", seed: 83, tension: 0.2 });
            ctx.restore();
          });
          // labels
          const q = win(t, 7.4, 8.5, 0.15, 0.05);
          if (q > 0) { ctx.save(); ctx.translate(540 + shx, 260); ctx.scale(q, q); text(ctx, "МОНСТР?!", 0, 0, { size: 86, color: "#FF4F7B", stroke: PAL.ink, sw: 16 }); ctx.restore(); }
          const a2 = pop(t, 8.6, 0.3, "back2");
          if (a2 > 0) { ctx.save(); ctx.translate(540, 260); ctx.scale(a2, a2); text(ctx, "…ПАЛЬТО", 0, 0, { size: 86, color: PAL.yellow, stroke: PAL.ink, sw: 16 }); ctx.restore(); }
          // brain's interpretation bubble
          if (t < 8.5) { drawBrain(ctx, { x: 870, y: 1020, s: 0.5, mood: 0.2, open: 1.2, look: [-1, -0.6], mouth: "o", eyeGlow: 0.5, glow: 0.3 }, t); }
          else { drawBrain(ctx, { x: 870, y: 1020, s: 0.5, mood: 0.2, open: 0.6, look: [-1, -0.3], mouth: "smirk", glow: 0.3, tilt: 0.2 }, t); }
          ctx.restore();
          flash(ctx, t, 8.5, 0.2, PAL.cream, 0.7);
        }

        /* ===== D + E: the memory (9.0–17.44) ===== */
        if (t >= 9.0) {
          memoryPic(t);
          const k = E.out3(inv(9.0, 9.3, t));
          ctx.save(); ctx.translate(0, (1 - k) * 1920);
          HF.vgrad(ctx, [[0, "#22186A"], [1, "#0A0B2C"]]);
          HF.neurons(ctx, t, 402, [-60, 1150, 1200, 800], 0.7);
          const toTV = E.io3(inv(11.3, 11.9, t));
          const cam = { x: 0, y: 0, z: K(t, [[9.0, 1.06], [11.3, 1.0], [11.9, 1.0], [13.6, 1.04], [13.7, 1.12, "out3"], [17.4, 1.2]]), r: 0, sx: shx, sy: shy };
          HF.withCam(ctx, cam, 1, () => {
            const W = lerp(860, 760, toTV), H = W * 0.75, x0 = 540 - W / 2, y0 = lerp(380, 400, toTV);
            // CRT TV body grows around the picture (E)
            if (toTV > 0) {
              ctx.save(); ctx.globalAlpha = toTV;
              rrect(ctx, x0 - 70, y0 - 70, W + 140, H + 200, 60); ctx.fillStyle = "#3A2470"; ctx.fill(); ctx.lineWidth = 10; ctx.strokeStyle = PAL.ink; ctx.stroke();
              [[x0 + 60, y0 + H + 70], [x0 + 140, y0 + H + 70]].forEach(([x, y]) => circle(ctx, x, y, 22, PAL.lav, 6));
              text(ctx, "ВОСПОМИНАНИЕ_01", x0 + W - 150, y0 + H + 72, { size: 26, color: PAL.lilac, family: "BrainSans" });
              line(ctx, [[x0 + W * 0.3, y0 - 70], [x0 + W * 0.15, y0 - 200]], 9, PAL.ink, { seed: 91 }); line(ctx, [[x0 + W * 0.7, y0 - 70], [x0 + W * 0.85, y0 - 190]], 9, PAL.ink, { seed: 92 });
              ctx.restore();
            }
            // glitch amount (E)
            const gl = clamp(win(t, 13.6, 17.44, 0.15, 0.01) * (0.5 + 0.5 * Math.abs(Math.sin(t * 7))) + inv(15.4, 17.0, t));
            ctx.save(); rrect(ctx, x0, y0, W, H, toTV * 30 + 10); ctx.clip();
            if (gl > 0.02) {
              const R = rng(Math.floor(t * 20));
              const sl = 14;
              for (let i = 0; i < sl; i++) {
                const sy = (MH / sl) * i, dx = (R() < gl * 0.6 ? (R() - 0.5) * 160 * gl : 0);
                ctx.globalCompositeOperation = "source-over";
                ctx.drawImage(mem, 0, sy, MW, MH / sl, x0 + dx, y0 + (H / sl) * i, W, H / sl + 1);
              }
              // colour split
              ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = 0.35 * gl;
              ctx.drawImage(mem, x0 + 14 * gl, y0, W, H); ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
              // missing data blocks
              for (let i = 0; i < 9 * gl; i++) { ctx.fillStyle = R() > 0.5 ? "#0A0B2C" : rgba(PAL.violet, 0.8); ctx.fillRect(x0 + R() * W, y0 + R() * H, 40 + R() * 120, 20 + R() * 50); }
              // static near the end
              const stc = inv(15.6, 17.2, t);
              if (stc > 0) { for (let i = 0; i < 260 * stc; i++) { ctx.fillStyle = R() > 0.5 ? rgba(PAL.white, 0.7) : rgba("#000000", 0.6); ctx.fillRect(x0 + R() * W, y0 + R() * H, 6, 4); } }
            } else ctx.drawImage(mem, x0, y0, W, H);
            ctx.fillStyle = rgba("#000000", 0.08); for (let y = y0; y < y0 + H; y += 6) ctx.fillRect(x0, y, W, 2);
            // puzzle seams + holes (D)
            const pz = 1 - toTV;
            if (pz > 0) {
              ctx.globalAlpha = pz;
              ctx.strokeStyle = rgba(PAL.ink, 0.45); ctx.lineWidth = 4;
              for (let i = 1; i < 4; i++) { ctx.beginPath(); ctx.moveTo(x0 + (W / 4) * i, y0); ctx.lineTo(x0 + (W / 4) * i, y0 + H); ctx.moveTo(x0, y0 + (H / 4) * i); ctx.lineTo(x0 + W, y0 + (H / 4) * i); ctx.stroke(); }
              const holes = [[1, 1, 9.19, "?"], [2, 2, 9.7, "☺"], [3, 0, 10.23, "★"]];
              holes.forEach(([cx2, cy2, tf, glyph], i) => {
                const hx = x0 + (W / 4) * cx2, hy = y0 + (H / 4) * cy2, hw = W / 4, hh = H / 4;
                const fill = E.back(inv(tf, tf + 0.3, t));
                ctx.fillStyle = "#0A0B2C"; ctx.fillRect(hx, hy, hw, hh);
                if (fill > 0) {
                  ctx.save(); ctx.translate(hx + hw / 2 + (1 - fill) * 300, hy + hh / 2 - (1 - fill) * 400); ctx.rotate((1 - fill) * 0.8);
                  rrect(ctx, -hw / 2, -hh / 2, hw, hh, 6); ctx.fillStyle = PAL.yellow; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = PAL.ink; ctx.stroke();
                  text(ctx, glyph, 0, 4, { size: 70, color: PAL.ink, family: "BrainSans" });
                  ctx.restore();
                }
              });
              ctx.globalAlpha = 1;
            }
            ctx.restore();
            rrect(ctx, x0, y0, W, H, toTV * 30 + 10); ctx.lineWidth = 9; ctx.strokeStyle = PAL.ink; ctx.stroke();
            // brain hand placing pieces (D)
            if (t < 11.4) drawBrain(ctx, { x: 860, y: 1010, s: 0.55, mood: 0.15, open: 1, look: [-0.8, -1], mouth: "grin", mouthOpen: 0.5, armL: [2.4, 0.4], armLen: 90, glow: 0.4 }, t);
          });
          // labels
          text(ctx, "ДОРИСОВАНО", 540, 250, { size: 62, color: PAL.yellow, stroke: PAL.ink, sw: 14, alpha: win(t, 9.3, 11.3, 0.2, 0.2) });
          const ne = pop(t, 14.4, 0.35, "back2");
          if (ne > 0) {
            ctx.save(); ctx.translate(540 + shx, 1065); ctx.scale(ne, ne); ctx.rotate(-0.03);
            rrect(ctx, -330, -56, 660, 112, 32); ctx.fillStyle = PAL.yellow; ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = PAL.ink; ctx.stroke();
            text(ctx, "ПАМЯТЬ ≠ ВИДЕО", 0, 4, { size: 52, color: PAL.ink });
            ctx.restore();
          }
          text(ctx, "ПАМЯТЬ", 540, 250, { size: 62, color: PAL.cream, stroke: PAL.ink, sw: 14, track: 4, alpha: win(t, 11.9, 17.44, 0.2, 0.01) });
          ctx.restore();
        }

        HF.vignette(ctx, 0.55);
        const fi = 1 - inv(0, 0.3, t); if (fi > 0) { ctx.fillStyle = rgba(PAL.cream, fi); ctx.fillRect(0, 0, 1080, 1920); }
        flash(ctx, t, 13.66, 0.15, PAL.white, 0.4);
        // glitch-tear exit
        const ex = inv(17.0, 17.44, t);
        if (ex > 0) { const R = rng(Math.floor(t * 30)); for (let i = 0; i < 24; i++) { ctx.fillStyle = R() > 0.3 ? PAL.navy0 : PAL.yellow; ctx.fillRect(0, i * 80, 1080 * clamp(ex * 1.6 - R() * 0.6), 80); } }
      }

      const st = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(st, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(st.t) }, 0);
      window.__timelines["s4"] = tl;
      draw(0);
    })();
  </script>
</template>
