<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #070a1f; }
    #s3-c { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  </style>
  <div id="root" data-composition-id="s3" data-width="1080" data-height="1920">
    <canvas id="s3-c" width="1080" height="1920"></canvas>
  </div>
  <script>
    /* SCENE 3 — THE MEMORY TRAP (19.93–33.90 s, 13.97 s). Top-down view of Tim in bed.
       0–3.6   «Замечал, как неловкий момент пятилетней давности»  dozing; a flashback bubble rises (the wave that wasn't for him)
       3.6–7   «может всплыть в голове прямо перед сном?»           eyes snap open, blanket up to the nose, КРИНЖ
       7–11.7  «Мозг способен снова и снова возвращать тебя…»       brain with a remote: rewind, replay ×2 ×3 … ×99; the clock races
       11.7–14 hide under the blanket; dive into the bubble */
    (function () {
      const DUR = 13.97;
      const { K, S, E, PAL, pop, win, inv, clamp, lerp, text, glow, shake, rrect, circle, line, shape, ellipsePts, rgba, rng, flash } = HF;
      const { TIM, drawHuman, drawBrain, drawFace } = CHAR;
      const P = PROP;
      const c = document.getElementById("s3-c"), ctx = c.getContext("2d");
      const STRANGER = { name: "x", skin: "#D9C2F2", skinS: "#B79BDD", hair: "#3B2A6E", hairHi: "#5B47A0", top: "#58C9C0", topS: "#3FA59D", topD: "#2F857E", pants: "#2A2F6A", pantsS: "#1D2150", shoe: "#FFFDF6", sole: "#7B45D6", iris: "#24174F" };
      const PRESSES = [8.11, 8.75, 9.19, 9.55, 9.85, 10.12, 10.38, 10.62, 10.86];
      const COUNTS = [2, 3, 7, 12, 19, 28, 41, 64, 99];
      const CLOCK = [[0, "00:47"], [8.11, "01:15"], [8.75, "01:58"], [9.19, "02:26"], [9.85, "02:51"], [10.6, "03:07"]];

      function flashback(fb, t) {
        // a tiny memory: Tim waves back at someone who was waving to the person behind him
        const g = ctx.createLinearGradient(0, -170, 0, 170); g.addColorStop(0, "#F3E3FF"); g.addColorStop(1, "#FFE9C2");
        ctx.fillStyle = g; ctx.fillRect(-360, -200, 720, 400);
        ctx.fillStyle = rgba("#7B45D6", 0.18); ctx.fillRect(-360, 90, 720, 120);
        const wrong = fb > 1.35;
        // the friend far behind Tim (appears)
        const fa = inv(1.2, 1.45, fb);
        if (fa > 0) { ctx.save(); ctx.globalAlpha = fa; drawHuman(ctx, { st: STRANGER, x: -275, y: 150, s: 0.2, armR: [2.7 + Math.sin(fb * 12) * 0.25, 0.2], mouth: "grin", eyes: "happy", flip: -1 }, t); ctx.restore(); }
        drawHuman(ctx, { st: TIM, x: -105, y: 175, s: 0.3, armR: wrong ? [2.55, 0.35] : [2.6 + Math.sin(fb * 13) * 0.3, 0.3], mouth: wrong ? "cringe" : "grin", mouthOpen: 0.7, eyes: wrong ? "shut" : "happy", sweat: wrong ? 1 : 0, brow: wrong ? 1 : 0 }, t);
        drawHuman(ctx, { st: STRANGER, x: 200, y: 175, s: 0.3, flip: -1, armR: [2.6 + Math.sin(fb * 11 + 1) * 0.3, 0.3], mouth: "grin", mouthOpen: 0.6, eyes: "happy" }, t);
        if (wrong) {
          ctx.save(); ctx.setLineDash([14, 12]); ctx.lineDashOffset = -fb * 60; ctx.lineWidth = 7; ctx.strokeStyle = "#FF4F7B";
          const u = inv(1.35, 1.7, fb);
          ctx.beginPath(); ctx.moveTo(150, -70); ctx.quadraticCurveTo(-20, -190, lerp(150, -250, u), lerp(-70, -40, u)); ctx.stroke(); ctx.restore();
          const la = inv(1.6, 1.8, fb);
          text(ctx, "…это было не мне", 20, 128, { size: 28, color: PAL.ink, family: "BrainSans", alpha: la });
        }
        // VHS overlay
        ctx.fillStyle = rgba("#1A0E3A", 0.08); for (let y = -200; y < 200; y += 7) ctx.fillRect(-360, y, 720, 3);
        text(ctx, "▶ 5 ЛЕТ НАЗАД", -40, -132, { size: 26, color: "#E2348A", family: "BrainSans", align: "center" });
        if (Math.floor(t * 2) % 2) circle(ctx, -170, -132, 9, "#E2348A");
      }

      function draw(t) {
        HF.setBoil(t);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = "#070A1F"; ctx.fillRect(0, 0, 1080, 1920);
        const press = PRESSES.findIndex((p) => t >= p && t < p + 0.2);
        const [shx, shy] = shake(t, 20 * win(t, 3.92, 4.4, 0.02, 0.4) + 10 * win(t, 5.95, 6.4, 0.02, 0.3) + (press >= 0 ? 6 : 0), 28, 7);
        const dive = E.in3(inv(13.4, 13.97, t));
        const cam = {
          x: 0, y: K(t, [[0, -110], [3.9, -140], [4.05, -175, "out3"], [13.4, -200]]) + dive * -300,
          z: K(t, [[0, 1.12], [3.9, 1.02], [4.05, 1.14, "out3"], [7.0, 1.08], [11.7, 1.0], [13.4, 1.0]]) + dive * 2.4,
          r: K(t, [[0, -0.05], [13.4, 0.03]]), sx: shx, sy: shy,
        };

        ctx.fillStyle = "#0A0D2C"; ctx.fillRect(0, 0, 1080, 1920);
        HF.withCam(ctx, cam, 1, () => {
          // floor + rug
          HF.vgrad(ctx, [[0, "#121646"], [1, "#0A0C2A"]], -400, -400, 1880, 2800);
          ctx.save(); ctx.globalAlpha = 0.25; for (let i = -6; i < 16; i++) { ctx.fillStyle = i % 2 ? "#1B2160" : "#151A50"; ctx.fillRect(-400, i * 160, 1880, 80); } ctx.restore();
          // bed
          rrect(ctx, 150, 470, 780, 1700, 50); ctx.fillStyle = "#5B3A9E"; ctx.fill(); ctx.lineWidth = 9; ctx.strokeStyle = PAL.ink; ctx.stroke();
          rrect(ctx, 175, 520, 730, 1640, 40); ctx.fillStyle = "#E3D3FF"; ctx.fill(); ctx.lineWidth = 6; ctx.stroke();
          // pillow
          shape(ctx, [[270, 580], [540, 560], [810, 580], [830, 720], [810, 880], [540, 900], [270, 880], [250, 720]], { fill: PAL.cream, shade: ["#E9DCC0", 14, 16], seed: 61, tension: 0.9 });

          // Tim, lying under the blanket
          const awake = t > 3.92;
          const peek = E.out3(inv(5.55, 5.95, t));
          const hide = E.io3(inv(11.65, 12.3, t));
          const doze = K(t, [[0, 0.55], [0.6, 0.62], [1.2, 0.95], [3.9, 0.95]]);
          drawFace(ctx, {
            st: TIM, x: 540, y: 735, s: 0.98, headTilt: K(t, [[0, -0.12], [3.9, -0.08], [4.05, 0.02]]),
            lid: awake ? K(t, [[5.5, 0], [5.9, 0.12]]) : doze, eyeOpen: awake ? K(t, [[3.92, 1.0], [4.02, 1.35, "out3"], [5.6, 1.15]]) : 1,
            pupil: awake ? K(t, [[3.92, 0.5], [7.0, 0.6], [8.1, 0.45]]) : 1,
            look: awake ? K(t, [[3.92, [0, 0]], [7.1, [0, 0]], [7.4, [-0.9, 0.1], "out3"], [9.0, [-0.9, 0.1]], [9.3, [0, -1]]]) : [0, 0],
            browL: awake ? 1 : 0, browR: awake ? 1 : 0, brow: awake ? 1 : 0.2,
            mouth: awake ? "cringe" : "smile", mouthOpen: 0.4, smile: 0.5, sweat: awake ? K(t, [[3.95, 0], [4.3, 1]]) : 0, blush: awake ? 0.45 : 0.3,
          }, t);
          // blanket (rises to the nose, then over the head)
          const top = lerp(lerp(905, 805, peek), 560, hide);
          ctx.save();
          shape(ctx, [[160, top], [540, top - 20 + Math.sin(t * 2) * 4], [920, top], [930, 2200], [150, 2200]], { fill: "#2C2F86", shade: ["#22256E", 30, 0], seed: 62, tension: 0.6 });
          ctx.beginPath(); ctx.rect(150, top - 30, 790, 2300); ctx.clip();
          const R = rng(9); for (let i = 0; i < 26; i++) P.star4(ctx, 190 + R() * 700, top + 70 + R() * 1200, 16 + R() * 14, rgba(PAL.yellow, 0.75));
          ctx.restore();
          shape(ctx, [[150, top - 6], [540, top - 30 + Math.sin(t * 2) * 4], [930, top - 6], [930, top + 60], [540, top + 40], [150, top + 60]], { fill: PAL.lav, seed: 63, tension: 0.7 });
          // hands gripping the blanket edge
          [-1, 1].forEach((s2) => shape(ctx, ellipsePts(540 + s2 * 120, top + 18, 34, 28, 12), { fill: TIM.skin, lw: 6, seed: 64 + s2 }));
          // brain peeking up beside the pillow with a remote
          const bp = E.back(inv(6.95, 7.35, t));
          if (bp > 0) {
            const giggle = t > 11.6 ? Math.abs(Math.sin(t * 14)) * 0.06 : 0;
            const pr = press >= 0 ? 1 : 0;
            drawBrain(ctx, {
              x: 185, y: lerp(980, 700, bp), s: 0.62, mood: 0.12, look: K(t, [[7, [0.8, 0.3]], [8.0, [0.9, -0.6]]]),
              open: 1, mouth: t > 11.6 ? "grin" : S(t, [[0, "smirk"], [8.1, "grin"]]), mouthOpen: 0.5 + giggle * 6, squash: giggle,
              armL: [0.4, 0.8], armR: [lerp(1.3, 1.55, pr), 1.0], armLen: 85, glow: 0.5, tilt: 0.12,
            }, t);
            // remote in the brain's right hand
            ctx.save(); ctx.translate(185 + 0.62 * 175, lerp(980, 700, bp) + 0.62 * 30); ctx.rotate(-0.4);
            rrect(ctx, -26, -70, 52, 130, 16); ctx.fillStyle = "#1C1B3A"; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = PAL.ink; ctx.stroke();
            circle(ctx, 0, -40, 13, pr ? PAL.yellow : "#FF4F7B", 4);
            [[-12, -6], [12, -6], [-12, 18], [12, 18]].forEach(([x, y]) => circle(ctx, x, y, 6, PAL.lav));
            ctx.restore();
          }

          // moonlight
          ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = 0.12;
          ctx.beginPath(); ctx.moveTo(1150, 200); ctx.lineTo(1250, 420); ctx.lineTo(300, 1500); ctx.lineTo(-100, 1300); ctx.closePath(); ctx.fillStyle = PAL.lav; ctx.fill(); ctx.restore();
        });

        // bedside clock, glowing in the corner
        {
          const clk = S(t, CLOCK), cf = PRESSES.some((p) => t >= p && t < p + 0.12);
          ctx.save(); ctx.translate(905 + shx * 0.3, 668 + shy * 0.3); ctx.rotate(0.05);
          rrect(ctx, -125, -62, 250, 124, 26); ctx.fillStyle = "#3A2470"; ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = PAL.ink; ctx.stroke();
          rrect(ctx, -104, -44, 208, 88, 16); ctx.fillStyle = "#0A0820"; ctx.fill(); ctx.stroke();
          text(ctx, clk, 0, 4, { size: 50, color: cf ? PAL.white : PAL.yellow, family: "BrainDisplay", shadow: "rgba(255,201,60,0.9)", blur: 24 });
          ctx.restore();
        }
        // the memory bubble (screen space, floats above)
        const ba = E.back(inv(1.05, 1.5, t));
        if (ba > 0) {
          const big = lerp(1, 1.08, E.out3(inv(3.92, 4.2, t)));
          const bx = 540 + Math.sin(t * 1.1) * 10 + shx * 0.5, by = 385 + Math.cos(t * 1.3) * 8 + shy * 0.5;
          ctx.save(); ctx.translate(bx, by); ctx.scale(ba * big * (1 + dive * 2), ba * big * (1 + dive * 2));
          P.thought(ctx, 780, 420, -250, 300, PAL.lilac, 3);
          ctx.save(); ctx.beginPath(); ctx.ellipse(0, 0, 340, 178, 0, 0, Math.PI * 2); ctx.clip();
          // flashback clock: restarts on every press, rewinds for a moment first
          const starts = [1.15].concat(PRESSES.filter((p) => t >= p));
          const s0 = starts[starts.length - 1], since = t - s0;
          const rewinding = s0 !== 1.15 && since < 0.22;
          const fb = rewinding ? 1.9 * (1 - since / 0.22) : since * (t > 9.0 ? 2.2 : 1);
          flashback(fb, t);
          if (rewinding) {
            ctx.fillStyle = rgba(PAL.white, 0.25); const R = rng(Math.floor(t * 30));
            for (let i = 0; i < 9; i++) ctx.fillRect(-360, -200 + R() * 400, 720, 4 + R() * 10);
            text(ctx, "◀◀", 0, 0, { size: 120, color: PAL.white, stroke: PAL.ink, sw: 10, alpha: 0.85 });
          }
          ctx.restore();
          ctx.lineWidth = 8; ctx.strokeStyle = PAL.ink; ctx.beginPath(); ctx.ellipse(0, 0, 340, 178, 0, 0, Math.PI * 2); ctx.stroke();
          ctx.restore();
        }

        // replay counter
        const ci = PRESSES.filter((p) => t >= p).length - 1;
        if (ci >= 0) {
          const k = pop(t, PRESSES[ci], 0.18, "back2");
          ctx.save(); ctx.translate(880, 1060); ctx.rotate(-0.08); ctx.scale(0.8 + 0.2 * k, 0.8 + 0.2 * k);
          rrect(ctx, -150, -52, 300, 104, 30); ctx.fillStyle = "#FF4F7B"; ctx.fill(); ctx.lineWidth = 7; ctx.strokeStyle = PAL.ink; ctx.stroke();
          text(ctx, "ПОВТОР ×" + COUNTS[ci], 0, 4, { size: 36, color: PAL.white, family: "BrainDisplay" });
          ctx.restore();
        }
        // КРИНЖ burst
        const kr = pop(t, 5.9, 0.3, "back2") * (1 - inv(7.0, 7.25, t));
        if (kr > 0) {
          ctx.save(); ctx.translate(805 + shx, 860 + shy); ctx.rotate(-0.12); ctx.scale(kr * 0.8, kr * 0.8);
          P.burst(ctx, 170, PAL.yellow, 13, 4);
          text(ctx, "КРИНЖ!", 0, 4, { size: 58, color: PAL.ink });
          ctx.restore();
        }
        // swarm of tiny repeat bubbles on «воспоминаниям»
        const sw = inv(10.7, 11.2, t) * (1 - inv(12.6, 13.0, t));
        if (sw > 0) {
          const R = rng(31);
          for (let i = 0; i < 12; i++) {
            const a = R() * 6.28, r = 260 + R() * 260, x = 540 + Math.cos(a + t * 0.6) * r, y = 820 + Math.sin(a + t * 0.6) * r * 0.9;
            ctx.save(); ctx.globalAlpha = sw; ctx.translate(x, y); ctx.scale(0.18 * sw, 0.18 * sw); P.thought(ctx, 600, 340, 0, 260, PAL.lilac, 20 + i);
            text(ctx, "◀◀", 0, 0, { size: 140, color: PAL.violet }); ctx.restore();
          }
        }
        HF.vignette(ctx, 0.62);
        // enter from black (lights out from the previous scene)
        const fi = 1 - inv(0, 0.45, t); if (fi > 0) { ctx.fillStyle = rgba(PAL.navy0, fi); ctx.fillRect(0, 0, 1080, 1920); }
        flash(ctx, t, 3.92, 0.2, PAL.lilac, 0.45);
        const wo = inv(13.7, 13.97, t); if (wo > 0) { ctx.fillStyle = rgba(PAL.cream, E.in(wo)); ctx.fillRect(0, 0, 1080, 1920); }
      }

      const st = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(st, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(HF.warp("s3", st.t)) }, 0);
      window.__timelines["s3"] = tl;
      draw(0);
    })();
  </script>
</template>
