<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #070a1f; }
    #s6-c { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  </style>
  <div id="root" data-composition-id="s6" data-width="1080" data-height="1920">
    <canvas id="s6-c" width="1080" height="1920"></canvas>
  </div>
  <script>
    /* SCENE 6 — THE FINAL MESSAGE (65.82–90.00 s, 24.18 s). Dawn on a hilltop.
       0–4.2    «Так что в следующий раз, когда твой мозг скажет:»  Tim walks up; the brain rises behind him
       4.2–6.1  «"Я точно всё помню",»                              the brain's speech bubble, word by word
       6.1–8.9  «не спеши ему верить.»                              arms crossed, eyebrow up; ПРОВЕРЬ! — the bubble shatters
       8.9–12.5 «Иногда самый хитрый обманщик —»                    crane up to the sky: a WANTED poster slams around the brain
       12.5–16.5 «это тот, кто живёт у тебя в голове.»              poof: the brain shrinks into a friendly pink sidekick
       16.5–18.7 «А ты замечал за собой такое?»                     Tim and the brain turn to the viewer
       18.7–24.2 end card: comment prompt, title, high five */
    (function () {
      const DUR = 24.18;
      const { K, S, E, PAL, pop, win, inv, clamp, lerp, text, glow, shake, rrect, circle, line, shape, ellipsePts, rgba, rng, flash } = HF;
      const { TIM, drawHuman, drawBrain } = CHAR;
      const P = PROP;
      const c = document.getElementById("s6-c"), ctx = c.getContext("2d");
      const TS = 0.85, TY = 1476, HEADY = TY - 640 * TS;
      const WORDS = [[4.34, "«Я"], [4.53, "ТОЧНО"], [5.05, "ВСЁ"], [5.37, "ПОМНЮ»"]];

      function sky(t, dawn) {
        const g = ctx.createLinearGradient(0, 0, 0, 1920);
        g.addColorStop(0, HF.mix("#070A1F", "#2A2272", dawn)); g.addColorStop(0.45, HF.mix("#1A1650", "#7B45D6", dawn));
        g.addColorStop(0.72, HF.mix("#2A1F6A", "#FF9D5C", dawn)); g.addColorStop(1, HF.mix("#2A1F6A", "#FFC93C", dawn));
        ctx.fillStyle = g; ctx.fillRect(0, 0, 1080, 1920);
        ctx.save(); ctx.globalAlpha = 1 - dawn * 0.7; HF.stars(ctx, t, 61, 70, [0, 0, 1080, 900], { a: 0.8 }); ctx.restore();
      }

      function draw(t) {
        HF.setBoil(t);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = "#070A1F"; ctx.fillRect(0, 0, 1080, 1920);
        const dawn = K(t, [[0, 0.25], [8.9, 0.6], [12.5, 0.55], [16.5, 0.9], [20, 1]]);
        const [shx, shy] = shake(t, 14 * win(t, 6.41, 6.7, 0.02, 0.25) + 10 * win(t, 7.61, 7.9, 0.02, 0.25) + 18 * win(t, 10.59, 10.95, 0.02, 0.3), 30, 17);
        const crane = K(t, [[8.9, 0], [9.6, -960, "io3"], [12.5, -960], [13.2, 0, "io3"]]);
        const cam = {
          x: 0, y: K(t, [[0, 240], [2.6, 0, "io3"]]) + crane,
          z: K(t, [[0, 1.0], [6.0, 1.03], [6.3, 1.08, "out3"], [8.9, 1.06], [16.5, 1.02], [18.6, 1.1], [24.2, 1.04]]),
          r: 0, sx: shx, sy: shy,
        };
        sky(t, dawn);
        // sun behind the hill + rotating rays (far layer)
        HF.withCam(ctx, cam, 0.3, () => {
          const sy = K(t, [[0, 1500], [20, 1230]]);
          ctx.save(); ctx.translate(540, sy); ctx.rotate(t * 0.12); ctx.globalAlpha = 0.18 + dawn * 0.2;
          for (let i = 0; i < 16; i++) { ctx.rotate(Math.PI / 8); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-90, -1500); ctx.lineTo(90, -1500); ctx.closePath(); ctx.fillStyle = i % 2 ? PAL.cream : PAL.yellow; ctx.fill(); }
          ctx.restore();
          glow(ctx, 540, sy, 520, PAL.yellow, 0.8); circle(ctx, 540, sy, 190, "#FFD86B", 0);
        });
        // far city
        HF.withCam(ctx, cam, 0.55, () => {
          const R = rng(66); ctx.fillStyle = HF.mix("#1B1650", "#5A3A9E", dawn);
          for (let i = 0; i < 12; i++) { const w = 70 + R() * 70, h = 120 + R() * 220; ctx.fillRect(i * 95 - 40, 1420 - h, w, h + 300); }
        });
        HF.withCam(ctx, cam, 1, () => {
          // the hill
          ctx.beginPath(); ctx.moveTo(-300, 1700); ctx.quadraticCurveTo(540, 1260, 1380, 1700); ctx.lineTo(1380, 2600); ctx.lineTo(-300, 2600); ctx.closePath();
          ctx.fillStyle = HF.mix("#140F40", "#3A2272", dawn); ctx.fill(); ctx.lineWidth = 9; ctx.strokeStyle = PAL.ink; ctx.stroke();
          ctx.save(); ctx.clip(); glow(ctx, 540, 1460, 600, PAL.yellow, 0.25 * dawn); ctx.restore();
          // grass tufts
          const R = rng(67); for (let i = 0; i < 14; i++) { const x = 60 + i * 72, y = 1480 + 220 * Math.pow((x - 540) / 840, 2) - 2; line(ctx, [[x, y + 6], [x + 4 + Math.sin(t * 2 + i) * 6, y - 22]], 5, rgba(PAL.lav, 0.6), { seed: 300 + i }); }

          // Brain: big and sinister → wanted → shrinks into a friendly sidekick
          const rise = E.out3(inv(2.6, 3.3, t));
          const poofT = 13.76;
          const small = t >= poofT;
          if (rise > 0) {
            let bx, by, bs, mood;
            if (!small) {
              bx = K(t, [[2.6, 760], [8.9, 760], [9.6, 540, "io3"], [12.5, 540], [13.2, 760, "io3"]]);
              by = K(t, [[2.6, 1200], [3.3, 520, "out3"], [8.9, 500], [9.6, -220, "io3"], [12.5, -220], [13.2, 520, "io3"]]);
              bs = K(t, [[2.6, 0.9], [4.2, 1.0], [5.6, 1.12, "back"], [7.6, 0.9], [8.9, 1.0], [10.59, 1.0], [10.8, 1.25, "back"], [13.2, 1.1]]);
              mood = 0;
            } else {
              const f = E.out3(inv(poofT, 15.04, t));
              bx = lerp(760, 790, f); by = lerp(520, HEADY - 60, f); bs = lerp(0.6, 0.42, f); mood = 1;
              if (t > 18.7) { bx = K(t, [[18.7, 790], [20.2, 720, "io3"]]); by = K(t, [[18.7, HEADY - 60], [20.2, HEADY - 210, "io3"]]); }
            }
            const talk = WORDS.some(([w]) => t >= w && t < w + 0.18);
            const wave = t > 15.0 ? Math.sin(t * 9) * 0.35 : 0;
            drawBrain(ctx, {
              x: bx, y: by, s: bs, mood,
              look: small ? (t > 16.6 ? [0, 0.2] : [-1, 0.3]) : t < 6.2 ? [-0.6, 0.6] : t < 8.9 ? [-1, 0.8] : [0, 0.4],
              open: small ? 1 : t > 6.4 && t < 8.9 ? 1.25 : 1, mouth: small ? "smile" : t >= 4.2 && t < 6.0 ? "talk" : t < 6.2 ? "smirk" : t < 8.9 ? "o" : "grin",
              mouthOpen: talk ? 0.9 : small ? 0.6 : 0.4, glow: small ? 0.6 : 0.7,
              armL: small ? [0.5, 0.8] : t >= 4.2 && t < 6.2 ? [0.3, 2.2] : [0.4, 0.9],
              armR: small ? (t > 15 ? [2.6 + wave, 0.3] : [0.5, 0.8]) : t >= 4.2 && t < 6.2 ? [0.3, 2.2] : [0.4, 0.9], armLen: small ? 80 : 95,
              squash: t >= 4.2 && t < 6.0 ? (talk ? 0.04 : 0) : 0, tilt: small ? Math.sin(t * 2) * 0.08 : -0.05,
            }, t);
            // WANTED poster around the brain
            const wp = E.back2(inv(10.5, 10.8, t)) * (1 - E.in3(inv(12.4, 12.8, t)));
            if (wp > 0 && !small) {
              ctx.save(); ctx.translate(540, -250); ctx.rotate(lerp(0.4, -0.04, wp)); ctx.scale(lerp(1.8, 0.86, wp), lerp(1.8, 0.86, wp)); ctx.globalAlpha = Math.min(1, wp * 2);
              ctx.beginPath(); ctx.rect(-330, -430, 660, 860); ctx.rect(-230, -260, 460, 400); ctx.fillStyle = "#F3E2BF"; ctx.fill("evenodd");
              ctx.lineWidth = 10; ctx.strokeStyle = PAL.ink; ctx.strokeRect(-330, -430, 660, 860); ctx.strokeRect(-230, -260, 460, 400);
              text(ctx, "РАЗЫСКИВАЕТСЯ", 0, -345, { size: 50, color: "#5A1E2E" });
              text(ctx, "ХИТРЫЙ", 0, 225, { size: 58, color: "#C2253F" });
              text(ctx, "ОБМАНЩИК", 0, 300, { size: 58, color: "#C2253F" });
              text(ctx, "живёт в голове", 0, 372, { size: 30, color: "#5A1E2E", family: "BrainSans" });
              [[-300, -400], [300, -400], [-300, 400], [300, 400]].forEach(([x, y]) => circle(ctx, x, y, 12, "#C2253F", 4));
              ctx.restore();
            }
          }

          // Tim
          const arrive = t < 2.4;
          const crossed = t > 6.3 && t < 8.9;
          const tap = t > 12.9 && t < 16.4;
          const open = t > 16.6 && t < 19.8;
          const hi5 = t > 20.2;
          const tim = {
            st: TIM, x: K(t, [[0, 330], [2.4, 540, "out"]]), y: TY, s: TS, legs: arrive ? "walk" : "stand", phase: t * 7,
            turn: arrive ? 0.3 : t < 6.2 ? 0.25 : t < 8.9 ? 0.35 : open || hi5 ? 0 : 0.2,
            look: arrive ? [0.6, 0] : t < 6.2 ? [0.7, -0.6] : crossed ? [0.8, -0.7] : tap ? [0.9, -0.3] : hi5 ? [0.6, -0.8] : [0, 0],
            lid: crossed ? 0.35 : 0, browR: crossed ? 0.9 : 0.3, browL: crossed ? -0.4 : 0.3, brow: t > 3.0 && t < 6.2 ? 0.4 : 0,
            mouth: arrive ? "smile" : t < 6.2 ? "flat" : crossed ? "smirk" : tap ? "smirk" : hi5 ? "grin" : "smile", mouthOpen: 0.6, smile: 1,
            eyes: hi5 && t > 20.5 && t < 21.5 ? "happy" : "normal",
            headTilt: crossed ? -0.08 : tap ? 0.06 : open ? Math.sin(t * 1.5) * 0.03 : 0,
            armL: crossed ? [0.6, -2.4] : open ? K(t, [[16.6, [0.12, -0.2]], [17.0, [1.0, -1.0], "back"]]) : [0.15, -0.2],
            armR: crossed ? [0.6, -2.4] : tap ? K(t, [[12.9, [0.15, -0.2]], [13.4, [2.3, 1.3], "back"]]) : hi5 ? K(t, [[20.2, [0.15, -0.2]], [20.5, [2.6, 0.2], "back"]]) : [0.15, -0.2],
            squash: K(t, [[2.3, 0], [2.4, 0.05], [2.6, 0]]) + (hi5 ? K(t, [[20.45, 0], [20.55, 0.05], [20.8, 0]]) : 0),
          };
          drawHuman(ctx, tim, t);
          P.poof(ctx, 760, 520, inv(13.6, 14.4, t), 300);
          if (hi5) { const hk = inv(20.5, 21.1, t); if (hk > 0 && hk < 1) { ctx.save(); ctx.globalAlpha = 1 - hk; for (let i = 0; i < 8; i++) { const a = (i / 8) * 6.28; P.star4(ctx, 760 + Math.cos(a) * 140 * hk, HEADY - 280 + Math.sin(a) * 140 * hk, 26, PAL.yellow); } ctx.restore(); } }
        });

        // «Я точно всё помню» speech bubble (screen space), cracks, shatters
        const bb = E.back(inv(4.15, 4.45, t));
        const shat = inv(7.61, 8.3, t);
        if (bb > 0 && shat < 1) {
          ctx.save(); ctx.translate(530 + shx, 300 + shy); ctx.scale(bb, bb); ctx.rotate(-0.03);
          if (shat > 0) {
            const R = rng(4);
            for (let i = 0; i < 8; i++) {
              ctx.save(); const px = (i % 4 - 1.5) * 190, py = (Math.floor(i / 4) - 0.5) * 110;
              ctx.translate(px + (R() - 0.5) * 300 * shat, py + 900 * shat * shat * (0.6 + R())); ctx.rotate((R() - 0.5) * 3 * shat);
              ctx.globalAlpha = 1 - shat; rrect(ctx, -95, -55, 190, 110, 16); ctx.fillStyle = PAL.white; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = PAL.ink; ctx.stroke(); ctx.restore();
            }
          } else {
            P.bubble(ctx, 900, 200, 260, 200, { fill: PAL.white });
            ctx.font = "900 54px BrainDisplay";
            const total = WORDS.reduce((a, [, wd]) => a + ctx.measureText(wd).width + 20, -20);
            let x = -total / 2;
            WORDS.forEach(([w0, wd]) => {
              const k = pop(t, w0 - 0.04, 0.2, "back2"); ctx.font = "900 54px BrainDisplay"; const ww = ctx.measureText(wd).width;
              if (k > 0) { ctx.save(); ctx.translate(x + ww / 2, 0); ctx.scale(k, k); text(ctx, wd, 0, 4, { size: 54, color: PAL.violet }); ctx.restore(); }
              x += ww + 20;
            });
            // cracks
            const cr = inv(6.41, 6.6, t);
            if (cr > 0) {
              ctx.lineWidth = 7; ctx.strokeStyle = PAL.ink;
              [[[-120, -110], [-80, -40], [-120, 10], [-60, 110]], [[160, -110], [120, -30], [180, 30], [140, 110]]].forEach((pts) => {
                ctx.beginPath(); pts.slice(0, 1 + Math.ceil(cr * (pts.length - 1))).forEach(([x2, y2], i) => (i ? ctx.lineTo(x2, y2) : ctx.moveTo(x2, y2))); ctx.stroke();
              });
            }
          }
          ctx.restore();
        }
        // ПРОВЕРЬ! stamp
        const pv = pop(t, 6.41, 0.3, "back2") * (1 - inv(8.7, 9.0, t));
        if (pv > 0) {
          ctx.save(); ctx.translate(560, 540); ctx.rotate(-0.14); ctx.scale(lerp(2.4, 1, pv), lerp(2.4, 1, pv)); ctx.globalAlpha = Math.min(1, pv * 2);
          rrect(ctx, -250, -66, 500, 132, 26); ctx.lineWidth = 12; ctx.strokeStyle = PAL.yellow; ctx.stroke();
          text(ctx, "ПРОВЕРЬ!", 0, 6, { size: 82, color: PAL.yellow, stroke: PAL.ink, sw: 14 });
          ctx.restore();
        }

        // end card: comment prompt + title
        const cta = E.back(inv(18.6, 19.0, t));
        if (cta > 0) {
          ctx.save(); ctx.translate(540, 520); ctx.scale(cta, cta); ctx.rotate(Math.sin(t * 2) * 0.02);
          rrect(ctx, -380, -62, 760, 124, 62); ctx.fillStyle = PAL.cream; ctx.fill(); ctx.lineWidth = 8; ctx.strokeStyle = PAL.ink; ctx.stroke();
          // comment icon
          ctx.save(); ctx.translate(-300, 0); P.bubble(ctx, 76, 58, -20, 40, { fill: PAL.yellow, r: 18 }); [-16, 0, 16].forEach((x) => circle(ctx, x, -2, 5, PAL.ink)); ctx.restore();
          text(ctx, "ПИШИ В КОММЕНТАРИЯХ", 40, 4, { size: 36, color: PAL.ink, family: "BrainSans" });
          ctx.restore();
          const ar = Math.sin(t * 6) * 10;
          ctx.save(); ctx.globalAlpha = cta; line(ctx, [[540, 600 + ar], [540, 660 + ar]], 10, PAL.yellow, { boil: 0 }); line(ctx, [[515, 640 + ar], [540, 668 + ar], [565, 640 + ar]], 10, PAL.yellow, { boil: 0, tension: 0 }); ctx.restore();
        }
        const ti = E.back(inv(19.3, 19.75, t));
        if (ti > 0) {
          ctx.save(); ctx.translate(540, 300); ctx.scale(ti, ti); ctx.rotate(-0.035);
          text(ctx, "ТВОЙ МОЗГ", 0, -58, { size: 100, color: PAL.cream, stroke: PAL.ink, sw: 18 });
          text(ctx, "ТЕБЕ ВРЁТ", 0, 56, { size: 112, color: PAL.yellow, stroke: PAL.ink, sw: 20, shadow: "rgba(255,201,60,0.6)", blur: 40 });
          ctx.restore();
        }
        HF.motes(ctx, t, 68, 40, [0, 0, 1080, 1920], PAL.cream, 0.45 * dawn);
        HF.vignette(ctx, 0.45);
        // spotlight dim for the villain beat
        const dim = win(t, 9.0, 12.6, 0.4, 0.4);
        if (dim > 0) { const g = ctx.createRadialGradient(540, 740, 200, 540, 760, 900); g.addColorStop(0, rgba("#000000", 0)); g.addColorStop(1, rgba("#000000", 0.55 * dim)); ctx.fillStyle = g; ctx.fillRect(0, 0, 1080, 1920); }
        flash(ctx, t, 13.62, 0.35, PAL.cream, 0.8);
        HF.wipe(ctx, t, -0.48, 0.96, PAL.yellow, 1);
      }

      const st = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(st, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(HF.warp("s6", st.t)) }, 0);
      window.__timelines["s6"] = tl;
      draw(0);
    })();
  </script>
</template>
