<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #070a1f; }
    #s5-c { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  </style>
  <div id="root" data-composition-id="s5" data-width="1080" data-height="1920">
    <canvas id="s5-c" width="1080" height="1920"></canvas>
  </div>
  <script>
    /* SCENE 5 — THE SURPRISE (51.34–65.82 s, 14.48 s)
       A 0–3.3   «Два человека могут пережить одно и то же событие,»  a party; the cake falls (ПЛЮХ!), freeze
       B 3.3–6.9 «но запомнить его совершенно по-разному.»            the frame splits: Tim's memory (rain, ПОЗОР) vs Anya's (confetti, УМОРА)
       C 6.9–12.8 «…влияют эмоции, ожидания и предыдущий опыт.»       tinted glasses, then three lens chips light up on their words
       D 12.8–14.5 they look at each other: ?   ? — yellow wipe out */
    (function () {
      const DUR = 14.48;
      const { K, S, E, PAL, pop, win, inv, clamp, lerp, text, glow, shake, rrect, circle, line, shape, ellipsePts, rgba, rng, flash } = HF;
      const { TIM, ANYA, drawHuman } = CHAR;
      const P = PROP;
      const c = document.getElementById("s5-c"), ctx = c.getContext("2d");
      const TX = 270, AX = 810, GY = 1530, SC = 0.78;

      function cake(t) {
        const fall = E.in(inv(2.45, 2.78, t));
        const wob = t > 1.9 && t < 2.45 ? Math.sin(t * 30) * 0.06 * inv(1.9, 2.4, t) : 0;
        if (fall < 1) {
          ctx.save(); ctx.translate(540 + fall * 40, 1110 + fall * 260); ctx.rotate(wob + fall * 1.4);
          [[0, -40, 210, 70, "#FF8FBF"], [0, -100, 170, 60, PAL.cream], [0, -150, 120, 50, "#FF8FBF"]].forEach(([x, y, w, h, col], i) => {
            rrect(ctx, x - w / 2, y - h / 2, w, h, 16); ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = PAL.ink; ctx.stroke();
            ctx.fillStyle = PAL.white; for (let k = -w / 2 + 14; k < w / 2 - 10; k += 28) { ctx.beginPath(); ctx.arc(x + k, y - h / 2 + 4, 10, 0, Math.PI); ctx.fill(); }
          });
          [-30, 0, 30].forEach((x, i) => { rrect(ctx, x - 6, -220, 12, 46, 4); ctx.fillStyle = PAL.lav; ctx.fill(); ctx.lineWidth = 4; ctx.stroke(); glow(ctx, x, -232, 26, PAL.yellow, 0.9); shape(ctx, ellipsePts(x, -234, 7, 12, 8), { fill: PAL.yellow, lw: 3, seed: 50 + i }); });
          ctx.restore();
        } else {
          // splat
          const sp = E.out3(inv(2.78, 3.0, t));
          ctx.save(); ctx.translate(560, 1400);
          shape(ctx, ellipsePts(0, 0, 250 * sp, 70 * sp, 18, (a) => 1 + 0.18 * Math.sin(a * 7)), { fill: "#FF8FBF", lw: 7, seed: 55 });
          shape(ctx, ellipsePts(-30, -12, 140 * sp, 36 * sp, 14, (a) => 1 + 0.2 * Math.sin(a * 5)), { fill: PAL.cream, lw: 5, seed: 56 });
          const R = rng(8); for (let i = 0; i < 10; i++) circle(ctx, (R() - 0.5) * 600 * sp, -R() * 260 * sp, 10 + R() * 14, i % 2 ? PAL.cream : "#FF8FBF", 4);
          ctx.restore();
        }
      }
      function table() {
        rrect(ctx, 330, 1110, 420, 34, 14); ctx.fillStyle = "#8A5A3B"; ctx.fill(); ctx.lineWidth = 7; ctx.strokeStyle = PAL.ink; ctx.stroke();
        [[360, 1140], [700, 1140]].forEach(([x, y]) => { ctx.fillStyle = "#6E4429"; ctx.fillRect(x, y, 20, 330); ctx.strokeRect(x, y, 20, 330); });
      }
      function bunting(t) {
        ctx.lineWidth = 4; ctx.strokeStyle = PAL.lilac; ctx.beginPath(); ctx.moveTo(-40, 330); ctx.quadraticCurveTo(540, 470, 1120, 330); ctx.stroke();
        for (let i = 0; i < 11; i++) {
          const k = i / 10, x = lerp(-40, 1120, k), y = 330 + 4 * k * (1 - k) * 140 * 0.5 * 2;
          ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(t * 2 + i) * 0.08);
          ctx.beginPath(); ctx.moveTo(-30, 0); ctx.lineTo(30, 0); ctx.lineTo(0, 60); ctx.closePath(); ctx.fillStyle = [PAL.yellow, PAL.violet, "#FF8FBF", PAL.teal][i % 4]; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = PAL.ink; ctx.stroke(); ctx.restore();
        }
      }
      function party(t, side) {
        HF.vgrad(ctx, [[0, "#3A2A8E"], [0.7, "#5A3AAE"], [0.71, "#2A1F6A"], [1, "#160F40"]], -100, 0, 1280, 1920);
        bunting(t);
        [[150, 640, PAL.yellow], [930, 600, "#FF8FBF"], [880, 760, PAL.teal]].forEach(([x, y, col], i) => {
          line(ctx, [[x, y + 70], [x + 10, y + 260]], 3, PAL.cream, { seed: 60 + i });
          shape(ctx, ellipsePts(x + Math.sin(t * 1.5 + i) * 8, y, 52, 64, 14), { fill: col, lw: 6, seed: 63 + i });
        });
        table(); cake(t);
      }

      function tim(t, mood) {
        const shocked = t > 2.72 && t < 3.6;
        const h = drawHuman(ctx, {
          st: TIM, x: TX, y: GY, s: SC, turn: K(t, [[0, 0.25], [12.8, 0.25], [13.1, 0.55]]),
          look: t < 2.6 ? [0.7, 0.4] : t < 12.8 ? K(t, [[2.6, [0.6, 0.6]], [3.6, [0.3, 0.2]]]) : [1, 0],
          mouth: shocked ? "o" : t < 2.6 ? "smile" : mood > 0.5 ? "cringe" : "o", mouthOpen: 0.9, eyeOpen: shocked ? 1.3 : 1, pupil: shocked ? 0.6 : 1,
          eyes: t > 3.6 && t < 12.8 && mood > 0.5 ? "shut" : "normal",
          brow: t > 2.7 ? 1 : 0, browL: shocked ? 1 : 0.3, browR: shocked ? 1 : 0.3, sweat: t > 3.5 ? 1 : 0, blush: t > 3.5 ? 0.7 : 0.25,
          armR: t < 2.6 ? [0.3, -0.5] : K(t, [[2.6, [0.3, -0.5]], [2.8, [0.6, -2.5], "back"], [3.6, [0.6, -2.5]], [3.9, [0.25, -2.8]]]),
          armL: t < 2.6 ? [0.12, -0.2] : K(t, [[2.6, [0.12, -0.2]], [2.8, [0.6, -2.4], "back"], [3.6, [0.6, -2.4]], [3.9, [0.25, -2.8]]]),
          squash: K(t, [[2.7, 0], [2.8, 0.06], [3.0, -0.03], [3.2, 0]]),
        }, t);
        return h;
      }
      function anya(t, mood) {
        const shocked = t > 2.72 && t < 3.6;
        const laugh = t > 3.6 && t < 12.8 ? Math.abs(Math.sin(t * 9)) : 0;
        drawHuman(ctx, {
          st: ANYA, x: AX, y: GY, s: SC, flip: 1, turn: K(t, [[0, -0.25], [12.8, -0.25], [13.1, -0.55]]),
          look: t < 2.6 ? [-0.7, 0.4] : t < 12.8 ? [-0.3, 0.3] : [-1, 0],
          mouth: shocked ? "o" : t < 2.6 ? "smile" : "grin", mouthOpen: 0.6 + laugh * 0.4, eyes: t > 3.6 && t < 12.8 ? "happy" : "normal",
          eyeOpen: shocked ? 1.3 : 1, pupil: shocked ? 0.6 : 1, browL: shocked ? 1 : 0.5, browR: shocked ? 1 : 0.5,
          armL: t > 3.6 && t < 12.8 ? [0.5, -1.6 + laugh * 0.2] : t > 2.72 ? [0.7, -2.3] : [0.12, -0.2],
          armR: t > 3.6 && t < 12.8 ? [2.5 + laugh * 0.3, 0.3] : t > 2.72 ? [0.7, -2.3] : [0.12, -0.2],
          squash: laugh * 0.03, blush: 0.5,
        }, t);
      }
      function glasses(x, s, turn, col, a) {
        if (a <= 0) return;
        const hy = GY - 640 * s + Math.sin(0) * 3, ex = 60 * s, tx = turn * 40 * s;
        ctx.save(); ctx.globalAlpha = a;
        [-1, 1].forEach((sd) => { ctx.beginPath(); ctx.arc(x + sd * ex + tx, hy + 8 * s, 46 * s, 0, Math.PI * 2); ctx.fillStyle = rgba(col, 0.45); ctx.fill(); ctx.lineWidth = 9 * s; ctx.strokeStyle = PAL.ink; ctx.stroke(); });
        ctx.beginPath(); ctx.moveTo(x - ex + 46 * s + tx, hy); ctx.lineTo(x + ex - 46 * s + tx, hy); ctx.stroke();
        ctx.restore();
      }

      const LENSES = [[9.31, "ЭМОЦИИ", 410], [10.26, "ОЖИДАНИЯ", 570], [12.26, "ОПЫТ", 730]];
      function lensIcon(i) {
        if (i === 0) P.heart(ctx, 0.62, "#FF5C8A");
        else if (i === 1) { circle(ctx, 0, 0, 22, PAL.lav, 5); circle(ctx, 0, 0, 10, PAL.yellow, 4); }
        else { rrect(ctx, -22, -18, 44, 36, 4); ctx.fillStyle = PAL.violet; ctx.fill(); ctx.lineWidth = 5; ctx.strokeStyle = PAL.ink; ctx.stroke(); line(ctx, [[0, -16], [0, 16]], 4, PAL.ink, { boil: 0 }); }
      }

      function draw(t) {
        HF.setBoil(t);
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
        ctx.fillStyle = "#070A1F"; ctx.fillRect(0, 0, 1080, 1920);
        const [shx, shy] = shake(t, 22 * win(t, 2.75, 3.1, 0.02, 0.3), 30, 13);
        const split = E.out3(inv(3.3, 3.75, t));
        const gap = split * 26;
        const cam = { x: 0, y: 0, z: K(t, [[0, 1.12], [2.7, 1.02], [2.8, 1.1, "out3"], [3.3, 1.08], [3.75, 1.0, "out3"], [14.4, 1.04]]), r: 0, sx: shx, sy: shy };
        const mood = 1;
        if (split <= 0) {
          HF.withCam(ctx, cam, 1, () => { party(t, 0); tim(t, mood); anya(t, mood); });
        } else {
          // left: Tim's memory (cold, rainy); right: Anya's memory (warm, confetti)
          [-1, 1].forEach((sd) => {
            ctx.save(); ctx.beginPath();
            const jag = (y) => 540 + Math.sin(y * 0.02) * 26 + (y % 160 < 80 ? 14 : -14);
            if (sd < 0) { ctx.moveTo(0, 0); for (let y = 0; y <= 1920; y += 80) ctx.lineTo(jag(y) - gap, y); ctx.lineTo(0, 1920); }
            else { ctx.moveTo(1080, 0); for (let y = 0; y <= 1920; y += 80) ctx.lineTo(jag(y) + gap, y); ctx.lineTo(1080, 1920); }
            ctx.closePath(); ctx.clip();
            ctx.translate(sd * gap, 0);
            HF.withCam(ctx, cam, 1, () => {
              party(t, sd);
              if (sd < 0) {
                ctx.fillStyle = rgba("#1B2A8A", 0.42); ctx.fillRect(-100, 0, 1280, 1920);
                tim(t, mood);
                // rain cloud over Tim
                const cy = GY - 640 * SC - 230;
                shape(ctx, ellipsePts(TX, cy, 170, 70, 18, (a) => 1 + 0.15 * Math.sin(a * 6)), { fill: "#4A4F7A", lw: 7, seed: 70 });
                ctx.strokeStyle = rgba("#9FD8FF", 0.8); ctx.lineWidth = 5;
                const R = rng(Math.floor(t * 12)); for (let i = 0; i < 18; i++) { const x = TX - 150 + R() * 300, y = cy + 60 + R() * 380; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 10, y + 40); ctx.stroke(); }
              } else {
                ctx.fillStyle = rgba("#FFB01F", 0.16); ctx.fillRect(-100, 0, 1280, 1920);
                anya(t, mood);
                const R = rng(3); for (let i = 0; i < 40; i++) { const x = 560 + R() * 560, y = ((R() * 1700 + t * (120 + R() * 140)) % 1500) + 200; ctx.save(); ctx.translate(x, y); ctx.rotate(t * 3 + i); ctx.fillStyle = [PAL.yellow, "#FF8FBF", PAL.teal, PAL.lav][i % 4]; ctx.fillRect(-9, -5, 18, 10); ctx.restore(); }
                P.heart(ctx, 0.9, "#FF5C8A");
              }
            });
            // tinted glasses (C)
            const ga = E.back(inv(7.8, 8.1, t));
            HF.withCam(ctx, cam, 1, () => { if (sd < 0) glasses(TX, SC, 0.25, "#4F7BFF", ga); else glasses(AX, SC, -0.25, "#FFC93C", ga); });
            ctx.restore();
          });
          // divider
          ctx.save(); ctx.beginPath(); const jag = (y) => 540 + Math.sin(y * 0.02) * 26 + (y % 160 < 80 ? 14 : -14);
          for (let y = 0; y <= 1920; y += 80) (y ? ctx.lineTo(jag(y), y) : ctx.moveTo(jag(y), y));
          ctx.lineWidth = gap * 2 - 6; ctx.strokeStyle = PAL.navy0; ctx.stroke(); ctx.lineWidth = 6; ctx.strokeStyle = PAL.yellow; ctx.shadowColor = PAL.yellow; ctx.shadowBlur = 20; ctx.stroke(); ctx.restore();
          // memory labels
          const la = pop(t, 3.6, 0.35, "back2");
          [[-1, "ТИМ ПОМНИТ:", "ПОЗОР", "#9FB7FF", 4.5], [1, "АНЯ ПОМНИТ:", "УМОРА", PAL.yellow, 5.6]].forEach(([sd, a1, a2, col, t2]) => {
            const x = 540 + sd * 270;
            text(ctx, a1, x, 250, { size: 30, color: PAL.cream, family: "BrainSans", alpha: la });
            const k = pop(t, t2, 0.3, "back2");
            if (k > 0) { ctx.save(); ctx.translate(x, 318); ctx.rotate(sd * 0.05); ctx.scale(k, k); text(ctx, a2, 0, 0, { size: 66, color: col, stroke: PAL.ink, sw: 14 }); ctx.restore(); }
          });
          // lens chips
          LENSES.forEach(([t0, label, y], i) => {
            const k = pop(t, t0 - 0.05, 0.35, "back2"); if (k <= 0) return;
            const fade = 1 - inv(13.6, 14.0, t);
            ctx.save(); ctx.globalAlpha = fade;
            // beams to both sides
            ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = 0.16 * k * fade;
            ctx.beginPath(); ctx.moveTo(540, y); ctx.lineTo(TX - 120, 1030); ctx.lineTo(TX + 120, 1030); ctx.closePath(); ctx.fillStyle = "#4F7BFF"; ctx.fill();
            ctx.beginPath(); ctx.moveTo(540, y); ctx.lineTo(AX - 120, 1030); ctx.lineTo(AX + 120, 1030); ctx.closePath(); ctx.fillStyle = PAL.yellow; ctx.fill(); ctx.restore();
            ctx.translate(540, y); ctx.scale(k, k);
            ctx.font = "900 34px BrainDisplay"; const w = ctx.measureText(label).width + 120;
            rrect(ctx, -w / 2, -48, w, 96, 48); ctx.fillStyle = PAL.cream; ctx.fill(); ctx.lineWidth = 7; ctx.strokeStyle = PAL.ink; ctx.stroke();
            ctx.save(); ctx.translate(-w / 2 + 50, 0); lensIcon(i); ctx.restore();
            text(ctx, label, 26, 3, { size: 34, color: PAL.ink });
            ctx.restore();
          });
          // question marks (D)
          const q = pop(t, 12.9, 0.3, "back2") * (1 - inv(14.1, 14.4, t));
          if (q > 0) [[TX + 40, 700], [AX - 40, 700]].forEach(([x, y], i) => { ctx.save(); ctx.translate(x, y - Math.sin(t * 6 + i) * 8); ctx.scale(q, q); text(ctx, "?", 0, 0, { size: 120, color: PAL.yellow, stroke: PAL.ink, sw: 16 }); ctx.restore(); });
        }
        // ПЛЮХ burst + ОДНО СОБЫТИЕ
        const pl = pop(t, 2.78, 0.25, "back2") * (1 - inv(3.3, 3.45, t));
        if (pl > 0) { ctx.save(); ctx.translate(560 + shx, 1080); ctx.rotate(-0.1); ctx.scale(pl, pl); P.burst(ctx, 170, PAL.yellow, 12, 5); text(ctx, "ПЛЮХ!", 0, 4, { size: 60, color: PAL.ink }); ctx.restore(); }
        const ev = win(t, 0.4, 3.35, 0.25, 0.12);
        if (ev > 0) text(ctx, t < 2.75 ? "ОДНО СОБЫТИЕ" : "ОДНО СОБЫТИЕ…", 540, 250, { size: 58, color: PAL.cream, stroke: PAL.ink, sw: 12, alpha: ev });
        HF.vignette(ctx, 0.5);
        flash(ctx, t, 2.78, 0.2, PAL.white, 0.5);
        flash(ctx, t, 3.3, 0.25, PAL.yellow, 0.6);
        // enter from the glitch tear (navy) and leave on a yellow wipe
        const fi = 1 - inv(0, 0.3, t); if (fi > 0) { ctx.fillStyle = rgba(PAL.navy0, fi); ctx.fillRect(0, 0, 1080, 1920); }
        HF.wipe(ctx, t, 14.0, 0.96, PAL.yellow, 1);
      }

      const st = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(st, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(st.t) }, 0);
      window.__timelines["s5"] = tl;
      draw(0);
    })();
  </script>
</template>
