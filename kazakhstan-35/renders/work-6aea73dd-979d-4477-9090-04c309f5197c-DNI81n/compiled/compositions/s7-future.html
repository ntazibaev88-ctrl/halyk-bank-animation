      const D = 22.6, K = window.KZ, q = (s) => document.querySelector(s);
      const sky = K.skyline(1080, "silhouette", 23);
      q("#s7-back").innerHTML = sky.back; q("#s7-front").innerHTML = sky.front;
      const r = K.rng(3516);
      let st = "", rv = "", birds = "", parts = "";

      for (let i = 0; i < 7; i++) { const x = 300 + i * 46 + r() * 30, y = 900 + (i % 3) * 30 + r() * 30, s = 9 + r() * 6; birds += `<path class="s7-bird" d="M${x - s},${y - s * 0.4} Q${x - s * 0.4},${y - s * 0.7} ${x},${y} Q${x + s * 0.4},${y - s * 0.7} ${x + s},${y - s * 0.4}"/>`; }

      // young people seen from behind, looking at the city
      const BODY = "M-10,-342 C-10,-334 -14,-332 -24,-330 C-46,-326 -56,-318 -56,-300 L-54,-230 L-50,-165 C-50,-155 -40,-155 -40,-165 L-40,-170 L-36,-110 L-26,0 L-6,0 L-4,-120 L4,-120 L6,0 L26,0 L36,-110 L40,-170 L40,-165 C40,-155 50,-155 50,-165 L54,-230 L56,-300 C56,-318 46,-326 24,-330 C14,-332 10,-334 10,-342 Z";
      const person = (x, y, s, kind) => {
        let extra = "";
        if (kind === "girl") extra = `<path d="M-26,-372 C-30,-330 -34,-300 -22,-268 L22,-268 C34,-300 30,-330 26,-372 Z"/>`;
        if (kind === "point") extra = `<path d="M40,-318 L136,-410 L146,-398 L54,-298 Z"/>`;
        if (kind === "flag") extra = `<path d="M-50,-300 L-72,-470" stroke="#0A1430" stroke-width="7"/>`;
        const shape = `<path d="${BODY}"/><ellipse cx="0" cy="-370" rx="24" ry="28"/>${extra}`;
        let g = `<g transform="translate(${x},${y}) scale(${s})">`;
        g += `<g fill="#F6C453" stroke="#F6C453" stroke-width="2" transform="translate(4,-2)" opacity=".9">${shape}</g>`;
        g += `<g fill="#0A1430" stroke="none">${shape}</g>`;
        if (kind === "bag") g += `<rect x="-32" y="-300" width="64" height="92" rx="16" fill="#1C2B52"/><path d="M-24,-300 L-20,-322 M24,-300 L20,-322" stroke="#1C2B52" stroke-width="6"/>`;
        if (kind === "flag") g += `<g transform="translate(-72,-500) scale(0.07)">${K.flagSVG(800)}</g>`;
        return g + `</g>`;
      };
      q("#s7-people").innerHTML = person(250, 1700, 1.0, "flag") + person(430, 1694, 1.06, "girl") + person(620, 1690, 1.1, "point") + person(810, 1700, 1.0, "bag");

      const clk = { t: 0 };

      const tl = gsap.timeline({ paused: true });
      tl.to(clk, { t: D, duration: D, ease: "none", onUpdate: () => flag.draw(clk.t + 3) }, 0);
      // entrance: sunrise colour flood out of the previous scene
      tl.fromTo("#s7-all", { clipPath: "circle(0% at 52% 70%)" }, { clipPath: "circle(150% at 52% 70%)", duration: 0.7, ease: "power2.in" }, 0);

      tl.fromTo("#s7-sun", { attr: { cy: 1430 } }, { attr: { cy: 1200 }, duration: 12, ease: "power1.out" }, 0);
      tl.fromTo("#s7-rays", { opacity: 0, rotation: 0 }, { opacity: 1, rotation: 20, duration: D, ease: "none" }, 0.5);

      tl.fromTo("#s7-flag", { y: 220, opacity: 0 }, { y: 0, opacity: 1, duration: 1.6, ease: "power3.out" }, 0.3);
      tl.fromTo("#s7-people", { y: 260 }, { y: 0, duration: 1.8, ease: "expo.out" }, 0.4);
      tl.fromTo("#s7-birds", { x: -500, y: 40 }, { x: 900, y: -160, duration: 9, ease: "none" }, 1.0);
      tl.fromTo(".s7-bird", { scaleY: 1, transformOrigin: "50% 50%" }, { scaleY: -0.6, duration: 0.22, ease: "sine.inOut", yoyo: true, repeat: 39 }, 1.0);
      tl.fromTo("#s7-city", { y: 0 }, { y: -30, duration: 9, ease: "power1.inOut" }, 3);
      tl.fromTo("#s7-fg", { y: 0 }, { y: 30, duration: 9, ease: "power1.inOut" }, 3);
      // future goals (clearly marked as targets, not achievements)

      tl.fromTo("#s7-goals .g", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out", stagger: 0.3 }, 9.95);
      tl.to("#s7-goals", { opacity: 0, y: -30, duration: 0.35, ease: "power2.in" }, 11.95);
      // climax: the camera lifts into the sky, the flag steps back, 35 arrives
      tl.to("#s7-flag", { scale: 0.58, x: 259, y: 32, transformOrigin: "0px 0px", duration: 1.3, ease: "power3.inOut" }, 11.9);
      tl.to(["#s7-pole", "#s7-fin"], { opacity: 0, duration: 0.6 }, 11.9);

      tl.to("#s7-sun", { attr: { cy: 1290 }, duration: 1.6, ease: "power2.inOut" }, 12.0);

      tl.fromTo("#s7-35 span", { backgroundPosition: "100% 0" }, { backgroundPosition: "0% 0", duration: 1.6, ease: "power2.inOut" }, 13.6);
      tl.to("#s7-35 span", { backgroundPosition: "60% 0", duration: 1.6, ease: "power2.inOut" }, 18.7);
