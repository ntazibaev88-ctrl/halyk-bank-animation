      let dots = "";

      // 2. neural net
      const layers = [[3, 120], [5, 220], [5, 380], [3, 480]], NX = (i) => 70 + i * 0, nn = [];

      for (let i = 0; i < 8; i++) cols += `<rect x="${352 + i * 52}" y="442" width="22" height="258"/>`;
