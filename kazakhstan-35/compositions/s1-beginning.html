<template>
  <style>
    @font-face { font-family: "KZ Sans"; src: url("assets/fonts/Montserrat-Black.woff2") format("woff2"); font-weight: 900; }
    @font-face { font-family: "KZ Sans"; src: url("assets/fonts/Montserrat-Bold.woff2") format("woff2"); font-weight: 700; }
    @font-face { font-family: "KZ Serif"; src: url("assets/fonts/PlayfairDisplay-Black.woff2") format("woff2"); font-weight: 900; }
    #root { position: absolute; inset: 0; overflow: hidden; background: #040B1C; }
    #s1-bg { position: absolute; inset: 0; background: radial-gradient(90% 55% at 50% 42%, #123468 0%, #081A3A 45%, #030915 100%); }
    #s1-glow { position: absolute; left: -200px; top: 380px; width: 1480px; height: 1000px; background: radial-gradient(closest-side, rgba(246,196,83,.32), rgba(246,196,83,0)); opacity: 0; }
    #s1-rays { position: absolute; left: -460px; top: -180px; width: 2000px; height: 2000px; opacity: 0;
      background: repeating-conic-gradient(from 0deg at 50% 50%, rgba(255,226,150,.13) 0deg 4deg, rgba(255,226,150,0) 4deg 15deg);
      -webkit-mask-image: radial-gradient(closest-side, #000 0%, rgba(0,0,0,.5) 40%, transparent 72%); mask-image: radial-gradient(closest-side, #000 0%, rgba(0,0,0,.5) 40%, transparent 72%); }
    #s1-dust, #s1-hills, #s1-map { position: absolute; }
    #s1-dust { left: 0; top: 0; width: 1080px; height: 1920px; }
    #s1-mapwrap { position: absolute; left: 40px; top: 560px; width: 1000px; height: 660px; }
    #s1-map { left: 0; top: 0; width: 1000px; height: 660px; overflow: visible; }
    #s1-hills { left: -60px; bottom: 0; width: 1200px; height: 560px; }
    #s1-year { position: absolute; left: 0; right: 0; top: 214px; text-align: center; font-family: "KZ Serif", serif; font-weight: 900; font-size: 210px; line-height: 1; letter-spacing: .01em; }
    #s1-year span { display: inline-block; background: linear-gradient(180deg, #FFF1C4 0%, #F6C453 46%, #B47B22 100%); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 8px 30px rgba(246,196,83,.25)); }
    #s1-date { position: absolute; left: 0; right: 0; top: 456px; text-align: center; font-family: "KZ Sans", sans-serif; font-weight: 700; font-size: 38px; letter-spacing: .32em; color: #EAF2FF; }
    #s1-date i { display: inline-block; width: 70px; height: 2px; background: #F6C453; vertical-align: middle; margin: 0 22px 6px; font-style: normal; }
    #s1-title { position: absolute; left: 0; right: 0; top: 452px; text-align: center; font-family: "KZ Sans", sans-serif; font-weight: 900; font-size: 74px; line-height: 1.04; color: #FFFFFF; letter-spacing: .01em; text-shadow: 0 6px 30px rgba(0,8,24,.7); }
    #s1-title .w { display: inline-block; }
    #s1-title .g { color: #F6C453; }
    #s1-flag { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #s1-pole { position: absolute; left: 176px; top: 640px; width: 14px; height: 1300px; background: linear-gradient(90deg, #8D6A2A, #FFE6A3 45%, #C8922E 70%, #6C4C17); border-radius: 7px; }
    #s1-finial { position: absolute; left: 167px; top: 612px; width: 32px; height: 32px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #FFF3CF, #F6C453 45%, #9C6A1E); box-shadow: 0 0 30px rgba(246,196,83,.6); }
    #s1-flagmove { position: absolute; left: 186px; top: 600px; width: 800px; height: 480px; }
    #s1-cloth { position: absolute; left: 0; top: 0; width: 800px; height: 480px; }
    #s1-flash { position: absolute; inset: 0; background: radial-gradient(60% 35% at 52% 44%, rgba(255,240,200,.75), rgba(255,240,200,0)); opacity: 0; mix-blend-mode: screen; }
  </style>
  <div id="root" data-composition-id="s1-beginning" data-width="1080" data-height="1920" data-duration="10.4">
    <div id="s1-bg"></div>
    <div id="s1-rays"></div>
    <div id="s1-glow"></div>
    <svg id="s1-dust" viewBox="0 0 1080 1920"><g id="s1-dust-a"></g><g id="s1-dust-b"></g></svg>

    <div id="s1-mapwrap">
      <svg id="s1-map" viewBox="0 0 940 620">
        <defs>
          <linearGradient id="s1-kzfill" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#1FC3DC" stop-opacity=".55" />
            <stop offset="1" stop-color="#0A5C9A" stop-opacity=".35" />
          </linearGradient>
          <filter id="s1-soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="6" /></filter>
        </defs>
        <path id="s1-nb" fill="none" stroke="#6FA6D8" stroke-opacity=".22" stroke-width="1.2" />
        <path id="s1-kzglow" fill="none" stroke="#F6C453" stroke-width="10" stroke-opacity=".35" filter="url(#s1-soft)" pathLength="1000" stroke-dasharray="1000 1100" stroke-dashoffset="1000" />
        <path id="s1-kzfillp" fill="url(#s1-kzfill)" opacity="0" />
        <path id="s1-kzline" fill="none" stroke="#F6C453" stroke-width="2.6" stroke-linejoin="round" pathLength="1000" stroke-dasharray="1000 1100" stroke-dashoffset="1000" />
        <g id="s1-cities"></g>
      </svg>
    </div>

    <svg id="s1-hills" viewBox="0 0 1200 560" preserveAspectRatio="none">
      <defs>
        <linearGradient id="s1-h1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E2650" /><stop offset="1" stop-color="#050E22" /></linearGradient>
        <linearGradient id="s1-h2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0A1C3E" /><stop offset="1" stop-color="#030915" /></linearGradient>
      </defs>
      <g id="s1-hill-back"><path d="M0,250 C180,200 330,236 470,214 C640,186 790,226 930,200 C1050,180 1130,196 1200,186 V560 H0 Z" fill="url(#s1-h1)" /><path d="M0,250 C180,200 330,236 470,214 C640,186 790,226 930,200 C1050,180 1130,196 1200,186" fill="none" stroke="#F6C453" stroke-opacity=".35" stroke-width="2" /></g>
      <g id="s1-hill-front"><path d="M0,350 C160,316 300,340 450,326 C620,308 760,344 920,330 C1060,318 1140,326 1200,320 V560 H0 Z" fill="url(#s1-h2)" /><path d="M0,350 C160,316 300,340 450,326 C620,308 760,344 920,330 C1060,318 1140,326 1200,320" fill="none" stroke="#6FE3F2" stroke-opacity=".25" stroke-width="2" /></g>
    </svg>

    <div id="s1-flag">
      <div id="s1-pole"></div>
      <div id="s1-flagmove"><canvas id="s1-cloth" width="800" height="480"></canvas></div>
      <div id="s1-finial"></div>
    </div>
    <div id="s1-flash"></div>

    <div id="s1-year"><span id="s1-y1">1</span><span id="s1-y2">9</span><span id="s1-y3">9</span><span id="s1-y4">1</span></div>
    <div id="s1-date"><i></i>16 ЖЕЛТОҚСАН<i></i></div>
    <div id="s1-title"><span class="w g">ЖАҢА</span> <span class="w">ДӘУІРДІҢ</span><br /><span class="w">БАСТАЛУЫ</span></div>
  </div>
  <script>
    (function () {
      const D = 10.4, M = window.KZMAP, K = window.KZ;
      const q = (s) => document.querySelector(s);
      q("#s1-nb").setAttribute("d", M.neighbors);
      ["#s1-kzglow", "#s1-kzfillp", "#s1-kzline"].forEach((s) => q(s).setAttribute("d", M.kz));
      // cities of 1991: Almaty is the capital
      const cities = [["almaty", 9, "#F6C453"], ["akmola", 0], ["karaganda", 4.5, "#EAF2FF"], ["shymkent", 4.5, "#EAF2FF"], ["atyrau", 4.5, "#EAF2FF"], ["oskemen", 4.5, "#EAF2FF"], ["aktobe", 4.5, "#EAF2FF"], ["pavlodar", 4.5, "#EAF2FF"], ["kostanay", 4.5, "#EAF2FF"], ["aktau", 4.5, "#EAF2FF"]];
      let cs = "";
      cities.forEach(([k, r, c]) => {
        const p = M.cities[k === "akmola" ? "astana" : k];
        if (!r) return;
        cs += `<circle class="s1-city" cx="${p[0]}" cy="${p[1]}" r="${r}" fill="${c}" opacity="0"/>`;
      });
      const al = M.cities.almaty;
      cs += `<circle id="s1-ring" cx="${al[0]}" cy="${al[1]}" r="10" fill="none" stroke="#F6C453" stroke-width="2.5" opacity="0"/>`;
      cs += `<text id="s1-altx" x="${al[0] - 16}" y="${al[1] - 24}" text-anchor="end" font-family="KZ Sans" font-weight="700" font-size="26" letter-spacing="3" fill="#F6C453" opacity="0">АЛМАТЫ</text>`;
      q("#s1-cities").innerHTML = cs;
      // dust
      const r = K.rng(1991);
      let a = "", b = "";
      for (let i = 0; i < 90; i++) {
        const c = `<circle cx="${(r() * 1080).toFixed(1)}" cy="${(r() * 2100).toFixed(1)}" r="${(0.8 + r() * 2.4).toFixed(1)}" fill="${r() > 0.6 ? "#F6C453" : "#CFE6FF"}" opacity="${(0.15 + r() * 0.55).toFixed(2)}"/>`;
        if (i % 2) a += c; else b += c;
      }
      q("#s1-dust-a").innerHTML = a; q("#s1-dust-b").innerHTML = b;

      const flag = new K.WavingFlag(q("#s1-cloth"), { flagW: 720, top: 18, res: 1440, amp: 22, speed: 4.4 });
      const clock = { t: 0 };
      flag.draw(0);

      const tl = gsap.timeline({ paused: true });
      tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: () => flag.draw(clock.t) }, 0);
      // atmosphere
      tl.fromTo("#s1-dust-a", { y: 0, x: 0 }, { y: -170, x: 30, duration: D, ease: "none" }, 0);
      tl.fromTo("#s1-dust-b", { y: 0 }, { y: -90, duration: D, ease: "none" }, 0);
      tl.fromTo("#s1-hill-back", { x: 0 }, { x: -40, duration: D, ease: "none" }, 0);
      tl.fromTo("#s1-hill-front", { x: 0 }, { x: -90, duration: D, ease: "none" }, 0);
      // map draws itself (already 18% drawn on frame 0 so the thumbnail is never empty)
      tl.fromTo(["#s1-kzline", "#s1-kzglow"], { attr: { "stroke-dashoffset": 560 } }, { attr: { "stroke-dashoffset": 0 }, duration: 4.4, ease: "power2.inOut" }, 0);
      tl.fromTo("#s1-nb", { opacity: 0.35 }, { opacity: 1, duration: 2.5, ease: "power1.out" }, 0);
      tl.fromTo("#s1-kzfillp", { opacity: 0 }, { opacity: 1, duration: 1.4, ease: "power2.out" }, 3.6);
      tl.fromTo(".s1-city", { opacity: 0, scale: 0, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)", stagger: 0.07 }, 3.9);
      tl.fromTo("#s1-ring", { opacity: 0.9, attr: { r: 10 } }, { opacity: 0, attr: { r: 46 }, duration: 1.2, ease: "power2.out" }, 4.3);
      tl.fromTo("#s1-altx", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 4.3);
      tl.fromTo("#s1-mapwrap", { scale: 1.1, y: 30 }, { scale: 1, y: 0, duration: 5.2, ease: "power1.out" }, 0);
      // 1991 lands with the voice
      tl.fromTo("#s1-year span", { opacity: 0.62, y: 14, filter: "blur(3px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "expo.out", stagger: 0.11 }, 0.75);
      tl.fromTo("#s1-date", { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.9, ease: "expo.out" }, 3.15);
      tl.to("#s1-date", { opacity: 0, y: -10, duration: 0.3, ease: "power2.in" }, 5.6);
      // new era: map steps back, flag rises
      tl.to("#s1-mapwrap", { scale: 1.45, y: 260, opacity: 0.16, duration: 2.6, ease: "power2.inOut" }, 5.2);
      tl.fromTo("#s1-flag", { y: 1500 }, { y: 0, duration: 1.2, ease: "power3.out" }, 4.9);
      tl.fromTo("#s1-flagmove", { y: 760 }, { y: 0, duration: 3.0, ease: "power2.inOut" }, 5.3);
      tl.fromTo("#s1-rays", { opacity: 0, rotation: 0 }, { opacity: 1, rotation: 14, duration: 5.4, ease: "none" }, 5.0);
      tl.fromTo("#s1-glow", { opacity: 0 }, { opacity: 1, duration: 2.2, ease: "power2.out" }, 5.6);
      tl.fromTo("#s1-year", { y: 0, scale: 1 }, { y: -30, scale: 0.82, duration: 1.1, ease: "power3.inOut" }, 5.6);
      tl.fromTo("#s1-title .w", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.32, ease: "power3.out", stagger: 0.12 }, 6.35);
      tl.fromTo("#s1-title", { y: -40 }, { y: -40, duration: 0.01 }, 6.3);
      // "Kazakhstan became independent": flag at the top, flash of light
      tl.fromTo("#s1-flash", { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power2.out" }, 8.25);
      tl.to("#s1-flash", { opacity: 0.25, duration: 1.4, ease: "power2.out" }, 8.43);
      tl.fromTo("#s1-dust-b", { scale: 1, transformOrigin: "50% 45%" }, { scale: 1.12, duration: 2, ease: "power2.out" }, 8.25);
      window.__timelines["s1-beginning"] = tl;
    })();
  </script>
</template>
