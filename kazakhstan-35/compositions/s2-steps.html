  <script>
    (function () {
      const D = 13.4, K = window.KZ, q = (s) => document.querySelector(s);
      // flag row in front of the UN
      const r = K.rng(1992), cols = ["#C8102E", "#1F4E9A", "#F2B705", "#2E8B57", "#E8EEF6", "#8C1D40", "#0F7AAF", "#D35400"];
      let poles = "";
      for (let i = 0; i < 12; i++) {
        const x = 30 + i * 70 + (i >= 6 ? 30 : 0);
        if (Math.abs(x - 414) < 40) continue;
        const c1 = cols[Math.floor(r() * cols.length)], c2 = cols[Math.floor(r() * cols.length)];
        poles += `<rect x="${x}" y="292" width="3" height="148" fill="#E8EEF6"/><g class="s2-gf" transform="translate(${x + 3},296)"><rect width="44" height="14" fill="${c1}"/><rect y="14" width="44" height="14" fill="${c2}"/></g>`;
      }
      q("#s2-poles").innerHTML = poles;
      q("#s2-kzflag-in").innerHTML = `<g transform="scale(0.075)">${K.flagSVG(800)}</g>`;
      q("#s2-symflag-in").innerHTML = `<rect x="-3" y="-3" width="346" height="176" rx="6" fill="rgba(0,0,0,.25)"/>` + `<g transform="scale(0.425)">${K.flagSVG(800)}</g>`;
      q("#s2-emb-in").innerHTML = K.emblemSVG(150);
      // banknotes: stylised, not copies of real notes
      let notes = "";
      [["s2-note3", -14], ["s2-note2", -4], ["s2-note1", 8]].forEach(([g, a], i) => {
        notes += `<g class="s2-note" transform="rotate(${a})"><rect x="-150" y="-80" width="300" height="160" rx="10" fill="url(#${g})" stroke="rgba(255,240,200,.6)" stroke-width="2"/>
          <rect x="-138" y="-68" width="276" height="136" rx="6" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.5" stroke-dasharray="6 4"/>
          <circle cx="70" cy="0" r="44" fill="rgba(255,255,255,.18)"/><text x="70" y="22" text-anchor="middle" font-family="KZ Sans" font-weight="900" font-size="64" fill="rgba(255,255,255,.85)">₸</text>
          <text x="-120" y="-34" font-family="KZ Sans" font-weight="700" font-size="20" letter-spacing="3" fill="rgba(255,255,255,.85)">ТЕҢГЕ</text>
          <rect x="-120" y="20" width="110" height="8" rx="4" fill="rgba(255,255,255,.3)"/><rect x="-120" y="36" width="70" height="8" rx="4" fill="rgba(255,255,255,.2)"/></g>`;
      });
      q("#s2-notes").innerHTML = notes;
      let coins = "";
      [[520, 120, 30], [610, 90, 22], [700, 150, 26], [470, 370, 24], [770, 360, 30]].forEach(([x, y, rr], i) => {
        coins += `<g transform="translate(${x},${y})"><g class="s2-sc"><g class="s2-sci"><circle r="${rr}" fill="url(#s2-coinfill)"/><text y="${rr * 0.36}" text-anchor="middle" font-family="KZ Sans" font-weight="900" font-size="${rr}" fill="#7A4F12">₸</text></g></g></g>`;
      });
      q("#s2-coins").innerHTML = coins;

      const tl = gsap.timeline({ paused: true });
      // entrance: golden wipe from the bottom, continuing the light of scene 1
      tl.fromTo("#s2-wipe", { clipPath: "inset(100% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power3.inOut" }, 0);
      tl.fromTo("#s2-edge", { y: 1920, opacity: 1 }, { y: 0, duration: 0.6, ease: "power3.inOut" }, 0);
      tl.to("#s2-edge", { opacity: 0, duration: 0.25 }, 0.6);
      tl.fromTo("#s2-grid", { y: 0 }, { y: -260, duration: D, ease: "none" }, 0);
      // heading
      tl.fromTo("#s2-head .w", { opacity: 0, filter: "blur(10px)", y: 10 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.35, ease: "power3.out", stagger: 0.14 }, 0.35);
      tl.fromTo("#s2-ruler .ln", { scaleX: 0 }, { scaleX: 1, duration: 1.4, ease: "power2.inOut" }, 0.6);
      tl.fromTo("#s2-ruler .dt, #s2-ruler .tk", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)", stagger: 0.22 }, 0.7);
      // camera: centred heading → chapter 1 → 2 → 3
      tl.fromTo("#s2-track", { y: 260 }, { y: 0, duration: 0.9, ease: "power3.inOut" }, 2.2);
      tl.to("#s2-track", { y: -820, duration: 0.85, ease: "power3.inOut" }, 6.0);
      tl.to("#s2-track", { y: -1640, duration: 0.85, ease: "power3.inOut" }, 8.95);
      tl.to("#s2-head", { opacity: 0.0, duration: 0.5 }, 2.6);
      tl.fromTo("#s2-spine", { scaleY: 0 }, { scaleY: 1, duration: 8.5, ease: "power1.inOut" }, 2.4);
      tl.fromTo(".s2-node", { scale: 0 }, { scale: 1, duration: 0.45, ease: "back.out(2.5)", stagger: { each: 3.2 } }, 2.75);
      // chapter 1 — UN
      tl.fromTo("#s2-ch1 .s2-year", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, 2.85);
      tl.fromTo("#s2-ch1 .s2-kick", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 3.1);
      tl.fromTo("#s2-ch1 .s2-card", { opacity: 0, y: 60, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "expo.out" }, 3.0);
      tl.fromTo("#s2-un-bld", { y: 40 }, { y: 0, duration: 3.5, ease: "power1.out" }, 3.0);
      tl.fromTo(".s2-gf", { skewY: -4 }, { skewY: 4, duration: 0.9, ease: "sine.inOut", yoyo: true, repeat: 7, stagger: 0.08 }, 3.0);
      tl.fromTo("#s2-kzflag", { y: 150 }, { y: 0, duration: 1.4, ease: "power2.inOut" }, 4.0);
      tl.fromTo("#s2-ch1 .s2-label", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 4.4);
      // chapter 2 — flag & emblem
      tl.fromTo("#s2-ch2 .s2-year", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, 6.45);
      tl.fromTo("#s2-ch2 .s2-kick", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 6.6);
      tl.fromTo("#s2-ch2 .s2-card", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.7, ease: "expo.out" }, 6.4);
      tl.fromTo("#s2-symflag", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.8, ease: "power3.inOut" }, 6.45);
      tl.fromTo("#s2-symflag-in", { skewY: 0 }, { skewY: -1.5, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 4 }, 6.7);
      tl.fromTo("#s2-emb-in", { scale: 0.4, rotation: -60, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, rotation: 0, opacity: 1, duration: 1.1, ease: "expo.out" }, 6.95);
      tl.fromTo("#s2-emb-in .emb-ray", { opacity: 0 }, { opacity: 1, duration: 0.2, stagger: 0.02 }, 7.3);
      tl.fromTo("#s2-emb-in .emb-star", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.5, ease: "back.out(3)" }, 8.0);
      tl.fromTo(["#s2-t1", "#s2-t2"], { opacity: 0 }, { opacity: 1, duration: 0.4, stagger: 0.3 }, 7.6);
      tl.fromTo("#s2-ch2 .s2-label", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 7.5);
      // chapter 3 — tenge
      tl.fromTo("#s2-ch3 .s2-year", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: "expo.out" }, 9.4);
      tl.fromTo("#s2-ch3 .s2-kick", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 9.6);
      tl.fromTo("#s2-ch3 .s2-card", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.7, ease: "expo.out" }, 9.35);
      tl.fromTo(".s2-note", { opacity: 0, x: -120, rotation: -30 }, { opacity: 1, x: 0, rotation: (i) => [-14, -4, 8][i], duration: 0.8, ease: "expo.out", stagger: 0.12 }, 10.6);
      tl.fromTo("#s2-bigcoin", { scale: 0, rotation: -120, transformOrigin: "0 0" }, { scale: 1, rotation: 0, duration: 0.9, ease: "back.out(1.6)" }, 10.55);
      tl.fromTo(".s2-sc", { y: -260, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "bounce.out", stagger: 0.09 }, 10.9);
      tl.fromTo(".s2-sci", { scaleX: 1 }, { scaleX: 0.2, duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: 5, stagger: 0.1 }, 10.9);
      tl.fromTo("#s2-ch3 .s2-label", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 10.8);
      // exit: the coin becomes the world
      tl.fromTo("#s2-coin", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power2.out" }, 12.6);
      tl.to("#s2-coin", { scale: 26, duration: 0.55, ease: "power3.in" }, 12.85);
      window.__timelines["s2-steps"] = tl;
    })();
  </script>
