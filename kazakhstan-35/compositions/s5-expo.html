<template>
  <style>
    @font-face { font-family: "KZ Sans"; src: url("assets/fonts/Montserrat-Black.woff2") format("woff2"); font-weight: 900; }
    @font-face { font-family: "KZ Sans"; src: url("assets/fonts/Montserrat-Bold.woff2") format("woff2"); font-weight: 700; }
    @font-face { font-family: "KZ Serif"; src: url("assets/fonts/PlayfairDisplay-Black.woff2") format("woff2"); font-weight: 900; }
    #root { position: absolute; inset: 0; overflow: hidden; }
    #s5-all { position: absolute; inset: 0; overflow: hidden; background: #040C22; }
    #s5-svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    #s5-cam { position: absolute; inset: 0; }
    #s5-flash { position: absolute; inset: 0; background: radial-gradient(80% 60% at 50% 50%, #FFF6DA, #F6C453 60%, #C8922E); opacity: 0; }
    .s5-top { position: absolute; left: 0; right: 0; top: 226px; text-align: center; }
    .s5-top .t { font-family: "KZ Sans", sans-serif; font-weight: 900; font-size: 118px; line-height: 1; letter-spacing: .02em; color: #FFF; }
    .s5-top .t b { color: #F6C453; font-weight: 900; }
    .s5-top .k { margin-top: 14px; font-family: "KZ Sans", sans-serif; font-weight: 700; font-size: 31px; letter-spacing: .2em; color: #CFE6FF; }
    #s5-theme { position: absolute; left: 0; right: 0; top: 236px; text-align: center; font-family: "KZ Sans", sans-serif; font-weight: 900; font-size: 84px; line-height: 1.04; color: #FFF; }
    #s5-theme .w { display: inline-block; }
    #s5-theme .g { color: #6FE3F2; }
    #s5-count { position: absolute; left: 0; right: 0; top: 226px; text-align: center; }
    #s5-count .n { font-family: "KZ Serif", serif; font-weight: 900; font-size: 190px; line-height: 1; color: #F6C453; }
    #s5-count .l { margin-top: 2px; font-family: "KZ Sans", sans-serif; font-weight: 700; font-size: 34px; letter-spacing: .24em; color: #FFF; }
    #s5-open { position: absolute; left: 0; right: 0; top: 250px; text-align: center; }
    #s5-open div { display: inline-block; margin: 8px; font-family: "KZ Sans", sans-serif; font-weight: 900; font-size: 46px; letter-spacing: .06em; color: #06122A; background: #F6C453; padding: 12px 28px; border-radius: 60px; }
    #s5-open div.o { background: rgba(6,18,42,.6); color: #FFF; border: 2px solid #6FE3F2; }
  </style>
  <div id="root" data-composition-id="s5-expo" data-width="1080" data-height="1920" data-duration="13.8">
    <div id="s5-all">
      <div id="s5-cam">
        <svg id="s5-svg" viewBox="0 0 1080 1920">
          <defs>
            <linearGradient id="s5-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#030A1E" /><stop offset=".45" stop-color="#0B2452" /><stop offset=".62" stop-color="#16407A" /><stop offset=".7" stop-color="#2A5D9A" /><stop offset="1" stop-color="#06122A" /></linearGradient>
            <radialGradient id="s5-glass" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#CFF6FF" stop-opacity=".95" /><stop offset=".35" stop-color="#4FC3E8" stop-opacity=".75" /><stop offset=".8" stop-color="#0E5C9A" stop-opacity=".8" /><stop offset="1" stop-color="#062E5C" stop-opacity=".95" /></radialGradient>
            <radialGradient id="s5-halo" cx="50%" cy="50%" r="50%"><stop offset=".55" stop-color="#6FE3F2" stop-opacity=".35" /><stop offset="1" stop-color="#6FE3F2" stop-opacity="0" /></radialGradient>
            <linearGradient id="s5-panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2D5D9A" /><stop offset=".5" stop-color="#9FD3F2" /><stop offset="1" stop-color="#1E3E70" /></linearGradient>
            <clipPath id="s5-sphereclip"><circle cx="540" cy="860" r="262" /></clipPath>
          </defs>
          <rect width="1080" height="1920" fill="url(#s5-sky)" />
          <g id="s5-stars"></g>
          <g id="s5-fw"></g>
          <g id="s5-rings" fill="none"></g>
          <circle cx="540" cy="860" r="420" fill="url(#s5-halo)" id="s5-haloC" />
          <!-- wind turbines on the horizon -->
          <g id="s5-turbines" style="color:#3B5F92"></g>
          <!-- pavilions ring -->
          <path d="M0,1200 C120,1150 260,1140 380,1160 L380,1210 H0 Z" fill="#0F2850" />
          <path d="M1080,1200 C960,1150 820,1140 700,1160 L700,1210 H1080 Z" fill="#0F2850" />
          <path d="M0,1206 H1080 V1920 H0 Z" fill="#06122A" />
          <!-- the sphere -->
          <g id="s5-sphere">
            <rect x="470" y="1110" width="140" height="100" fill="#163866" />
            <path d="M420,1210 H660 L640,1180 H440 Z" fill="#1E4A80" />
            <circle cx="540" cy="860" r="262" fill="url(#s5-glass)" />
            <g clip-path="url(#s5-sphereclip)" fill="none" stroke="#E6FAFF" stroke-width="2">
              <g id="s5-lat" stroke-opacity=".35"></g>
              <g id="s5-mer"></g>
              <g id="s5-arcs"></g>
            </g>
            <ellipse cx="470" cy="760" rx="90" ry="55" fill="#FFFFFF" opacity=".22" transform="rotate(-30 470 760)" />
            <circle cx="540" cy="860" r="262" fill="none" stroke="#BFF3FF" stroke-width="3" stroke-opacity=".7" />
            <g id="s5-topturb" style="color:#DDEFFF"></g>
          </g>
          <!-- ring of nations + shanyrak -->
          <g id="s5-dome" fill="none" stroke="#F6C453" stroke-width="2.2" stroke-opacity=".75"></g>
          <g id="s5-flagsback"></g>
          <g id="s5-flagsfront"></g>
          <g id="s5-shan"></g>
          <!-- solar field -->
          <g id="s5-solar"></g>
        </svg>
      </div>
      <div class="s5-top" id="s5-title"><div class="t">ЭКСПО-<b>2017</b></div><div class="k">АСТАНА · 10.06 — 10.09.2017</div></div>
      <div id="s5-theme"><span class="w">«БОЛАШАҚ</span><br /><span class="w g">ЭНЕРГИЯСЫ»</span></div>
      <div id="s5-count"><div class="n"><span id="s5-num">0</span>+</div><div class="l">МЕМЛЕКЕТ ҚАТЫСТЫ</div></div>
      <div id="s5-open"><div>ӘЛЕМГЕ АШЫҚ</div><br /><div class="o">СЕНІМДІ СЕРІКТЕС</div></div>
      <div id="s5-flash"></div>
    </div>
  </div>
  <script>
    (function () {
      const D = 13.8, K = window.KZ, q = (s) => document.querySelector(s), R = 262, CX = 540, CY = 860;
      const r = K.rng(2017);
      let st = "";
      for (let i = 0; i < 110; i++) st += `<circle cx="${(r() * 1080).toFixed(0)}" cy="${(r() * 1100).toFixed(0)}" r="${(0.6 + r() * 1.6).toFixed(1)}" fill="#fff" opacity="${(0.2 + r() * 0.6).toFixed(2)}"/>`;
      q("#s5-stars").innerHTML = st;
      let lat = "";
      for (let k = -4; k <= 4; k++) { const y = (k / 5) * R, rx = Math.sqrt(R * R - y * y); lat += `<ellipse cx="${CX}" cy="${(CY + y).toFixed(1)}" rx="${rx.toFixed(1)}" ry="${(rx * 0.16).toFixed(1)}"/>`; }
      q("#s5-lat").innerHTML = lat;
      let mer = "";
      for (let k = 0; k < 12; k++) mer += `<ellipse class="s5-m" cx="${CX}" cy="${CY}" rx="10" ry="${R}"/>`;
      q("#s5-mer").innerHTML = mer;
      const mers = Array.from(document.querySelectorAll(".s5-m"));
      // turbines
      let tu = "";
      [[90, 1180, 300], [230, 1190, 230], [850, 1185, 280], [990, 1195, 210]].forEach(([x, y, h]) => { const t = K.turbine(h); tu += `<g transform="translate(${x},${y})">${t.tower}<g transform="translate(0,${t.hubY})"><g class="s5-blade">${t.blades}</g></g></g>`; });
      q("#s5-turbines").innerHTML = tu;
      let tt = "";
      [[470, 612, 60], [610, 612, 60]].forEach(([x, y, h]) => { const t = K.turbine(h); tt += `<g transform="translate(${x},${y})">${t.tower}<g transform="translate(0,${t.hubY})"><g class="s5-blade">${t.blades}</g></g></g>`; });
      q("#s5-topturb").innerHTML = tt;
      // solar field
      let so = "";
      for (let row = 0; row < 4; row++) for (let i = 0; i < 9 - row; i++) {
        const w = 120 + row * 26, x = 540 + (i - (8 - row) / 2) * (w + 14) - w / 2, y = 1250 + row * 95;
        so += `<g class="s5-pv"><path d="M${x},${y + 40} L${x + 18},${y} H${x + w + 18} L${x + w},${y + 40} Z" fill="url(#s5-panel)" stroke="#0B1F40" stroke-width="2"/><path d="M${x + 9},${y + 20} H${x + w + 9} M${x + w / 2},${y + 40} L${x + w / 2 + 18},${y}" stroke="#0B1F40" stroke-width="1.5"/></g>`;
      }
      q("#s5-solar").innerHTML = so;
      // ring of nations: banners on an orbit
      const NB = 28, RX = 400, RY = 70, OY = 1080, cols = ["#C8102E", "#1F4E9A", "#F2B705", "#2E8B57", "#E8EEF6", "#8C1D40", "#0F7AAF", "#D35400", "#00AFCA", "#6A1B9A"];
      let fb = "", ff = "";
      for (let i = 0; i < NB; i++) {
        const a = cols[Math.floor(r() * cols.length)], b = cols[Math.floor(r() * cols.length)];
        const g = `<g class="s5-nb"><rect x="-2" y="-58" width="3" height="60" fill="#E8EEF6"/><rect x="1" y="-58" width="34" height="11" fill="${a}"/><rect x="1" y="-47" width="34" height="11" fill="${b}"/></g>`;
        fb += g; ff += g;
      }
      q("#s5-flagsback").innerHTML = fb; q("#s5-flagsfront").innerHTML = ff;
      const fbs = Array.from(document.querySelectorAll("#s5-flagsback .s5-nb")), ffs = Array.from(document.querySelectorAll("#s5-flagsfront .s5-nb"));
      // shanyrak above the world + dome lines
      const SY = 528, SR = 120, SRY = 26;
      let dome = "";
      for (let i = 0; i < 24; i++) { const a = (i / 24) * Math.PI * 2; dome += `<path class="s5-uyk" pathLength="100" stroke-dasharray="100 120" stroke-dashoffset="100" d="M${(CX + Math.cos(a) * SR).toFixed(1)},${(SY + Math.sin(a) * SRY).toFixed(1)} Q${(CX + Math.cos(a) * (RX * 0.95)).toFixed(1)},${(SY + 60 + Math.sin(a) * 60).toFixed(1)} ${(CX + Math.cos(a) * RX).toFixed(1)},${(OY - 58 + Math.sin(a) * RY).toFixed(1)}"/>`; }
      q("#s5-dome").innerHTML = dome;
      let sh = `<ellipse cx="${CX}" cy="${SY}" rx="${SR}" ry="${SRY}" fill="rgba(6,18,42,.5)" stroke="#F6C453" stroke-width="10"/>`;
      for (const v of [-0.45, 0, 0.45]) { sh += `<path d="M${CX + v * SR},${SY - SRY * Math.sqrt(1 - v * v)} L${CX + v * SR},${SY + SRY * Math.sqrt(1 - v * v)}" stroke="#F6C453" stroke-width="5"/><path d="M${CX - SR * Math.sqrt(1 - v * v)},${SY + v * SRY} L${CX + SR * Math.sqrt(1 - v * v)},${SY + v * SRY}" stroke="#F6C453" stroke-width="5"/>`; }
      q("#s5-shan").innerHTML = sh;
      // partnership arcs on the sphere
      const home = [CX + 60, CY - 60];
      const ends = [[CX - 220, CY - 90], [CX - 150, CY + 150], [CX + 210, CY + 110], [CX - 40, CY + 230], [CX + 230, CY - 120], [CX - 230, CY + 40], [CX + 120, CY + 220], [CX - 120, CY - 200]];
      q("#s5-arcs").innerHTML = ends.map(([x, y]) => { const mx = (home[0] + x) / 2, my = (home[1] + y) / 2 - 110; return `<path class="s5-arc" d="M${home[0]},${home[1]} Q${mx},${my} ${x},${y}" stroke="#F6C453" stroke-width="3.5" pathLength="100" stroke-dasharray="100 120" stroke-dashoffset="100"/><circle class="s5-end" cx="${x}" cy="${y}" r="7" fill="#F6C453" stroke="none" opacity="0"/>`; }).join("") + `<circle cx="${home[0]}" cy="${home[1]}" r="11" fill="#FFF" stroke="#F6C453" stroke-width="4" id="s5-home" opacity="0"/>`;
      // rings
      let rg = "";
      for (let i = 0; i < 4; i++) rg += `<circle class="s5-ring" cx="${CX}" cy="${CY}" r="270" stroke="${i % 2 ? "#6FE3F2" : "#F6C453"}" stroke-width="3" opacity="0"/>`;
      q("#s5-rings").innerHTML = rg;
      // fireworks (deterministic)
      let fw = "";
      [[200, 420], [880, 380], [760, 560]].forEach(([x, y], k) => {
        for (let i = 0; i < 26; i++) { const a = (i / 26) * Math.PI * 2; fw += `<line class="s5-fw${k}" x1="${x}" y1="${y}" x2="${x}" y2="${y}" data-x="${(x + Math.cos(a) * 110).toFixed(0)}" data-y="${(y + Math.sin(a) * 110).toFixed(0)}" stroke="${k === 1 ? "#6FE3F2" : "#F6C453"}" stroke-width="3" stroke-linecap="round" opacity="0"/>`; }
      });
      q("#s5-fw").innerHTML = fw;

      // the world turns: meridians + orbiting banners as functions of one clock
      const clk = { a: 0 };
      const spin = () => {
        mers.forEach((m, k) => m.setAttribute("rx", Math.abs(Math.cos((k / 12) * Math.PI + clk.a) * R).toFixed(1)));
        for (let i = 0; i < NB; i++) {
          const a = (i / NB) * Math.PI * 2 + clk.a * 0.6, x = CX + Math.cos(a) * RX, y = OY + Math.sin(a) * RY, front = Math.sin(a) > 0;
          const s = 0.75 + 0.35 * (Math.sin(a) + 1) / 2;
          fbs[i].setAttribute("transform", `translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${s.toFixed(3)})`);
          ffs[i].setAttribute("transform", `translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${s.toFixed(3)})`);
          fbs[i].style.display = front ? "none" : "";
          ffs[i].style.display = front ? "" : "none";
        }
      };
      spin();

      const tl = gsap.timeline({ paused: true });
      tl.fromTo(clk, { a: 0 }, { a: 4.2, duration: D, ease: "none", onUpdate: spin }, 0);
      tl.fromTo(".s5-blade", { rotation: 0, transformOrigin: "50% 50%" }, { rotation: 540, duration: D, ease: "none" }, 0);
      // entrance: golden flash from the previous sunrise
      tl.fromTo("#s5-flash", { opacity: 1 }, { opacity: 0, duration: 0.32, ease: "power2.out" }, 0);
      tl.fromTo("#s5-cam", { scale: 1.18 }, { scale: 1, duration: 2.4, ease: "power3.out" }, 0);
      tl.fromTo("#s5-sphere", { y: 260 }, { y: 0, duration: 1.8, ease: "expo.out" }, 0.1);
      tl.fromTo("#s5-title .t", { opacity: 0, scale: 1.2, filter: "blur(12px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.7, ease: "expo.out" }, 0.55);
      tl.fromTo("#s5-title .k", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 2.3);
      [[2.4, 0], [3.2, 1], [3.9, 2]].forEach(([t, k]) => {
        tl.fromTo(`.s5-fw${k}`, { attr: { x2: (i, el) => el.getAttribute("x1"), y2: (i, el) => el.getAttribute("y1") }, opacity: 1 }, { attr: { x2: (i, el) => el.dataset.x, y2: (i, el) => el.dataset.y }, opacity: 0, duration: 1.1, ease: "power2.out" }, t);
      });
      // Future Energy
      tl.to("#s5-title", { opacity: 0, y: -30, duration: 0.35, ease: "power2.in" }, 4.6);
      tl.fromTo("#s5-theme .w", { opacity: 0, filter: "blur(10px)", y: 14 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: 0.4, ease: "power3.out", stagger: 0.16 }, 4.85);
      tl.fromTo(".s5-ring", { attr: { r: 265 }, opacity: 0.9 }, { attr: { r: 560 }, opacity: 0, duration: 1.8, ease: "power2.out", stagger: 0.35 }, 4.9);
      tl.fromTo(".s5-pv", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out", stagger: { each: 0.03, from: "center" } }, 5.0);
      tl.fromTo("#s5-turbines", { y: 120, opacity: 0 }, { y: 0, opacity: 1, duration: 0.9, ease: "expo.out" }, 5.1);
      // 100+ nations
      tl.to("#s5-theme", { opacity: 0, y: -30, duration: 0.3, ease: "power2.in" }, 6.25);
      const cnt = { v: 0 };
      tl.fromTo(cnt, { v: 0 }, { v: 100, duration: 1.3, ease: "power2.out", onUpdate: () => (q("#s5-num").textContent = Math.round(cnt.v)) }, 6.45);
      tl.fromTo("#s5-count", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.4, ease: "expo.out" }, 6.4);
      tl.fromTo(["#s5-flagsback", "#s5-flagsfront"], { opacity: 0 }, { opacity: 1, duration: 0.6 }, 6.5);
      // under one shanyrak
      tl.fromTo("#s5-shan", { y: -260, opacity: 0 }, { y: 0, opacity: 1, duration: 1.1, ease: "expo.out" }, 7.6);
      tl.to(".s5-uyk", { attr: { "stroke-dashoffset": 0 }, duration: 0.9, ease: "power2.out", stagger: 0.025 }, 7.9);
      tl.to("#s5-count", { opacity: 0, y: -30, duration: 0.35, ease: "power2.in" }, 9.3);
      // open to the world, a reliable partner
      tl.to(["#s5-shan", "#s5-dome", "#s5-flagsback", "#s5-flagsfront"], { opacity: 0, duration: 0.5 }, 9.5);
      tl.to("#s5-cam", { scale: 1.12, transformOrigin: "540px 860px", duration: 3.5, ease: "power1.inOut" }, 9.5);
      tl.fromTo("#s5-home", { opacity: 0, scale: 0, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(3)" }, 9.7);
      tl.to(".s5-arc", { attr: { "stroke-dashoffset": 0 }, duration: 0.8, ease: "power2.inOut", stagger: 0.12 }, 9.8);
      tl.to(".s5-end", { opacity: 1, duration: 0.2, stagger: 0.12 }, 10.4);
      tl.fromTo("#s5-open div", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)", stagger: 1.2 }, 9.75);
      // exit: dive into the glass
      tl.to("#s5-cam", { scale: 3.2, duration: 0.6, ease: "power3.in" }, 13.2);
      tl.to("#s5-open", { opacity: 0, duration: 0.3 }, 13.1);
      window.__timelines["s5-expo"] = tl;
    })();
  </script>
</template>
