<template>
  <style>
    @font-face { font-family: "KZ Sans"; src: url("assets/fonts/Montserrat-Black.woff2") format("woff2"); font-weight: 900; }
    @font-face { font-family: "KZ Sans"; src: url("assets/fonts/Montserrat-Bold.woff2") format("woff2"); font-weight: 700; }
    @font-face { font-family: "KZ Serif"; src: url("assets/fonts/PlayfairDisplay-Black.woff2") format("woff2"); font-weight: 900; }

    #s3-iris { position: absolute; inset: 0; overflow: hidden; background: #06122A; }
    #s3-mapstage { position: absolute; inset: 0; background: radial-gradient(90% 60% at 50% 45%, #0F2C5A 0%, #06122A 70%); }
    #s3-mapwrap { position: absolute; left: 70px; top: 560px; width: 940px; height: 620px; }
    #s3-map { position: absolute; left: 0; top: 0; width: 940px; height: 620px; overflow: visible; }
    #s3-head { position: absolute; left: 0; right: 0; top: 236px; text-align: center; }
    #s3-year { font-family: "KZ Serif", serif; font-weight: 900; font-size: 170px; line-height: 1; background: linear-gradient(180deg, #FFF1C4, #F6C453 50%, #B47B22); -webkit-background-clip: text; background-clip: text; color: transparent; }

    #s3-city { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; opacity: 0; }
    #s3-citysvg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
    #s3-cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #s3-name { position: absolute; left: 0; right: 0; top: 250px; text-align: center; }
    #s3-name .k { font-family: "KZ Sans", sans-serif; font-weight: 700; font-size: 32px; letter-spacing: .3em; color: #F6C453; }
    #s3-name .t { margin-top: 6px; font-family: "KZ Sans", sans-serif; font-weight: 900; font-size: 150px; line-height: 1; letter-spacing: .1em; color: #FFF; text-shadow: 0 10px 40px rgba(0,10,30,.6); }
    #s3-name .t span { display: inline-block; }
    #s3-oldlbl { position: absolute; left: 0; right: 0; top: 300px; text-align: center; font-family: "KZ Sans", sans-serif; font-weight: 700; font-size: 34px; letter-spacing: .3em; color: #E8D2A8; }
    .s3-tag { position: absolute; font-family: "KZ Sans", sans-serif; font-weight: 700; font-size: 28px; letter-spacing: .1em; color: #FFF; white-space: nowrap; }
    .s3-tag::before { content: ""; position: absolute; left: 50%; top: 40px; width: 2px; height: 70px; background: linear-gradient(#F6C453, rgba(246,196,83,0)); }
    .s3-tag b { display: inline-block; transform: translateX(-50%); background: rgba(6,18,42,.72); border: 1.5px solid rgba(246,196,83,.7); padding: 6px 14px; border-radius: 30px; font-weight: 700; }
    #s3-flare { position: absolute; left: 0; top: 0; width: 600px; height: 600px; margin: -300px 0 0 -300px; opacity: 0;
      background: radial-gradient(closest-side, rgba(255,240,200,.95), rgba(255,210,120,.35) 25%, rgba(255,210,120,0) 70%); mix-blend-mode: screen; }
  </style>
  <div id="root" data-composition-id="s3-capital" data-width="1080" data-height="1920" data-duration="12.4">
    <div id="s3-iris">
      <!-- MAP: the capital moves north -->
      <div id="s3-mapstage">
        <div id="s3-mapwrap">
          <svg id="s3-map" viewBox="0 0 940 620">
            <defs><linearGradient id="s3-kzf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1FC3DC" stop-opacity=".4" /><stop offset="1" stop-color="#0A5C9A" stop-opacity=".25" /></linearGradient>
              <filter id="s3-blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5" /></filter></defs>
            <path id="s3-kz" fill="url(#s3-kzf)" stroke="#F6C453" stroke-opacity=".7" stroke-width="2" />
            <path id="s3-arcglow" fill="none" stroke="#F6C453" stroke-width="9" stroke-opacity=".45" filter="url(#s3-blur)" pathLength="100" stroke-dasharray="100 120" stroke-dashoffset="100" />
            <path id="s3-arc" fill="none" stroke="#FFE6A3" stroke-width="3.5" stroke-linecap="round" pathLength="100" stroke-dasharray="100 120" stroke-dashoffset="100" />
            <circle id="s3-comet" r="9" fill="#FFF6DA" opacity="0" />
            <g id="s3-dots"></g>
          </svg>
        </div>
        <div id="s3-head">
          <div id="s3-year">1997</div>
          <div id="s3-kick">10 ЖЕЛТОҚСАН · <b>ЕЛОРДА</b></div>
        </div>
      </div>

      <!-- CITY: from Akmola to Astana -->
      <div id="s3-city">
        <div id="s3-cam">
          <svg id="s3-citysvg" viewBox="0 0 1080 1920">
            <defs>
              <linearGradient id="s3-skyN" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#040C22" /><stop offset=".38" stop-color="#0C2856" /><stop offset=".56" stop-color="#22528E" /><stop offset=".63" stop-color="#C98A52" /><stop offset=".66" stop-color="#F2C27A" /><stop offset="1" stop-color="#F2C27A" />
              </linearGradient>
              <linearGradient id="s3-skyO" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#151A26" /><stop offset=".45" stop-color="#3A3F4C" /><stop offset=".6" stop-color="#7C6B58" /><stop offset=".66" stop-color="#B49470" /><stop offset="1" stop-color="#B49470" />
              </linearGradient>
              <linearGradient id="s3-river" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3D5F8E" /><stop offset=".25" stop-color="#14325E" /><stop offset="1" stop-color="#081A38" /></linearGradient>
              <linearGradient id="s3-refl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5" /><stop offset="1" stop-color="#fff" stop-opacity="0" /></linearGradient>
              <mask id="s3-reflmask"><rect x="0" y="1240" width="1080" height="200" fill="url(#s3-refl)" /></mask>
              <radialGradient id="gold-sphere" cx="38%" cy="32%" r="70%"><stop offset="0" stop-color="#FFF6D8" /><stop offset=".4" stop-color="#F6C453" /><stop offset="1" stop-color="#9C6A1E" /></radialGradient>
              <radialGradient id="s3-sun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFE3A0" stop-opacity=".9" /><stop offset="1" stop-color="#FFE3A0" stop-opacity="0" /></radialGradient>
            </defs>
            <rect id="s3-skyNew" width="1080" height="1300" fill="url(#s3-skyN)" opacity="0" />
            <rect id="s3-skyOld" width="1080" height="1300" fill="url(#s3-skyO)" />
            <g id="s3-stars"></g>
            <ellipse cx="540" cy="1240" rx="700" ry="200" fill="url(#s3-sun)" id="s3-horizon" opacity=".6" />
            <g transform="translate(540,1240) scale(1.25) translate(-540,0)">
              <g id="s3-old"></g>
              <g id="s3-back"></g>
              <g id="s3-cranes"></g>
              <g id="s3-front"></g>
            </g>
            <rect y="1238" width="1080" height="200" fill="url(#s3-river)" />
            <g mask="url(#s3-reflmask)" opacity=".55"><g transform="translate(540,1240) scale(1.25,-0.62) translate(-540,0)"><use href="#s3-back" /><use href="#s3-front" /></g></g>
            <g id="s3-shimmer"></g>
            <path d="M0,1430 C300,1418 700,1424 1080,1412 V1920 H0 Z" fill="#06122A" />
            <path d="M0,1430 C300,1418 700,1424 1080,1412" fill="none" stroke="#F6C453" stroke-opacity=".5" stroke-width="2" />
            <g id="s3-lamps"></g>
            <path id="s3-trailA" d="M-40,1560 C300,1540 700,1550 1120,1530" fill="none" stroke="#FFE6A3" stroke-width="5" stroke-linecap="round" stroke-dasharray="60 140" opacity="0" />
            <path id="s3-trailB" d="M-40,1600 C300,1585 700,1592 1120,1575" fill="none" stroke="#FF5A4E" stroke-width="5" stroke-linecap="round" stroke-dasharray="40 170" opacity="0" />
          </svg>
          <div id="s3-flare"></div>
          <div class="s3-tag" id="s3-tagB" style="left:540px;top:560px"><b>БӘЙТЕРЕК</b></div>
          <div class="s3-tag" id="s3-tagK" style="left:360px;top:900px"><b>ХАН ШАТЫР</b></div>
          <div class="s3-tag" id="s3-tagA" style="left:745px;top:860px"><b>АҚОРДА</b></div>
          <div class="s3-tag" id="s3-tagM" style="left:220px;top:880px"><b>ӘЗІРЕТ СҰЛТАН</b></div>
        </div>
        <div id="s3-oldlbl">АҚМОЛА · 1997</div>
        <div id="s3-name"><div class="k">1998 · ЖАҢА ЕЛОРДА</div><div class="t"><span>А</span><span>С</span><span>Т</span><span>А</span><span>Н</span><span>А</span></div></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      const D = 12.4, M = window.KZMAP, K = window.KZ, q = (s) => document.querySelector(s);
      q("#s3-kz").setAttribute("d", M.kz);
      const A = M.cities.almaty, B = M.cities.astana;
      const C = [(A[0] + B[0]) / 2 + 170, (A[1] + B[1]) / 2 + 10];
      const arc = `M${A[0]},${A[1]} Q${C[0]},${C[1]} ${B[0]},${B[1]}`;
      q("#s3-arc").setAttribute("d", arc); q("#s3-arcglow").setAttribute("d", arc);
      q("#s3-dots").innerHTML =
        `<circle cx="${A[0]}" cy="${A[1]}" r="9" fill="#F6C453"/><text x="${A[0] - 18}" y="${A[1] + 9}" text-anchor="end" font-family="KZ Sans" font-weight="700" font-size="28" letter-spacing="3" fill="#F6C453">АЛМАТЫ</text>` +
        `<circle id="s3-akm" cx="${B[0]}" cy="${B[1]}" r="10" fill="#FFFFFF" opacity="0"/><circle id="s3-akmring" cx="${B[0]}" cy="${B[1]}" r="10" fill="none" stroke="#FFF" stroke-width="3" opacity="0"/>` +
        `<text id="s3-akmtx" x="${B[0] - 20}" y="${B[1] - 22}" text-anchor="end" font-family="KZ Sans" font-weight="900" font-size="34" letter-spacing="3" fill="#FFFFFF" opacity="0">АҚМОЛА</text>`;
      // city layers
      q("#s3-old").innerHTML = K.oldTown(1080, 4);
      const sky = K.skyline(1080, "night", 11);
      q("#s3-back").innerHTML = sky.back;
      q("#s3-front").innerHTML = sky.front;
      q("#s3-cranes").innerHTML = `<g transform="translate(250,0)">${K.L.crane(330)}</g><g transform="translate(800,0)">${K.L.crane(280)}</g>`;
      const r = K.rng(97);
      let st = "", sh = "", lamps = "";
      for (let i = 0; i < 70; i++) st += `<circle cx="${(r() * 1080).toFixed(0)}" cy="${(r() * 700).toFixed(0)}" r="${(0.7 + r() * 1.6).toFixed(1)}" fill="#fff" opacity="${(0.2 + r() * 0.6).toFixed(2)}"/>`;
      for (let i = 0; i < 40; i++) sh += `<rect x="${(r() * 1080).toFixed(0)}" y="${(1250 + r() * 170).toFixed(0)}" width="${(20 + r() * 70).toFixed(0)}" height="2" fill="${r() > 0.5 ? "#FFD98A" : "#9CC8F2"}" opacity="${(0.25 + r() * 0.5).toFixed(2)}"/>`;
      for (let i = 0; i < 9; i++) lamps += `<rect x="${40 + i * 125}" y="1440" width="3" height="60" fill="#33496E"/><circle cx="${41 + i * 125}" cy="1440" r="16" fill="#FFD98A" opacity=".18"/><circle cx="${41 + i * 125}" cy="1440" r="5" fill="#FFE6A3"/>`;
      q("#s3-stars").innerHTML = st; q("#s3-shimmer").innerHTML = sh; q("#s3-lamps").innerHTML = lamps;

      const tl = gsap.timeline({ paused: true });
      // iris from the tenge coin of scene 2
      tl.fromTo("#s3-iris", { clipPath: "circle(0% at 35% 46%)" }, { clipPath: "circle(150% at 35% 46%)", duration: 0.6, ease: "power3.in" }, 0);
      // 1997
      tl.fromTo("#s3-year", { opacity: 0, scale: 1.25, filter: "blur(12px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.7, ease: "expo.out" }, 0.5);
      tl.fromTo("#s3-kick", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.9);
      tl.fromTo("#s3-mapwrap", { scale: 0.92, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.2, ease: "power3.out" }, 0.25);
      // the move north
      const comet = { p: 0 };
      const place = () => {
        const t = comet.p, u = 1 - t;
        const x = u * u * A[0] + 2 * u * t * C[0] + t * t * B[0], y = u * u * A[1] + 2 * u * t * C[1] + t * t * B[1];
        q("#s3-comet").setAttribute("cx", x.toFixed(1)); q("#s3-comet").setAttribute("cy", y.toFixed(1));
      };
      place();
      tl.fromTo(["#s3-arc", "#s3-arcglow"], { attr: { "stroke-dashoffset": 100 } }, { attr: { "stroke-dashoffset": 0 }, duration: 1.5, ease: "power2.inOut" }, 1.9);
      tl.fromTo(comet, { p: 0 }, { p: 1, duration: 1.5, ease: "power2.inOut", onUpdate: place }, 1.9);
      tl.fromTo("#s3-comet", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 1.9);
      tl.to("#s3-comet", { opacity: 0, duration: 0.3 }, 3.4);
      tl.fromTo("#s3-akm", { opacity: 0 }, { opacity: 1, duration: 0.2 }, 3.3);
      tl.fromTo("#s3-akmring", { opacity: 1, attr: { r: 10 } }, { opacity: 0, attr: { r: 60 }, duration: 0.9, ease: "power2.out" }, 3.35);
      tl.fromTo("#s3-akmtx", { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 3.35);
      // dive into Akmola
      const ox = 70 + B[0], oy = 560 + B[1];
      tl.to("#s3-head", { opacity: 0, y: -40, duration: 0.4, ease: "power2.in" }, 3.9);
      tl.to("#s3-mapwrap", { scale: 9, transformOrigin: `${B[0]}px ${B[1]}px`, x: 540 - ox, y: 900 - oy, duration: 0.75, ease: "power3.in" }, 3.95);
      tl.to("#s3-mapstage", { opacity: 0, duration: 0.3, ease: "power1.in" }, 4.4);
      tl.fromTo("#s3-city", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 4.4);
      tl.fromTo("#s3-cam", { scale: 1.25, transformOrigin: "50% 62%" }, { scale: 1.0, duration: 1.8, ease: "power3.out" }, 4.4);
      tl.fromTo("#s3-oldlbl", { opacity: 0, scale: 1.1 }, { opacity: 1, scale: 1, duration: 0.8, ease: "expo.out" }, 4.7);
      // the new capital rises
      tl.to("#s3-oldlbl", { opacity: 0, duration: 0.3 }, 6.0);
      tl.to("#s3-old", { y: 160, opacity: 0, duration: 1.0, ease: "power2.in" }, 6.0);
      tl.fromTo("#s3-skyNew", { opacity: 0 }, { opacity: 1, duration: 1.6, ease: "power2.inOut" }, 6.0);
      tl.to("#s3-skyOld", { opacity: 0, duration: 1.6, ease: "power2.inOut" }, 6.0);
      tl.fromTo("#s3-cranes", { y: 420 }, { y: 0, duration: 0.7, ease: "power3.out" }, 5.9);
      tl.to("#s3-cranes", { y: 420, duration: 0.7, ease: "power2.in" }, 8.2);
      tl.fromTo("#s3-back", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 1.4, ease: "power3.out" }, 6.2);
      tl.fromTo("#s3-front .lm", { y: 460 }, { y: 0, duration: 1.1, ease: "expo.out", stagger: { each: 0.12, from: "center" } }, 6.25);
      tl.fromTo("#s3-front .lit, #s3-back .lit", { opacity: 0 }, { opacity: 1, duration: 0.8, stagger: 0.02 }, 7.2);
      tl.fromTo("#s3-name .k", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 6.4);
      tl.fromTo("#s3-name .t span", { opacity: 0, y: 40, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "expo.out", stagger: 0.07 }, 6.3);
      // Baiterek: push in, sphere glints
      tl.to("#s3-name", { opacity: 0, y: -30, duration: 0.35, ease: "power2.in" }, 7.8);
      tl.to("#s3-cam", { scale: 1.7, transformOrigin: "540px 860px", duration: 1.6, ease: "power2.inOut" }, 7.9);
      tl.fromTo("#s3-flare", { opacity: 0, scale: 0.4, x: 516, y: 842 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, 8.6);
      tl.to("#s3-flare", { opacity: 0.35, duration: 0.7 }, 8.95);
      tl.fromTo("#s3-tagB", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 8.4);
      // new face of a young state: pull back, label the landmarks
      tl.to("#s3-cam", { scale: 1.02, duration: 1.8, ease: "power2.inOut" }, 9.7);
      tl.to("#s3-flare", { opacity: 0, duration: 0.6 }, 9.7);
      tl.to("#s3-tagB", { y: 110, duration: 1.8, ease: "power2.inOut" }, 9.7);
      tl.fromTo(["#s3-tagK", "#s3-tagA", "#s3-tagM"], { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out", stagger: 0.18 }, 10.4);
      tl.fromTo(["#s3-trailA", "#s3-trailB"], { opacity: 0 }, { opacity: 0.9, duration: 0.6 }, 7.0);
      tl.fromTo("#s3-trailA", { attr: { "stroke-dashoffset": 0 } }, { attr: { "stroke-dashoffset": -1400 }, duration: 5.4, ease: "none" }, 7.0);
      tl.fromTo("#s3-trailB", { attr: { "stroke-dashoffset": 0 } }, { attr: { "stroke-dashoffset": 1400 }, duration: 5.4, ease: "none" }, 7.0);
      tl.fromTo("#s3-shimmer", { x: 0 }, { x: -60, duration: D, ease: "none" }, 0);
      tl.fromTo("#s3-stars", { opacity: 0.2 }, { opacity: 1, duration: 2, ease: "power1.inOut" }, 6.2);
      window.__timelines["s3-capital"] = tl;
    })();
  </script>
</template>
