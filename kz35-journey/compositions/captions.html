    <div id="cap-00" class="clip cap" data-start="1.409" data-duration="1.225" data-track-index="0"><p class="cap-text"><span class="hl">Қазақстан...</span></p></div>
    <div id="cap-01" class="clip cap" data-start="2.681" data-duration="1.702" data-track-index="0"><p class="cap-text">Ұлы даланың төсінде орналасқан,</p></div>
    <div id="cap-02" class="clip cap" data-start="4.403" data-duration="1.676" data-track-index="0"><p class="cap-text">тарихы <span class="hl">терең</span>, табиғаты <span class="hl">бай</span>,</p></div>
    <div id="cap-03" class="clip cap" data-start="6.099" data-duration="2.1" data-track-index="0"><p class="cap-text">болашағы <span class="hl">зор</span> мемлекет.</p></div>
    <div id="cap-04" class="clip cap" data-start="8.219" data-duration="1.549" data-track-index="0"><p class="cap-text"><span class="hl">1991</span> жылы</p></div>

    <div id="cap-06" class="clip cap" data-start="11.178" data-duration="2.953" data-track-index="0"><p class="cap-text">жаңа <span class="hl">даму жолына</span> қадам басты.</p></div>
    <div id="cap-07" class="clip cap" data-start="14.294" data-duration="1.574" data-track-index="0"><p class="cap-text">Бұл — Қазақстан тарихындағы</p></div>
    <div id="cap-08" class="clip cap" data-start="15.888" data-duration="2.286" data-track-index="0"><p class="cap-text"><span class="hl">жаңа дәуірдің</span> басталуы еді.</p></div>
    <div id="cap-09" class="clip cap" data-start="18.194" data-duration="1.561" data-track-index="0"><p class="cap-text"><span class="hl">35 жыл</span> ішінде еліміз</p></div>
    <div id="cap-10" class="clip cap" data-start="19.775" data-duration="2.199" data-track-index="0"><p class="cap-text">үлкен <span class="hl">өзгерістерден</span> өтті.</p></div>
    <div id="cap-11" class="clip cap" data-start="21.994" data-duration="1.778" data-track-index="0"><p class="cap-text">Мемлекеттік <span class="hl">шекарамыз</span> бекітіліп,</p></div>
    <div id="cap-12" class="clip cap" data-start="23.792" data-duration="2.569" data-track-index="0"><p class="cap-text">ұлттық <span class="hl">валютамыз</span> айналымға енді.</p></div>
    <div id="cap-13" class="clip cap" data-start="26.381" data-duration="1.536" data-track-index="0"><p class="cap-text">Қазақстан <span class="hl">әлемге танылып,</span></p></div>

    <div id="cap-15" class="clip cap" data-start="29.365" data-duration="2.315" data-track-index="0"><p class="cap-text"><span class="hl">толыққанды мүшесіне</span> айналды.</p></div>
    <div id="cap-16" class="clip cap" data-start="32.007" data-duration="1.714" data-track-index="0"><p class="cap-text">Елордамыз <span class="hl">Астана</span> бой көтеріп,</p></div>

    <div id="cap-19" class="clip cap" data-start="43.98" data-duration="2.794" data-track-index="0"><p class="cap-text">Қазақстан — <span class="hl">табиғи байлығы</span> мол мемлекет.</p></div>

    <div id="cap-23" class="clip cap" data-start="54.307" data-duration="2.658" data-track-index="0"><p class="cap-text"><span class="hl">Металлургия, энергетика,</span> машина жасау</p></div>

    <div id="cap-25" class="clip cap" data-start="58.822" data-duration="3.475" data-track-index="0"><p class="cap-text">мыңдаған адамға <span class="hl">еңбек етуге</span> мүмкіндік берді.</p></div>

    <div id="cap-28" class="clip cap" data-start="66.381" data-duration="1.983" data-track-index="0"><p class="cap-text">Кең байтақ даламызда <span class="hl">бидай</span> өсіп,</p></div>

    <div id="cap-46" class="clip cap" data-start="103.595" data-duration="2.667" data-track-index="0"><p class="cap-text"><span class="hl">35 жыл</span> — бұл тек өткен тарих емес.</p></div>
