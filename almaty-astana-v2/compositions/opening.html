  <script>
  (function(){
    const { W,H,ease,prog,lerp,bind,grade,glow } = KIT; SHOT.init();
    const T=TLX('opening'), tl=gsap.timeline({paused:true}), $=id=>document.getElementById(id), D=T.dur+.1;
    const seam=(x)=>1010-(x-540)*.19;
    bind(tl,$('op-cv'),D,(ctx,t)=>{ ctx.clearRect(0,0,W,H);
      const p=ease.outq(prog(t,0,1.4)), push=ease.io(t/D);

      ctx.save(); ctx.beginPath(); ctx.moveTo(0,seam(0)+3); ctx.lineTo(W,seam(W)+3); ctx.lineTo(W,seam(W)+(H-seam(W))*p); ctx.lineTo(0,seam(0)+(H-seam(0))*p); ctx.closePath(); ctx.clip();

      grade(ctx,t,{vignette:.6});
    });
    const wA=T.wa('o1',0,0), wB=T.wa('o1',0,2);
    tl.fromTo($('op-a'),{x:-700,opacity:0},{x:0,opacity:1,duration:1.1,ease:'power4.out'},.5);
    tl.fromTo($('op-b'),{x:700,opacity:0},{x:0,opacity:1,duration:1.1,ease:'power4.out'},.8);
    tl.to($('op-a'),{scale:1.07,transformOrigin:'0% 50%',duration:.35,yoyo:true,repeat:1,ease:'power2.out'},wA); tl.to($('op-b'),{scale:1.07,transformOrigin:'100% 50%',duration:.35,yoyo:true,repeat:1,ease:'power2.out'},wB);
    tl.fromTo($('op-a2'),{opacity:0,x:-30},{opacity:1,x:0,duration:.6},1.5); tl.fromTo($('op-b2'),{opacity:0,x:30},{opacity:1,x:0,duration:.6},1.7);

    tl.fromTo($('op-k2'),{opacity:0,y:-24},{opacity:1,y:0,duration:.5,ease:'power3.out'},T.pa('o2',1));
    window.__timelines['sc-opening']=tl;
  })();
