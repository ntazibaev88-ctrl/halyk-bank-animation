  <script>
  (function(){
    const T=TLX('astana'), $=id=>document.getElementById(id), tl=gsap.timeline({paused:true}); SHOT.init();
    const g=.05, ids=[1,2,3,4,5,6,7,8].map(i=>$('ast-l'+i));
    const bp=T.wa('s4',0,3)-g, av=T.wa('s5',0,2)-g, rv=T.pa('s5',1)-g;
    const shots=[
      {n:'towers',a:0,b:T.a('s2')-g,el:ids[0],la:.5},
      {n:'baiterek',a:T.a('s2')-g,b:T.a('s3')-g,el:ids[1]},
      {n:'shatyr',a:T.a('s3')-g,b:T.a('s4')-g,el:ids[2]},
      {n:'expo',a:T.a('s4')-g,b:bp,el:ids[3]},
      {n:'blueprint',a:bp,b:T.a('s5')-g,el:ids[4]},
      {n:'avenue',a:T.a('s5')-g,b:av,el:ids[5]},
      {n:'river',a:av,b:rv,el:ids[6]},
      {n:'night',a:rv,b:T.dur+.2,el:ids[7]}];
    SCENE.shotScene({tl,cv:$('ast-cv'),dur:T.dur+.2,shots,tint:'rgba(120,170,255,.14)',xfade:.36,labelOut:.12});

    SCENE.hud(tl,'ast','astana',T);
    UI.count(tl,$('ast-yr'),1990,1997,.7,1.2); UI.count(tl,$('ast-h'),0,97,shots[1].a+.5,1.4); UI.count(tl,$('ast-h2c'),0,150,shots[2].a+.5,1.4);
    window.__timelines['sc-astana']=tl;
  })();
