  <script>
    (function () {
      const C = MC.cues("s05-cues"), D = C.dur;
      const tl = gsap.timeline({ paused: true });
      const $ = (id) => document.getElementById(id);
      const tStore = MC.word(C, "n08", "запасы") - 0.3, tNo = MC.word(C, "n09", "людей") - 0.15;

      /* shot A — tilt up the set sails; they breathe in the wind */
      tl.fromTo("#s5-a", { filter: "blur(12px)", scale: 1.25 }, { filter: "blur(0px)", scale: 1, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo("#s5-sails", { y: -220, rotation: -2 }, { y: 120, rotation: 1.5, duration: tStore, ease: "power1.inOut" }, 0);

      /* shot B — the cabin: light through the porthole, dust, nobody */
      const bctx = $("s5-beam").getContext("2d");
      function beam(t) {
        bctx.clearRect(0, 0, 1200, 1920);
        const a = 0.18 + 0.04 * Math.sin(t * 0.9);
        const g = bctx.createLinearGradient(300, 520, 760, 1150);
        g.addColorStop(0, `rgba(170,200,225,${a})`); g.addColorStop(1, "rgba(170,200,225,0)");
        bctx.fillStyle = g; bctx.beginPath();
        bctx.moveTo(240, 470); bctx.lineTo(360, 560); bctx.lineTo(980, 1240); bctx.lineTo(520, 1240); bctx.closePath(); bctx.fill();
      }
      const inBeam = (x, y) => { const u = (y - 520) / 720; if (u < 0 || u > 1) return 0; const l = 300 + u * 220, r = 360 + u * 620; return x > l && x < r ? 1 : 0.12; };

      MC.drive(tl, D, (t) => {
        $("s5-fog-a").style.transform = `translateX(${-t * 90}px)`;
