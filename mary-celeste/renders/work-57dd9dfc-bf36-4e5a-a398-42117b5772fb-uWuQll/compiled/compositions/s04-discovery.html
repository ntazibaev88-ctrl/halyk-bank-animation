  <script type="application/json" id="s04-cues">{"dur": 5.19, "seg": {"n07": {"s": 0.304, "e": 4.948, "w": [["Спустя", 0.304, 0.742], ["несколько", 0.742, 1.206], ["недель", 1.206, 1.592], ["другой", 1.592, 2.017], ["корабль", 2.017, 2.417], ["обнаружил", 2.417, 3.113], ["его", 3.113, 3.345], ["в", 3.345, 3.396], ["Атлантическом", 3.396, 4.105], ["океане.", 4.105, 4.685]]}}}</script>
  <script>
    (function () {
      const C = MC.cues("s04-cues"), D = C.dur;
      const tl = gsap.timeline({ paused: true });
      const $ = (id) => document.getElementById(id);
      const sea = MC.sea($("s4-sea"), { layers: 7, storm: 0.3, seed: 41, far: [86, 104, 122], near: [8, 14, 21], spread: 0.75, foam: 0.6 });
      const H = 1000;
      const pan = MC.keys([[0, { p: 0 }], [D - 0.7, { p: 1 }, "power1.inOut"]]);
      const tMark = MC.word(C, "n07", "обнаружил") - 0.1;

      // camera tracks right, from the second ship toward the abandoned one (2.5D parallax)
      MC.drive(tl, D, (t) => {
        const p = pan(t).p;
        sea(t, { horizon: H, sway: p * 900 });
        const xs = [380, 630, 880].map((x) => sea.height(1, x + p * 900 * sea.layers[1].z, t, H));
        const y = Math.min(...xs) - 4;
        $("s4-mc").style.transform = `translate(${180 - p * 260}px, ${y - (640 + 400 * 0.76)}px) rotate(${(xs[2] - xs[0]) * 0.05}deg)`;
        $("s4-dg").style.transform = `translate(${-p * 1100}px, ${Math.sin(t * 1.3) * 10}px) rotate(${Math.sin(t * 1.1) * 1.2}deg)`;
        $("s4-fog-far").style.transform = `translateX(${-p * 140 - t * 12}px)`;
        $("s4-fog-mid").style.transform = `translateX(${-p * 500 - t * 30 - 400}px)`;
        $("s4-fog-near").style.transform = `translateX(${-p * 1300 - t * 50 - 800}px)`;
        const mx = 330 + 300 + 180 - p * 260, my = y - 140;
        $("s4-mark").setAttribute("transform", `translate(${mx} ${my})`);
      });

      // the fog thins as the ship comes into view
      tl.fromTo("#s4-world", { filter: "blur(10px)" }, { filter: "blur(0px)", duration: 0.4, ease: "power2.out" }, 0);
      tl.fromTo("#s4-fog-mid", { opacity: 0.95 }, { opacity: 0.35, duration: D - 1, ease: "power1.inOut" }, 0.4);
      tl.fromTo("#s4-mc img", { opacity: 0.25 }, { opacity: 1, duration: 2.0, ease: "power1.inOut" }, 0.8);
      tl.fromTo("#s4-dg-label", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.45);
      tl.to("#s4-dg-label", { opacity: 0, duration: 0.25 }, tMark - 0.2);
      MC.blurWords(tl, $("s4-date"), 0.25, { stagger: 0.09 });

      // radar marker locks on the abandoned ship
      tl.fromTo("#s4-radar", { opacity: 0 }, { opacity: 1, duration: 0.2 }, tMark);
      tl.fromTo("#s4-r1", { attr: { r: 320 } }, { attr: { r: 150 }, duration: 0.45, ease: "expo.out" }, tMark);
      tl.fromTo("#s4-r2", { attr: { r: 400 }, rotation: 0 }, { attr: { r: 210 }, duration: 0.6, ease: "expo.out" }, tMark);
      tl.fromTo("#s4-ping", { attr: { r: 150 }, opacity: 0.9 }, { attr: { r: 380 }, opacity: 0, duration: 1.1, ease: "power2.out" }, tMark + 0.3);
      MC.type(tl, $("s4-coords"), tMark + 0.35, 30);

      // exit: zoom through the abandoned ship
      tl.to("#s4-world", { scale: 2.6, transformOrigin: "62% 42%", filter: "blur(10px)", duration: 0.6, ease: "power3.in" }, D - 0.6);
      tl.to(["#s4-radar", "#s4-date", "#s4-coords"], { opacity: 0, duration: 0.25 }, D - 0.6);
      tl.fromTo("#s4-zoom", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.in" }, D - 0.3);

      window.__timelines["s04-discovery"] = tl;
    })();
  </script>
