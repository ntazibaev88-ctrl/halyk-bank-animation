        tl.fromTo(el, { attr: { "stroke-dasharray": l, "stroke-dashoffset": l } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.45, ease: "power2.out" }, 1.5 + i * 0.4);
      });
      // magnifier and lamp light move over the evidence
      const lens = MC.keys([[0, { x: 760, y: 260 }], [1.6, { x: 330, y: 280 }], [3.4, { x: 560, y: 560 }], [5.2, { x: 380, y: 300 }]]);
      MC.drive(tl, D, (t) => {
        const p = lens(t);
        $("s8-lens").style.transform = `translate(${p.x}px, ${p.y}px) rotate(${-24 + Math.sin(t * 0.8) * 4}deg)`;
        $("s8-pool").style.transform = `translate(${Math.sin(t * 0.35) * 60}px, ${Math.cos(t * 0.3) * 40}px)`;
        $("s8-needle").setAttribute("transform", `rotate(${20 + Math.sin(t * 1.3) * 14 + Math.sin(t * 3.1) * 4})`);
      });

      /* "...больше никто не видел." */
      tl.fromTo("#s8-stamp", { opacity: 0, scale: 2.4, rotation: -20 }, { opacity: 1, scale: 1, rotation: -9, duration: 0.18, ease: "power4.in" }, tNone);

      /* n16 — more than a century and a half; the answer never found */
      tl.fromTo("#s8-dim", { opacity: 0 }, { opacity: 1, duration: 0.4 }, t16 - 0.25);
      tl.to("#s8-lens", { opacity: 0, duration: 0.3 }, t16 - 0.25);
      tl.fromTo("#s8-time", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t16 - 0.1);
      const tline = $("s8-tline");
      tl.fromTo(tline, { attr: { "stroke-dasharray": 920, "stroke-dashoffset": 920 } }, { attr: { "stroke-dashoffset": 0 }, duration: 1.6, ease: "power2.inOut" }, t16 + 0.1);
      tl.fromTo("#s8-tdot", { attr: { cx: 10 } }, { attr: { cx: 930 }, duration: 1.6, ease: "power2.inOut" }, t16 + 0.1);
      MC.count(tl, $("s8-y1"), t16 + 0.1, 1872, 2026, 1.6);
      tl.fromTo("#s8-big", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.3 }, tCent);
      MC.count(tl, $("s8-big-n"), tCent, 100, 154, 0.9);
      MC.blurWords(tl, $("s8-title"), tAns, { stagger: 0.12, dur: 0.3 });

      /* exit — into the dark sea */
      tl.to(["#s8-time", "#s8-big", "#s8-title"], { opacity: 0, filter: "blur(10px)", duration: 0.3, ease: "power2.in" }, D - 0.45);
      tl.fromTo("#s8-iris", { opacity: 0 }, { opacity: 1, duration: 0.3 }, D - 0.3);
      window.__timelines["s08-investigation"] = tl;
    })();
  </script>
