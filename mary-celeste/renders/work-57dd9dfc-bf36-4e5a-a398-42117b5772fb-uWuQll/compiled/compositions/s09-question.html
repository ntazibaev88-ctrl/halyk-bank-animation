  <script>
    (function () {
      const C = MC.cues("s09-cues"), D = C.dur;
      const tl = gsap.timeline({ paused: true });

      const cam = MC.keys([[0, { h: 980, s: 1.15, sky: 0 }], [D, { h: 640, s: 0.42, sky: -330 }, "power1.inOut"]]);
      MC.drive(tl, D, (t) => {
        const c = cam(t);
        sea(t, { horizon: c.h });
        const lay = 2, xs = [380, 540, 700].map((x) => sea.height(lay, x, t, c.h));
        const y = Math.min(...xs) * 0.5 + xs[1] * 0.5;
        $("s9-ship").style.transform = `translate(0px, ${y - 304}px) scale(${c.s}) rotate(${(xs[2] - xs[0]) * 0.06}deg)`;
        $("s9-sky").style.transform = `translateY(${c.sky}px)`;
        $("s9-moon").style.transform = `translateY(${c.sky * 0.6}px)`;
        $("s9-glint").style.transform = `translateY(${c.h - 980}px)`;
        $("s9-fog-1").style.transform = `translate(${-t * 40}px, ${c.h - 980}px)`;
        $("s9-fog-2").style.transform = `translate(${-t * 25 - 500}px, ${c.h - 980}px)`;
      });

      // iris opens from the magnifier of the previous scene
      tl.fromTo("#s9-iris", { clipPath: "circle(100% at 50% 52%)", opacity: 1 },

      // the question lands after "Как думаете,"
