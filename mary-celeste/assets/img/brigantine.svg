<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <!-- Brigantine, side view, bow to the right. Square-rigged foremast, fore-and-aft mainmast.
       Drawn as a generic period silhouette: an illustration, not a record of the real ship. -->
  <defs>
    <linearGradient id="sail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9d2da" stop-opacity="0.78"/>
      <stop offset="0.55" stop-color="#93a1ae" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#5d6b78" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="sailShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1118" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b1118" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b232c"/>
      <stop offset="0.35" stop-color="#0d1319"/>
      <stop offset="1" stop-color="#05080b"/>
    </linearGradient>
  </defs>

  <!-- rigging: stays, backstays, shrouds -->
  <g stroke="#0b1118" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.95">
    <path d="M770 92 L1168 470"/>
    <path d="M770 130 L1085 498"/>
    <path d="M450 80 L758 520"/>
    <path d="M450 80 L258 548"/>
    <path d="M770 92 L700 540 M770 92 L735 540 M770 92 L812 536 M770 92 L842 534"/>
    <path d="M450 80 L392 548 M450 80 L420 548 M450 80 L486 546 M450 80 L516 546"/>
    <path d="M1168 470 L1135 560"/>
  </g>

  <!-- jibs -->
  <path d="M782 150 L1150 470 L925 512 Z" fill="url(#sail)"/>
  <path d="M778 200 L1072 500 L880 520 Z" fill="url(#sail)" opacity="0.92"/>
  <!-- main staysail -->
  <path d="M762 175 L740 515 L520 520 Z" fill="url(#sail)" opacity="0.8"/>

  <!-- foremast square sails: course, topsail, topgallant (royal furled) -->
  <path d="M640 300 L900 300 Q 915 390 912 455 Q 770 440 628 455 Q 625 390 640 300 Z" fill="url(#sail)"/>
  <path d="M640 300 L900 300 Q 915 390 912 455 Q 770 440 628 455 Q 625 390 640 300 Z" fill="url(#sailShade)"/>
  <path d="M662 212 L878 212 Q 890 255 892 294 L648 294 Q 650 255 662 212 Z" fill="url(#sail)"/>
  <path d="M680 148 L860 148 Q 868 178 870 206 L670 206 Q 672 178 680 148 Z" fill="url(#sail)" opacity="0.9"/>
  <g stroke="#0b1118" stroke-linecap="round">
    <path d="M626 300 L914 300" stroke-width="5"/>
    <path d="M646 212 L894 212" stroke-width="4.5"/>
    <path d="M666 148 L874 148" stroke-width="4"/>
    <path d="M690 108 L850 108" stroke-width="7"/>
  </g>

  <!-- mainmast: gaff mainsail + gaff topsail -->
  <path d="M446 190 L290 128 L196 500 L446 492 Z" fill="url(#sail)"/>
  <path d="M446 190 L290 128 L196 500 L446 492 Z" fill="url(#sailShade)"/>
  <path d="M446 96 L446 182 L300 124 Z" fill="url(#sail)" opacity="0.85"/>
  <g stroke="#0b1118" stroke-linecap="round" fill="none">
    <path d="M450 188 L284 122" stroke-width="5"/>
    <path d="M452 494 L168 506" stroke-width="5.5"/>
  </g>

  <!-- masts and bowsprit -->
  <g stroke="#0b1118" stroke-linecap="round">
    <path d="M770 545 L770 72" stroke-width="11"/>
    <path d="M770 120 L770 52" stroke-width="6"/>
    <path d="M450 550 L450 64" stroke-width="12"/>
    <path d="M450 110 L450 44" stroke-width="6"/>
    <path d="M1000 540 L1172 468" stroke-width="10"/>
  </g>

  <!-- hull -->
  <path d="M138 532 C 420 556 760 556 1012 520 L1032 518 C 1012 580 990 628 962 662 L 214 668 C 182 650 154 596 138 532 Z" fill="url(#hull)"/>
  <!-- bulwark rail, light catching the sheer -->
  <path d="M140 534 C 420 558 760 558 1014 522" stroke="#7d8d9c" stroke-opacity="0.55" stroke-width="2.5" fill="none"/>
  <path d="M150 560 C 430 584 760 582 1004 552" stroke="#4a5866" stroke-opacity="0.35" stroke-width="1.5" fill="none"/>
  <!-- deckhouse -->
  <path d="M520 520 L640 520 L640 548 L520 548 Z" fill="#0d1319"/>
  <!-- boot-top -->
  <path d="M206 650 C 480 662 760 660 976 640" stroke="#8e2a24" stroke-opacity="0.55" stroke-width="3" fill="none"/>
</svg>
