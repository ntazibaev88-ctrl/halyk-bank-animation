      const t2 = MC.word(C, "n13", "из-за") - 0.2;            // version 2
      const t3 = MC.word(C, "n13", "неисправн") - 0.25;       // version 3
      const tR = C.seg.n14.s - 0.15;                         // recap

      /* procedural layers */
      const waterK = MC.keys([[t3 + 0.2, { y: 560 }], [t3 + 1.6, { y: 330 }, "power2.out"]]);
      function water(t) { return waterK(t).y; }
      const sea = MC.sea($("s7-sea"), { layers: 7, storm: 1.0, seed: 77, far: [50, 72, 96], near: [3, 7, 12], spread: 0.7 });
      const wind = MC.motes($("s7-wind"), { seed: 9, count: 160, vx: -900, vy: 160, streak: 60, alpha: 0.28, color: "190,205,220" });
      const H = 980;
      const calm = MC.keys([[t0 - 0.3, { k: 0 }], [t0 + 0.6, { k: 1 }]]);
      MC.drive(tl, D, (t) => {
        const k = calm(t).k;
        sea(t * (1 - 0.45 * k), { horizon: H });
        wind(t, 1 - 0.85 * k);
        const xs = [260, 540, 820].map((x) => sea.height(3, x, t * (1 - 0.45 * k), H));
        const y = Math.min(...xs) - 6;
        const rot = (Math.atan2(xs[2] - xs[0], 560) * 57.3) * 1.3 + Math.sin(t * 1.4) * 6 * (1 - k);
        const shipX = k * 170, shipS = 1 - 0.3 * k;
        $("s7-ship").style.transform = `translate(${shipX}px, ${y - (620 + 467 * 0.76)}px) rotate(${rot}deg) scale(${shipS})`;
        // the yawl pulls away from the ship, still on a line
        const p = MC.clamp((t - t0 - 0.3) / 3.0);
        const sx = 540 + shipX - 160, sy = y - 20;
        const bx = sx - 40 - 330 * MC.smooth(p), by = sea.height(5, sx - 300 * p, t, H) - 30;
        $("s7-yawl").style.transform = `translate(${bx - 75}px, ${by - 30}px) rotate(${Math.sin(t * 2) * 6}deg)`;
        $("s7-tow-line").setAttribute("d", `M${sx} ${sy} Q ${(sx + bx) / 2} ${Math.max(sy, by) + 40} ${bx + 60} ${by - 6}`);
        // vapor wisps rise from the barrels
        [[250, 0], [430, 1.3], [610, 2.1], [370, 3.0]].forEach(([vx, ph], i) => {
          let d = `M${vx} 150`;
          for (let s = 1; s <= 8; s++) { const yy = 150 - s * 16; d += ` L${vx + Math.sin(t * 2.2 + ph + s * 0.7) * (6 + s * 2.5)} ${yy}`; }
          $("s7-v" + (i + 1)).setAttribute("d", d);
        });
        const lvl = water(t);
        $("s7-water").setAttribute("y", lvl);
        let wd = `M0 ${lvl}`;
        for (let x = 0; x <= 900; x += 30) wd += ` L${x} ${lvl + Math.sin(x * 0.03 + t * 3) * 6}`;
        $("s7-water-top").setAttribute("d", wd);
      });

      const chip = (id, at) => {
        tl.to(id, { backgroundColor: "#e0392f", borderColor: "#e0392f", color: "#ffffff", duration: 0.15 }, at);
      };

      /* version 1 — storm */
      tl.fromTo("#s7-storm", { filter: "blur(12px)" }, { filter: "blur(0px)", duration: 0.3 }, 0);
      tl.fromTo("#s7-head", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.1);
      chip("#s7-c1", 0.3);
      tl.fromTo("#s7-p1", { opacity: 0 }, { opacity: 1, duration: 0.01 }, 0.25);
      MC.blurWords(tl, $("s7-h1"), 0.25, { stagger: 0.1 });
      [[1.0, 0.9], [1.35, 0.6], [2.9, 0.5]].forEach(([at, a]) => {
        tl.to("#s7-flash", { opacity: a, duration: 0.04 }, at); tl.to("#s7-flash", { opacity: 0, duration: 0.25 }, at + 0.06);
      });
      tl.to("#s7-p1", { opacity: 0, filter: "blur(8px)", duration: 0.2 }, t0 - 0.2);

      /* the abandon-ship beat: a calmer sea, the yawl leaves the ship */
      tl.fromTo("#s7-p0", { opacity: 0 }, { opacity: 1, duration: 0.01 }, t0);
      MC.blurWords(tl, $("s7-h0"), t0, { stagger: 0.08 });
      tl.fromTo(["#s7-yawl", "#s7-tow"], { opacity: 0 }, { opacity: 1, duration: 0.4 }, t0 + 0.3);
      tl.fromTo("#s7-f0", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, t0 + 0.9);
      tl.to(["#s7-p0", "#s7-f0"], { opacity: 0, filter: "blur(8px)", duration: 0.2 }, t2 - 0.2);

      /* version 2 — alcohol fumes in the hold */
      tl.fromTo("#s7-bp", { opacity: 0, scale: 1.1 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, t2 - 0.1);
      tl.to("#s7-storm", { opacity: 0, duration: 0.3 }, t2);
      chip("#s7-c2", t2);
      tl.fromTo("#s7-p2", { opacity: 0 }, { opacity: 1, duration: 0.01 }, t2);
      MC.blurWords(tl, $("s7-h2"), t2, { stagger: 0.1 });
      tl.fromTo("#s7-vapor", { opacity: 0 }, { opacity: 0.9, duration: 0.4 }, t2 + 0.3);
      tl.fromTo("#s7-warn", { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, t2 + 0.6);
      tl.fromTo("#s7-f2", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, t2 + 0.4);
      tl.to(["#s7-p2", "#s7-f2", "#s7-vapor", "#s7-warn"], { opacity: 0, filter: "blur(6px)", duration: 0.2 }, t3 - 0.2);

      /* version 3 — the pumps, water rising */
      chip("#s7-c3", t3);
      tl.fromTo("#s7-p3", { opacity: 0 }, { opacity: 1, duration: 0.01 }, t3);
      MC.blurWords(tl, $("s7-h3"), t3, { stagger: 0.1 });
      tl.fromTo("#s7-pump", { opacity: 0 }, { opacity: 1, duration: 0.3 }, t3 + 0.1);
      tl.fromTo("#s7-x", { opacity: 0, scale: 1.6, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.2, ease: "power4.in" }, t3 + 0.8);
      tl.fromTo("#s7-f3", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, t3 + 0.3);
      tl.to(["#s7-p3", "#s7-f3", "#s7-head"], { opacity: 0, duration: 0.2 }, tR - 0.1);

      /* recap — "Но это только версии." */
      tl.fromTo("#s7-recap", { opacity: 0 }, { opacity: 1, duration: 0.3 }, tR);
      tl.to("#s7-bp", { filter: "blur(8px)", duration: 0.3 }, tR);
      MC.slam(tl, $("s7-rt1"), tR + 0.05, { from: 1.2, dur: 0.3 });
      MC.blurWords(tl, $("s7-rt2"), tR + 0.55, { stagger: 0.1, dur: 0.25 });
      tl.fromTo("#s7-row", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, tR + 1.2);

      /* exit — documents slide down onto the desk of the next scene */
      tl.to("#s7-recap", { y: 260, opacity: 0, filter: "blur(10px)", duration: 0.35, ease: "power3.in" }, D - 0.35);
      tl.to("#s7-bp", { opacity: 0, duration: 0.3 }, D - 0.3);
      window.__timelines["s07-theories"] = tl;
    })();
  </script>
</template>
