    (function () {
      const C = MC.cues("s01-cues"), D = C.dur;
      const tl = gsap.timeline({ paused: true });
      const $ = (id) => document.getElementById(id);

      /* ── procedural world: sea, ship bob, rain, drifting cloud and fog ── */
      const seaOpts = { layers: 8, storm: 0.85, seed: 1872, far: [58, 82, 106], near: [2, 6, 10], spread: 0.62 };
      const back = MC.sea($("s1-sea-back"), { ...seaOpts, only: [0, 3] });
      const front = MC.sea($("s1-sea-front"), { ...seaOpts, only: [4, 7] });
      const rain = MC.motes($("s1-rain"), { seed: 5, count: 220, vx: -120, vy: 1500, streak: 46, alpha: 0.22, color: "170,190,210" });
      const ship = $("s1-ship");
      const H = 900; // horizon
      MC.drive(tl, D, (t) => {
        back(t, { horizon: H }); front(t, { horizon: H }); rain(t);
        // the hull rides layer 4: its waterline (1127 px) sits just under that surface
        const xs = [220, 380, 540, 700, 860].map((x) => front.height(4, x, t, H));
        const y = Math.min(...xs) * 0.6 + (xs.reduce((a, b) => a + b) / 5) * 0.4 - 6, yl = xs[0], yr = xs[4];
        const rot = Math.atan2(yr - yl, 560) * 57.3 * 0.7;
        ship.style.transform = `translate(0px, ${y + 14 - 1127}px) rotate(${rot}deg)`;
        $("s1-cloud-a").style.transform = `translateX(${-t * 22}px)`;
        $("s1-cloud-b").style.transform = `translateX(${-t * 38 - 600}px)`;
        $("s1-horizon-fog").style.transform = `translateX(${-t * 30}px)`;
        $("s1-fog-f1").style.transform = `translateX(${-t * 70 - 300}px)`;
      });

      /* ── 0.0–2.0 hook: sonar finds a ship in the dark; push; title ── */
      tl.fromTo("#s1-dark", { opacity: 0.86 }, { opacity: 0.6, duration: 0.9, ease: "power1.out" }, 0);
      tl.fromTo("#s1-ring-1", { attr: { r: 30 }, opacity: 0.95 }, { attr: { r: 820 }, opacity: 0, duration: 1.6, ease: "power2.out" }, 0.1);
      tl.fromTo("#s1-ring-2", { attr: { r: 30 }, opacity: 0.6 }, { attr: { r: 820 }, opacity: 0, duration: 1.6, ease: "power2.out" }, 0.45);
      tl.fromTo("#s1-grid", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.15);
      tl.to("#s1-grid", { opacity: 0, duration: 0.2 }, 1.9);
      tl.fromTo("#s1-cam", { scale: 1.0, transformOrigin: "540px 930px", filter: "blur(0px)" },
        { scale: 1.42, duration: 1.0, ease: "power3.in" }, 0.92);
      tl.to("#s1-cam", { filter: "blur(6px)", duration: 0.5, ease: "power2.in" }, 1.42);
      tl.fromTo("#s1-sweep", { rotation: -40, opacity: 0 }, { rotation: 320, opacity: 1, duration: 1.0, ease: "power1.inOut" }, 0.95);
      tl.to("#s1-sweep", { opacity: 0, duration: 0.1 }, 1.96);
      MC.slam(tl, $("s1-t1"), 1.0, { from: 1.5, dur: 0.32 });
      tl.to("#s1-t1", { opacity: 0, filter: "blur(10px)", scale: 0.96, duration: 0.12, ease: "power2.in" }, 1.86);

      /* ── 2.0 impact: lights up, the ship alone in the Atlantic ── */
      tl.set("#s1-cam", { scale: 1.0, filter: "blur(0px)" }, 1.98);
      tl.set("#s1-dark", { opacity: 0 }, 1.98);
      tl.fromTo("#s1-flash", { opacity: 0 }, { opacity: 1, duration: 0.05 }, 1.98);
      tl.to("#s1-flash", { opacity: 0.15, duration: 0.12 }, 2.05);
      tl.to("#s1-flash", { opacity: 0.7, duration: 0.05 }, 2.2);
      tl.to("#s1-flash", { opacity: 0, duration: 0.6, ease: "power2.out" }, 2.27);
      MC.slam(tl, $("s1-t2"), 2.0, { from: 1.12, dur: 0.3 });
      tl.to("#s1-cam", { scale: 1.1, duration: 4.2, ease: "power1.inOut" }, 2.0);
      MC.out(tl, "#s1-t2", 5.1, 0.25);

      /* ── n02 "Он цел. Груз на месте." — closer, callouts ── */
      const tHull = MC.word(C, "n02", "цел") - 0.1, tCargo = MC.word(C, "n02", "груз") - 0.1;
      tl.set("#s1-cam", { scale: 1.5, y: -170 }, C.seg.n02.s - 0.25);
      tl.to("#s1-cam", { scale: 1.58, y: -190, duration: 3.6, ease: "none" }, C.seg.n02.s - 0.25);
      [["hull", tHull], ["cargo", tCargo]].forEach(([k, at]) => {
        tl.fromTo("#s1-dot-" + k, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" }, at);
        tl.fromTo("#s1-lead-" + k, { scaleY: 0 }, { scaleY: 1, duration: 0.25, ease: "power2.out" }, at + 0.08);
        MC.wipe(tl, $("s1-call-" + k), at + 0.18, { dur: 0.4 });
      });
      const callsOut = C.seg.n03.s - 0.2;
      tl.to(["#s1-call-hull", "#s1-call-cargo", "#s1-lead-hull", "#s1-lead-cargo", "#s1-dot-hull", "#s1-dot-cargo"],
        { opacity: 0, duration: 0.2 }, callsOut);

      /* ── n03 "Но на борту нет ни одного человека." — deck scan, 10 → 0 ── */
      const t3 = C.seg.n03.s;
      tl.set("#s1-cam", { scale: 1.22, y: -60 }, t3 - 0.15);
      tl.to("#s1-cam", { scale: 1.12, y: -30, duration: D - t3, ease: "power1.inOut" }, t3 - 0.15);
      tl.fromTo("#s1-flash", { opacity: 0 }, { opacity: 0.55, duration: 0.05 }, t3 - 0.15);
      tl.to("#s1-flash", { opacity: 0, duration: 0.5 }, t3 - 0.1);
      tl.fromTo("#s1-scan", { opacity: 0, x: 0 }, { opacity: 1, duration: 0.2 }, t3 + 0.1);
      tl.to("#s1-scan", { x: 600, duration: 1.7, ease: "power1.inOut" }, t3 + 0.2);
      tl.to("#s1-scan", { opacity: 0, duration: 0.25 }, t3 + 1.9);
      MC.blurWords(tl, $("s1-count"), t3 + 0.15, { stagger: 0.06 });
      MC.count(tl, $("s1-count-n"), t3 + 0.35, 10, 0, 1.5);
      tl.to("#s1-count-n", { color: "#e0392f", duration: 0.15 }, t3 + 1.85);

      /* ── exit: fog floods the frame ── */
      tl.to("#s1-count", { opacity: 0, filter: "blur(8px)", duration: 0.25 }, D - 0.95);
      tl.fromTo("#s1-flood", { opacity: 0 }, { opacity: 1, duration: 0.75, ease: "power2.in" }, D - 0.75);

      window.__timelines["s01-mystery"] = tl;
    })();
