        [0, { cx: 2060, cy: 1020, s: 0.255 }],
        [tN5 - 0.5, { cx: 2060, cy: 1020, s: 0.275 }, "none"],
        [tN5 + 0.4, { cx: 600, cy: 1010, s: 1.0 }, "power3.inOut"],
        [tN5 + 1.2, { cx: 640, cy: 1015, s: 0.95 }, "power1.out"],
      ]);
      const pull = MC.keys([[tGe - 0.55, { k: 0 }], [tGe + 0.45, { k: 1 }, "power3.inOut"]]);
      const over = { cx: 2060, cy: 1020, s: 0.255 };
      const toScreen = (c, x, y) => [540 + (x - c.cx) * c.s, 900 + (y - c.cy) * c.s];
      const unproject = (x, y) => {
        const lon = x / 40 - 84, m = 69.7103 - y / 40;
        const lat = (2 * Math.atan(Math.exp((m * Math.PI) / 180)) - Math.PI / 2) * 57.2958;
        const f = (v) => `${Math.floor(Math.abs(v))}°${String(Math.floor((Math.abs(v) % 1) * 60)).padStart(2, "0")}′`;
        return `${f(lat)} N · ${f(lon)} ${lon < 0 ? "W" : "E"}`;
      };

      MC.drive(tl, D, (t) => {
        route.style.strokeDasharray = `${L}`; route.style.strokeDashoffset = `${L * (1 - P.route)}`;
        wake.style.strokeDasharray = `${wakeL}`; wake.style.strokeDashoffset = `${wakeL * (1 - P.ship)}`;
        const pt = route.getPointAtLength(L * P.ship), pt2 = route.getPointAtLength(L * Math.min(1, P.ship + 0.004));
        const ang = Math.atan2(pt2.y - pt.y, pt2.x - pt.x) * 57.3;
        // camera: keyed, then follows the ship, then pulls back to the whole Atlantic
        let c = cam(t);
        if (t > tN5 + 1.2) {
          const f = MC.smooth((t - tN5 - 1.2) / 0.8);
          const follow = { cx: pt.x + 120, cy: 0.5 * pt.y + 0.5 * 1015, s: 0.95 - 0.25 * MC.smooth((t - tN5 - 1.2) / 2.5) };
          c = { cx: MC.lerp(c.cx, follow.cx, f), cy: MC.lerp(c.cy, follow.cy, f), s: MC.lerp(c.s, follow.s, f) };
        }
        const k = pull(t).k;
        c = { cx: MC.lerp(c.cx, over.cx, k), cy: MC.lerp(c.cy, over.cy, k), s: Math.exp(MC.lerp(Math.log(c.s), Math.log(over.s), k)) };
        $("s2-map").style.transform = `translate(${540 - c.cx * c.s}px, ${900 - c.cy * c.s}px) scale(${c.s})`;
        $("s2-ship").style.transform = `translate(${pt.x}px, ${pt.y}px) rotate(${ang * 0.3}deg) scale(${1 / Math.max(c.s, 0.6)})`;
        const [nx, ny] = toScreen(c, 399.6, 1002.7), [gx, gy] = toScreen(c, 3717.2, 801.7), [ox, oy] = toScreen(c, 1750, 1380);
        $("s2-pin-ny").style.transform = `translate(${nx}px, ${ny}px)`;
        $("s2-pin-genoa").style.transform = `translate(${gx}px, ${gy}px)`;
        $("s2-ocean").style.left = ox + "px"; $("s2-ocean").style.top = oy + "px";
        if (t > tN5 + 1.0) $("s2-coords").textContent = unproject(pt.x, pt.y);
      });

      /* n04 — "Это произошло в декабре 1872 года." over the whole Atlantic */
      tl.fromTo("#s2-map", { opacity: 0, filter: "blur(14px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.9, ease: "power2.out" }, 0);
      tl.fromTo("#s2-ocean", { opacity: 0 }, { opacity: 1, duration: 1.0 }, 0.6);
      tl.to("#s2-ocean", { opacity: 0, duration: 0.3 }, tN5 - 0.5);
      MC.letters(tl, $("s2-date-m"), MC.word(C, "n04", "декабр") - 0.05, { stagger: 0.045 });
      MC.slam(tl, $("s2-date-y"), MC.word(C, "n04", "1872") - 0.02, { from: 1.25, dur: 0.4 });
      tl.to(["#s2-date-m", "#s2-date-y"], { opacity: 0, filter: "blur(10px)", duration: 0.25, ease: "power2.in" }, tN5 - 0.35);

      /* n05 — the ship's name, New York, the planned route to Genoa */
      MC.blurWords(tl, $("s2-name"), tN5 + 0.05, { stagger: 0.12, dur: 0.3 });
      tl.to("#s2-name", { opacity: 0, filter: "blur(8px)", duration: 0.25 }, tGe - 0.6);
      tl.fromTo("#s2-pin-ny", { opacity: 0 }, { opacity: 1, duration: 0.3 }, tN5 + 0.45);
      tl.fromTo("#s2-pin-ny .s2-ring", { scale: 1, opacity: 1 }, { scale: 4, opacity: 0, duration: 1.2, ease: "power2.out" }, tN5 + 0.5);
      tl.fromTo("#s2-ship", { opacity: 0 }, { opacity: 1, duration: 0.2 }, tN5 + 0.7);
      tl.fromTo("#s2-ship img", { scale: 0.4 }, { scale: 1, duration: 0.4, ease: "back.out(1.5)" }, tN5 + 0.7);
      tl.fromTo("#s2-coords", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, tN5 + 0.9);
      tl.to("#s2-coords", { opacity: 0, duration: 0.25 }, tGe - 0.5);
      tl.fromTo("#s2-pin-genoa", { opacity: 0 }, { opacity: 1, duration: 0.3 }, tGe);
      tl.fromTo("#s2-pin-genoa .s2-ring", { scale: 1, opacity: 1 }, { scale: 4, opacity: 0, duration: 1.2, ease: "power2.out" }, tGe + 0.05);
      tl.to("#s2-ocean", { opacity: 1, duration: 0.4 }, tGe + 0.2);

      /* exit: horizontal whip into the paper of the next scene */
      tl.to("#s2-map", { filter: "blur(14px)", duration: 0.3, ease: "power3.in" }, D - 0.32);
      tl.fromTo("#s2-whip", { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "power2.in" }, D - 0.24);

      window.__timelines["s02-voyage"] = tl;
    })();
  </script>
</template>
